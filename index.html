      reading:{ title:'La valigia di Luca',
        text:'Ieri sono andata a Venezia con Luca. Il treno è partito in ritardo. Sono arrivata a Venezia alle nove. Sono scesa dal treno… ma la valigia di Luca è ancora sul treno! Luca è tornato alla stazione.',
        tr:'Gestern bin ich mit Luca nach Venedig gefahren. Der Zug ist verspätet abgefahren. Ich bin um neun in Venedig angekommen. Ich bin aus dem Zug ausgestiegen … aber Lucas Koffer ist noch im Zug! Luca ist zum Bahnhof zurückgegangen.',
        qs:[['Wie war der Zug?',['Verspätet','Pünktlich','Voll','Leer']],['Was ist mit Lucas Koffer passiert?',['Er ist noch im Zug','Er wurde gestohlen','Er ist im Hotel','Er ist kaputt']]] } },
    n11:{ title:'In macchina', de:'Mit dem Auto',
      words:[['voglio','ich will','verben'],['posso','ich kann, ich darf','verben'],['devo','ich muss','verben'],['noleggiare','mieten','verben viaggio'],['la macchina','das Auto'],['l’autostrada','die Autobahn'],['il distributore','die Tankstelle'],['la benzina','das Benzin'],['fare benzina','tanken','verben viaggio'],['parcheggiare','parken','verben viaggio'],['il parcheggio','der Parkplatz']],
      sentences:[['Voglio noleggiare una macchina.','Ich will ein Auto mieten.'],['Come arrivo all’autostrada?','Wie komme ich zur Autobahn?'],['Posso parcheggiare qui?','Darf ich hier parken?'],['Devo fare benzina.','Ich muss tanken.'],['Dov’è il distributore più vicino?','Wo ist die nächste Tankstelle?'],['Il parcheggio è chiuso.','Der Parkplatz ist geschlossen.'],['Può parcheggiare di fronte all’albergo.','Sie können gegenüber dem Hotel parken.']],
      reading:{ title:'L’autonoleggio', dialog:true,
        text:'— Buongiorno! Voglio noleggiare una macchina per tre giorni.\n— Ecco la chiave.\n— Grazie! Come arrivo all’autostrada?\n— Sempre dritto e al semaforo giri a destra.\n— E devo fare benzina?\n— No, la macchina ha il pieno. Ma può parcheggiare solo nel parcheggio dell’albergo.',
        tr:'– Guten Tag! Ich will für drei Tage ein Auto mieten. – Hier ist der Schlüssel. – Danke! Wie komme ich zur Autobahn? – Immer geradeaus und an der Ampel rechts abbiegen. – Und muss ich tanken? – Nein, das Auto ist vollgetankt. Aber Sie dürfen nur auf dem Parkplatz des Hotels parken.',
        qs:[['Für wie lange mietet die Person das Auto?',['Drei Tage','Eine Woche','Einen Tag','Zwei Tage']],['Muss die Person tanken?',['Nein, der Tank ist voll','Ja, sofort','Ja, an der Autobahn','Das steht nicht im Text']],['Wo darf die Person parken?',['Nur auf dem Hotelparkplatz','Überall','An der Kirche','Gar nicht']]] } },
    n12:{ title:'Una giornata in città', de:'Ein Tag in der Stadt',
      words:[['la mattina','am Morgen','zeit'],['il pomeriggio','am Nachmittag','zeit'],['la sera','am Abend','zeit'],['mi sveglio','ich wache auf','verben'],['mi alzo','ich stehe auf','verben'],['mi preparo','ich mache mich fertig','verben'],['la colazione','das Frühstück'],['mi perdo','ich verlaufe mich','verben viaggio'],['mi fermo','ich halte an, ich bleibe stehen','verben viaggio'],['mi siedo','ich setze mich','verben viaggio'],['mi riposo','ich ruhe mich aus','verben']],
      sentences:[['La mattina mi sveglio alle otto.','Am Morgen wache ich um acht auf.'],['Mi alzo e mi preparo.','Ich stehe auf und mache mich fertig.'],['Mi perdo sempre!','Ich verlaufe mich immer!'],['Il pomeriggio mi siedo in piazza.','Am Nachmittag setze ich mich auf den Platz.'],['La sera mi riposo in albergo.','Am Abend ruhe ich mich im Hotel aus.'],['Mi fermo al semaforo.','Ich halte an der Ampel an.'],['La colazione è alle otto.','Das Frühstück ist um acht.']],
      reading:{ title:'Vacanze a Roma',
        text:'Sono in vacanza a Roma. La mattina mi sveglio alle sette. Mi alzo, mi preparo e faccio colazione in albergo. Poi prendo l’autobus. In città mi perdo sempre! Il pomeriggio mi siedo in piazza con un gelato. La sera mi riposo.',
        tr:'Ich bin im Urlaub in Rom. Am Morgen wache ich um sieben auf. Ich stehe auf, mache mich fertig und frühstücke im Hotel. Dann nehme ich den Bus. In der Stadt verlaufe ich mich immer! Am Nachmittag setze ich mich mit einem Eis auf den Platz. Am Abend ruhe ich mich aus.',
        qs:[['Wann wacht die Person auf?',['Um sieben','Um acht','Um neun','Um sechs']],['Was passiert in der Stadt immer?',['Sie verläuft sich','Sie verliert den Geldbeutel','Sie verpasst den Bus','Sie trifft Freunde']],['Was macht sie am Nachmittag?',['Sie sitzt mit einem Eis auf dem Platz','Sie schläft','Sie besucht ein Museum','Sie fährt Auto']]] } },
    n14:{ title:'Un guasto in autostrada', de:'Panne auf der Autobahn',
      words:[['mentre','während','zeit'],['guidavo','ich fuhr (Auto)','verben viaggio'],['pioveva','es regnete','verben'],['all’improvviso','plötzlich','zeit'],['si è fermata','ist stehen geblieben','verben viaggio'],['il guasto','die Panne'],['il carro attrezzi','der Abschleppwagen'],['aspettavo','ich wartete','verben'],['il meccanico','der Mechaniker','leute viaggio'],['è arrivato','ist gekommen','verben']],
      sentences:[['Mentre guidavo in autostrada, pioveva.','Während ich auf der Autobahn fuhr, regnete es.'],['All’improvviso la macchina si è fermata.','Plötzlich ist das Auto stehen geblieben.'],['Ho chiamato il carro attrezzi.','Ich habe den Abschleppwagen gerufen.'],['Mentre aspettavo, pioveva.','Während ich wartete, regnete es.'],['Il meccanico è arrivato alle sei.','Der Mechaniker ist um sechs gekommen.'],['Il guasto era piccolo.','Die Panne war klein.']],
      reading:{ title:'Sull’autostrada',
        text:'Pioveva e io guidavo sull’autostrada per Bologna. All’improvviso la macchina si è fermata! Un guasto. Ho chiamato il carro attrezzi. Mentre aspettavo, è arrivata una macchina. Era un meccanico! In dieci minuti la macchina era a posto.',
        tr:'Es regnete, und ich fuhr auf der Autobahn nach Bologna. Plötzlich ist das Auto stehen geblieben! Eine Panne. Ich habe den Abschleppwagen gerufen. Während ich wartete, kam ein Auto. Es war ein Mechaniker! In zehn Minuten war das Auto wieder in Ordnung.',
        qs:[['Wie war das Wetter?',['Es regnete','Es war heiß','Es war neblig','Es schneite']],['Wer half am Ende?',['Ein Mechaniker','Der Abschleppwagen','Die Polizei','Luca']],['Wie lange dauerte die Reparatur?',['Zehn Minuten','Eine Stunde','Einen Tag','Drei Minuten']]] } },
    n15:{ title:'Domani a Firenze', de:'Morgen in Florenz',
      words:[['domani','morgen','zeit'],['la prossima settimana','nächste Woche','zeit'],['visiterò','ich werde besichtigen','verben viaggio'],['comprerò','ich werde kaufen','verben'],['partiremo','wir werden abfahren','verben viaggio'],['prenderemo','wir werden nehmen','verben viaggio'],['sarà','wird sein','verben'],['farà bel tempo','es wird schönes Wetter','verben viaggio'],['la mostra','die Ausstellung'],['la guida','der Reiseführer, die Führung']],
      sentences:[['Domani visiterò il museo.','Morgen werde ich das Museum besichtigen.'],['Partiremo alle otto.','Wir werden um acht abfahren.'],['Prenderemo il treno per Firenze.','Wir werden den Zug nach Florenz nehmen.'],['Domani farà bel tempo.','Morgen wird schönes Wetter sein.'],['La mostra sarà aperta.','Die Ausstellung wird geöffnet sein.'],['La prossima settimana comprerò i biglietti.','Nächste Woche werde ich die Karten kaufen.'],['Con la guida visiterò la chiesa.','Mit der Führung werde ich die Kirche besichtigen.']],
      reading:{ title:'Il programma',
        text:'Domani io e Luca partiremo per Firenze. Prenderemo il treno delle otto. A Firenze visiteremo il museo degli Uffizi e la mostra di Leonardo. Luca comprerà i biglietti. Farà bel tempo: la sera mangeremo in piazza.',
        tr:'Morgen werden Luca und ich nach Florenz fahren. Wir werden den Zug um acht nehmen. In Florenz werden wir die Uffizien und die Leonardo-Ausstellung besuchen. Luca wird die Karten kaufen. Es wird schönes Wetter sein: Am Abend werden wir auf dem Platz essen.',
        qs:[['Wie fahren die beiden nach Florenz?',['Mit dem Zug um acht','Mit dem Auto','Mit dem Bus','Mit dem Zug um neun']],['Wer kauft die Karten?',['Luca','Die Erzählperson','Die Reiseleiterin','Niemand']],['Was machen sie am Abend?',['Sie essen auf dem Platz','Sie fahren zurück','Sie gehen ins Museum','Sie schlafen']]] } },
    n16:{ title:'Mi potrebbe aiutare?', de:'Könnten Sie mir helfen?',
      words:[['vorrei','ich hätte gern, ich möchte','verben'],['mi piacerebbe','ich würde gern','verben'],['Mi potrebbe aiutare?','Könnten Sie mir helfen?','verben viaggio'],['potrebbe','könnten Sie','verben viaggio'],['sarebbe possibile','wäre es möglich','verben viaggio'],['saprebbe dirmi','könnten Sie mir sagen','verben viaggio'],['prenotare','reservieren, buchen','verben viaggio'],['chiamare un taxi','ein Taxi rufen','verben viaggio'],['un tavolo','ein Tisch'],['la camera doppia','das Doppelzimmer']],
      sentences:[['Vorrei prenotare un tavolo per due.','Ich möchte einen Tisch für zwei reservieren.'],['Mi potrebbe aiutare, per favore?','Könnten Sie mir bitte helfen?'],['Potrebbe chiamare un taxi?','Könnten Sie ein Taxi rufen?'],['Sarebbe possibile una camera doppia?','Wäre ein Doppelzimmer möglich?'],['Saprebbe dirmi dov’è la stazione?','Könnten Sie mir sagen, wo der Bahnhof ist?'],['Mi piacerebbe prenotare la guida.','Ich würde gern die Führung buchen.']],
      reading:{ title:'Al telefono', dialog:true,
        text:'— Albergo Bellavista, buongiorno!\n— Buongiorno! Vorrei prenotare una camera doppia per sabato.\n— Mi dispiace, sabato non è possibile.\n— Sarebbe possibile domenica?\n— Sì, domenica c’è una camera libera.\n— Grazie! Potrebbe prenotare anche un tavolo al ristorante?\n— Certo!',
        tr:'– Hotel Bellavista, guten Tag! – Guten Tag! Ich möchte ein Doppelzimmer für Samstag reservieren. – Tut mir leid, Samstag geht nicht. – Wäre Sonntag möglich? – Ja, am Sonntag ist ein Zimmer frei. – Danke! Könnten Sie auch einen Tisch im Restaurant reservieren? – Natürlich!',
        qs:[['Warum klappt Samstag nicht?',['Es ist kein Zimmer frei','Das Hotel ist geschlossen','Es ist zu teuer','Die Person hat keine Zeit']],['Was reserviert die Person noch?',['Einen Tisch im Restaurant','Ein Taxi','Eine Führung','Ein Auto']]] } }

  /* after: 2 wird wie bei den anderen Themen auf Lektion 5 umgerechnet, 7/10/13/15 bleiben (Lektion 8, 11, 14, 16) */
  stories:[
    { after:2, title:'La prima sera a Roma', de:'Der erste Abend in Rom',
      text:'Buonasera! Sono Anna e sono tedesca. Sono a Roma. Ho una prenotazione in un albergo piccolo, qui vicino alla stazione. La camera è piccola, ma non è cara. Ho la chiave! Ma dov’è il bagno? Scusi… il bagno è chiuso! Dov’è il bagno più vicino? E domani il museo è aperto?',
      tr:'Guten Abend! Ich bin Anna und ich bin Deutsche. Ich bin in Rom. Ich habe eine Reservierung in einem kleinen Hotel, hier in der Nähe des Bahnhofs. Das Zimmer ist klein, aber es ist nicht teuer. Ich habe den Schlüssel! Aber wo ist die Toilette? Entschuldigung … die Toilette ist geschlossen! Wo ist die nächste Toilette? Und ist das Museum morgen geöffnet?',
      qs:[['Wo ist das Hotel?',['In der Nähe des Bahnhofs','Neben dem Museum','Am Meer','Weit weg vom Zentrum']],['Was ist das Problem?',['Die Toilette ist geschlossen','Das Zimmer ist teuer','Anna hat keinen Schlüssel','Das Hotel ist voll']]],
      tf:[['Anna ist Deutsche.',true],['Das Zimmer ist groß.',false],['Das Zimmer ist nicht teuer.',true]] },
    { after:7, title:'Dov’è la farmacia?', de:'Wo ist die Apotheke?',
      text:'Luca si sente male: ha mal di testa e ha la febbre. Anna cerca una farmacia. «Scusi, c’è una farmacia qui vicino?» «Sì, sempre dritto, poi al semaforo giri a sinistra. La farmacia è in piazza, di fronte alla chiesa.» Anna arriva in piazza, ma la farmacia è chiusa! Apre alle quattro. Allora Anna prende l’autobus per l’ospedale.',
      tr:'Luca fühlt sich schlecht: Er hat Kopfschmerzen und Fieber. Anna sucht eine Apotheke. „Entschuldigung, gibt es hier in der Nähe eine Apotheke?“ „Ja, immer geradeaus, dann an der Ampel links abbiegen. Die Apotheke ist auf dem Platz, gegenüber der Kirche.“ Anna kommt auf dem Platz an, aber die Apotheke ist geschlossen! Sie öffnet um vier. Also nimmt Anna den Bus zum Krankenhaus.',
      qs:[['Was hat Luca?',['Kopfschmerzen und Fieber','Bauchschmerzen','Nichts','Er ist nur müde']],['Wo ist die Apotheke?',['Auf dem Platz, gegenüber der Kirche','Neben dem Bahnhof','Im Krankenhaus','An der Ampel']]],
      tf:[['Die Apotheke ist geöffnet.',false],['Die Apotheke öffnet um vier.',true],['Anna nimmt am Ende ein Taxi.',false]] },
    { after:10, title:'Il passaporto di Luca', de:'Lucas Reisepass',
      text:'Ieri io e Luca siamo andati all’aeroporto in macchina. All’aeroporto Luca ha cercato il passaporto… ma ha perso il passaporto! Ho chiamato l’albergo: «Il passaporto è qui, in camera!» Siamo tornati in albergo. Luca ha trovato il passaporto e siamo andati di nuovo all’aeroporto. Per fortuna l’aereo era in ritardo!',
      tr:'Gestern sind Luca und ich mit dem Auto zum Flughafen gefahren. Am Flughafen hat Luca seinen Reisepass gesucht … aber er hat ihn verloren! Ich habe im Hotel angerufen: „Der Reisepass ist hier, im Zimmer!“ Wir sind ins Hotel zurückgefahren. Luca hat den Pass gefunden, und wir sind noch einmal zum Flughafen gefahren. Zum Glück hatte das Flugzeug Verspätung!',
      qs:[['Wie fahren die beiden zum Flughafen?',['Mit dem Auto','Mit dem Zug','Mit dem Bus','Mit dem Taxi']],['Wo war der Reisepass?',['Im Hotelzimmer','Im Auto','Am Flughafen','Bei der Polizei']]],
      tf:[['Lucas Pass wurde gestohlen.',false],['Die beiden sind ins Hotel zurückgefahren.',true],['Das Flugzeug war pünktlich.',false]] },
    { after:13, title:'Il guasto', de:'Die Panne',
      text:'Da bambina andavamo in Sicilia ogni estate. Viaggiavamo in macchina sull’autostrada. Un anno, mentre pioveva, all’improvviso la macchina si è fermata. Un guasto! Mio padre ha chiamato il carro attrezzi. Mentre aspettavo in macchina, dormivo. Il meccanico è arrivato alle sei… di mattina! Era un guasto piccolo, ma che viaggio!',
      tr:'Als Kind fuhren wir jeden Sommer nach Sizilien. Wir reisten mit dem Auto über die Autobahn. In einem Jahr, während es regnete, blieb das Auto plötzlich stehen. Eine Panne! Mein Vater hat den Abschleppwagen gerufen. Während ich im Auto wartete, schlief ich. Der Mechaniker kam um sechs … am Morgen! Es war eine kleine Panne, aber was für eine Reise!',
      qs:[['Wohin fuhr die Familie jeden Sommer?',['Nach Sizilien','Nach Rom','Nach Venedig','In die Toskana']],['Was machte das Kind, während es wartete?',['Es schlief im Auto','Es aß Spaghetti','Es spielte im Regen','Es rief den Mechaniker']]],
      tf:[['Es regnete, als das Auto stehen blieb.',true],['Die Mutter rief den Abschleppwagen.',false],['Der Mechaniker kam um sechs Uhr morgens.',true]] },
    { after:15, title:'Un messaggio da Firenze', de:'Eine Nachricht aus Florenz',
      text:'Ciao Giulia! Sono a Firenze con Luca. Domani visiterò la mostra di Leonardo con la guida. Poi prenderemo il treno per Bologna: mi piacerebbe prenotare un tavolo «Da Paolo». La prossima settimana partiremo per Venezia. Farà bel tempo e sarà un sogno! E tu? Sarebbe possibile un caffè a Venezia? Anna',
      tr:'Hallo Giulia! Ich bin mit Luca in Florenz. Morgen werde ich mit einer Führung die Leonardo-Ausstellung besuchen. Dann werden wir den Zug nach Bologna nehmen: Ich würde gern einen Tisch bei „Da Paolo“ reservieren. Nächste Woche werden wir nach Venedig fahren. Es wird schönes Wetter sein, und es wird ein Traum! Und du? Wäre ein Kaffee in Venedig möglich? Anna',
      qs:[['Wo ist Anna gerade?',['In Florenz','In Venedig','In Bologna','In Rom']],['Was möchte Anna in Bologna?',['Einen Tisch bei „Da Paolo“ reservieren','Ein Museum besuchen','Ein Auto mieten','Giulia treffen']]],
      tf:[['Anna besucht morgen die Leonardo-Ausstellung.',true],['Nächste Woche fahren sie nach Rom.',false],['Anna möchte Giulia in Venedig auf einen Kaffee treffen.',true]] }
  ]
};

      n8:[['Lo scheletro è dietro la porta.','Das Skelett ist hinter der Tür.'],['Sotto il letto c’è un mostro!','Unter dem Bett ist ein Monster!'],['La candela è sopra la bara.','Die Kerze steht auf dem Sarg.'],['Davanti alla casa c’è una zucca.','Vor dem Haus ist ein Kürbis.'],['Accanto al quadro c’è una maschera.','Neben dem Bild ist eine Maske.'],['La chiave è sotto le scale.','Der Schlüssel ist unter der Treppe.']],
      l5:[['Ho sentito un lupo mannaro nel bosco.','Ich habe einen Werwolf im Wald gehört.'],['La finestra si è aperta da sola.','Das Fenster hat sich von selbst geöffnet.'],['Uno scheletro è apparso dietro la porta.','Hinter der Tür ist ein Skelett erschienen.'],['Abbiamo urlato nel cimitero.','Wir haben auf dem Friedhof geschrien.'],['Luca è entrato in cantina.','Luca ist in den Keller gegangen.'],['Siamo scappati dal bosco.','Wir sind aus dem Wald weggerannt.']],
      n10:[['Marco è andato alla festa vestito da scheletro.','Marco ist als Skelett verkleidet zur Party gegangen.'],['Ieri sera è venuto un lupo mannaro.','Gestern Abend ist ein Werwolf gekommen.'],['Siamo arrivati al cimitero a mezzanotte.','Wir sind um Mitternacht am Friedhof angekommen.'],['Luca è rimasto in cantina tutta la notte.','Luca ist die ganze Nacht im Keller geblieben.'],['La mummia è venuta alla festa?','Ist die Mumie zur Party gekommen?']],
      n11:[['Voglio vedere il cimitero di notte.','Ich will den Friedhof bei Nacht sehen.'],['Posso vedere la tomba?','Darf ich das Grab sehen?'],['Vuoi dormire nella casa stregata?','Willst du im Spukhaus schlafen?'],['Stanotte non posso dormire: ho paura!','Heute Nacht kann ich nicht schlafen: Ich habe Angst!'],['Non voglio vedere lo zombie!','Ich will den Zombie nicht sehen!'],['Posso dormire con la luce?','Darf ich mit Licht schlafen?']],
      n12:[['Il lupo mannaro si sveglia con la luna piena.','Der Werwolf wacht bei Vollmond auf.'],['La strega si guarda allo specchio.','Die Hexe schaut sich im Spiegel an.'],['Lo zombie si nasconde nel cimitero.','Der Zombie versteckt sich auf dem Friedhof.'],['Mi sveglio a mezzanotte.','Ich wache um Mitternacht auf.'],['La mummia si pettina? No!','Kämmt sich die Mumie? Nein!']],
      l6:[['Il castello era vecchio e buio.','Die Burg war alt und dunkel.'],['Tutti dicevano che il cimitero era maledetto.','Alle sagten, dass der Friedhof verflucht sei.'],['In cantina faceva freddo.','Im Keller war es kalt.'],['Da bambini passavamo Halloween nel bosco.','Als Kinder verbrachten wir Halloween im Wald.'],['C’era una voce in soffitta.','Auf dem Dachboden war eine Stimme.'],['La strega cantava nel bosco.','Die Hexe sang im Wald.']],
      n14:[['All’improvviso la candela si è spenta.','Plötzlich ist die Kerze ausgegangen.'],['Mentre la strega cantava, il gatto è sparito.','Während die Hexe sang, ist die Katze verschwunden.'],['C’era la nebbia sul cimitero.','Über dem Friedhof lag Nebel.'],['All’improvviso è apparso un vampiro.','Plötzlich ist ein Vampir erschienen.'],['Nel faro faceva freddo.','Im Leuchtturm war es kalt.']],
      n15:[['La festa sarà a mezzanotte.','Die Party wird um Mitternacht sein.'],['Andremo al cimitero con la torcia.','Wir werden mit der Taschenlampe zum Friedhof gehen.'],['Porterò il costume da vampiro.','Ich werde das Vampirkostüm mitbringen.'],['Ci saranno tredici zucche.','Es wird dreizehn Kürbisse geben.'],['Avremo paura del lupo mannaro?','Werden wir Angst vor dem Werwolf haben?']],
      n16:[['Cosa faresti in un castello maledetto?','Was würdest du in einer verfluchten Burg tun?'],['Scapperei dalla finestra!','Ich würde aus dem Fenster fliehen!'],['Mi piacerebbe dormire nel castello.','Ich würde gern in der Burg schlafen.'],['Parlerei con la strega.','Ich würde mit der Hexe sprechen.'],['Urlerei e scapperei!','Ich würde schreien und weglaufen!']]
    },
    lessons:{
      1:[
        { title:'Mostri famosi', de:'Berühmte Monster', focus:'Vertiefung: Wörter & Artikel',
          tip:'Noch mehr Monster, noch mehr Artikel: <b>lo</b> steht vor s + Mitlaut und vor z (<b>lo</b> scheletro, <b>lo</b> zombie). Vor a, e, i, o, u wird gekürzt: <b>l’</b>ombra. Die Mehrzahl von lo ist <b>gli</b>: gli scheletri.',
          words:[['lo scheletro','das Skelett'],['gli scheletri','die Skelette'],['lo zombie','der Zombie'],['la mummia','die Mumie'],['il mostro','das Monster'],['il lupo mannaro','der Werwolf'],['la luna','der Mond'],['il gatto nero','die schwarze Katze'],['l’ombra','der Schatten']],
          sentences:[['Ecco lo scheletro!','Da ist das Skelett!'],['Chi è? È la mummia!','Wer ist das? Es ist die Mumie!'],['Nella cantina ci sono tre scheletri.','Im Keller sind drei Skelette.'],['Dov’è il lupo mannaro?','Wo ist der Werwolf?'],['Alla finestra c’è un’ombra!','Am Fenster ist ein Schatten!'],['Che cos’è? Il gatto nero!','Was ist das? Die schwarze Katze!'],['C’è la luna e c’è il lupo mannaro.','Da ist der Mond, und da ist der Werwolf.'],['Lo zombie è alla porta!','Der Zombie ist an der Tür!']],
          reading:{ title:'La notte dei mostri',
            text:'Buonasera! Ecco la casa stregata. C’è la luna. Alla finestra c’è un’ombra: chi è? È il lupo mannaro! Nella cantina ci sono due scheletri e una mummia. E alla porta? Lo zombie! Dolcetto o scherzetto?',
            tr:'Guten Abend! Hier ist das Spukhaus. Der Mond scheint. Am Fenster ist ein Schatten: Wer ist das? Es ist der Werwolf! Im Keller sind zwei Skelette und eine Mumie. Und an der Tür? Der Zombie! Süßes oder Saures?',
            qs:[['Wer ist der Schatten am Fenster?',['Der Werwolf','Der Zombie','Die Mumie','Ein Skelett']],['Was ist im Keller?',['Zwei Skelette und eine Mumie','Ein Zombie','Drei Gespenster','Eine Hexe']]] } },
        { title:'Piacere, Dracula!', de:'Freut mich, Dracula!', focus:'Vertiefung: Begrüßen & Kennenlernen',
          tip:'<b>Ciao</b> sagst du zu Freunden, zur Begrüßung und zum Abschied. Etwas höflicher ist <b>Salve</b> (Guten Tag). <b>Piacere!</b> heißt „Freut mich!“ beim Kennenlernen. <b>Come stai?</b> fragt „Wie geht es dir?“, die Antwort: <b>Bene, grazie!</b>',
          words:[['Ciao!','Hallo! (auch: Tschüss!)','gruss'],['Salve!','Guten Tag!','gruss'],['Piacere!','Freut mich!','gruss'],['Come stai?','Wie geht es dir?','gruss'],['Bene, grazie!','Gut, danke!','gruss'],['E tu?','Und du?','gruss'],['sì / no','ja / nein','gruss'],['A domani!','Bis morgen!','gruss'],['Aiuto!','Hilfe!']],
          sentences:[['Ciao! Mi chiamo Dracula.','Hallo! Ich heiße Dracula.'],['Piacere! Sono una strega.','Freut mich! Ich bin eine Hexe.'],['Come stai, fantasma?','Wie geht es dir, Gespenst?'],['Bene, grazie! E tu?','Gut, danke! Und du?'],['Sei uno zombie? No, sono una mummia!','Bist du ein Zombie? Nein, ich bin eine Mumie!'],['Aiuto! C’è un ragno!','Hilfe! Da ist eine Spinne!'],['Ciao, Luca! A domani!','Tschüss, Luca! Bis morgen!'],['Salve! Dolcetto o scherzetto?','Guten Tag! Süßes oder Saures?']],
          reading:{ title:'Alla festa dei mostri', dialog:true,
            text:'— Salve! Come ti chiami?\n— Piacere, mi chiamo Dracula. E tu?\n— Sono Sara, la strega. Come stai?\n— Bene, grazie! Sei una strega? Che paura!\n— Sì! Ecco una caramella, Dracula.\n— Grazie! Ciao, Sara! A domani!',
            tr:'– Guten Tag! Wie heißt du? – Freut mich, ich heiße Dracula. Und du? – Ich bin Sara, die Hexe. Wie geht es dir? – Gut, danke! Du bist eine Hexe? Wie gruselig! – Ja! Hier ist ein Bonbon, Dracula. – Danke! Tschüss, Sara! Bis morgen!',
            qs:[['Als was ist Sara verkleidet?',['Als Hexe','Als Gespenst','Als Mumie','Als Zombie']],['Was bekommt Dracula?',['Ein Bonbon','Einen Kürbis','Nichts','Eine Taschenlampe']]] } },
        { title:'Tredici zucche', de:'Dreizehn Kürbisse', focus:'Vertiefung: Zahlen bis 20',
          tip:'Zahlen von 11 bis 20: undici, dodici, tredici, quattordici, quindici, sedici, diciassette, diciotto, diciannove, venti. Gut zu wissen: In Italien gilt die <b>17</b> (diciassette) als Unglückszahl, nicht die 13! Fragen: <b>quanti</b> bei männlichen Wörtern (quanti fantasmi?), <b>quante</b> bei weiblichen (quante zucche?).',
          words:[['undici, dodici, tredici','elf, zwölf, dreizehn','zahlen'],['quattordici, quindici, sedici','vierzehn, fünfzehn, sechzehn','zahlen'],['diciassette, diciotto','siebzehn, achtzehn','zahlen'],['diciannove, venti','neunzehn, zwanzig','zahlen'],['quanti / quante','wie viele','fragen zahlen'],['i ragni','die Spinnen'],['i pipistrelli','die Fledermäuse'],['la candela / le candele','die Kerze / die Kerzen']],
          sentences:[['Quante zucche ci sono? Tredici!','Wie viele Kürbisse gibt es? Dreizehn!'],['Nella cantina ci sono venti ragni.','Im Keller sind zwanzig Spinnen.'],['Quanti fantasmi ci sono?','Wie viele Gespenster gibt es?'],['Ci sono undici pipistrelli alla finestra.','Am Fenster sind elf Fledermäuse.'],['Ecco quindici caramelle!','Hier sind fünfzehn Bonbons!'],['C’è una candela nel buio.','In der Dunkelheit ist eine Kerze.'],['Diciassette? Che paura!','Siebzehn? Wie gruselig!'],['Quante candele ci sono? Dodici.','Wie viele Kerzen gibt es? Zwölf.']],
          reading:{ title:'Il numero diciassette',
            text:'Nella casa stregata ci sono dodici candele e diciotto zucche. Quanti fantasmi ci sono? Sedici! E quanti ragni? Venti! Alla porta c’è un numero: diciassette. Che paura!',
            tr:'Im Spukhaus gibt es zwölf Kerzen und achtzehn Kürbisse. Wie viele Gespenster gibt es? Sechzehn! Und wie viele Spinnen? Zwanzig! An der Tür steht eine Nummer: siebzehn. Wie gruselig!',
            qs:[['Wie viele Gespenster gibt es?',['Sechzehn','Zwölf','Achtzehn','Zwanzig']],['Welche Nummer steht an der Tür?',['Siebzehn','Dreizehn','Zwölf','Zwanzig']]] } },
        { title:'Dove sei, Luca?', de:'Wo bist du, Luca?', focus:'Vertiefung: Fragen stellen',
          tip:'Weitere Fragewörter: <b>quale</b> (welcher, welche, welches) und <b>quanto costa</b> (wie viel kostet). Auf „wo?“ antwortest du mit <b>qui</b> (hier) oder <b>là</b> (dort). Eine Ja-Nein-Frage erkennt man oft nur an der Stimme: <b>Sei qui?</b> (Bist du hier?)',
          words:[['qui','hier','orte'],['là','dort','orte'],['quale','welcher, welche, welches','fragen'],['quanto costa','wie viel kostet','fragen'],['la chiave','der Schlüssel'],['la stanza','das Zimmer'],['la maschera','die Maske'],['Scusa!','Entschuldigung!','gruss'],['Non lo so.','Ich weiß es nicht.']],
          sentences:[['Luca, dove sei?','Luca, wo bist du?'],['Sono qui, in cantina!','Ich bin hier, im Keller!'],['Chi è là?','Wer ist dort?'],['Dov’è la chiave? Non lo so.','Wo ist der Schlüssel? Ich weiß es nicht.'],['Quale stanza? La stanza tredici!','Welches Zimmer? Zimmer dreizehn!'],['Quanto costa la maschera?','Wie viel kostet die Maske?'],['Scusa, dov’è la porta?','Entschuldigung, wo ist die Tür?'],['Che cos’è là? Una maschera!','Was ist das dort? Eine Maske!']],
          reading:{ title:'La stanza tredici', dialog:true,
            text:'— Luca, dove sei?\n— Sono qui, nella stanza tredici!\n— E dov’è la chiave?\n— Non lo so. Chi è là?\n— Una maschera! Aiuto!\n— No, Sara, sono io, Marco!',
            tr:'– Luca, wo bist du? – Ich bin hier, in Zimmer dreizehn! – Und wo ist der Schlüssel? – Ich weiß es nicht. Wer ist dort? – Eine Maske! Hilfe! – Nein, Sara, ich bin’s, Marco!',
            qs:[['Wo ist Luca?',['In Zimmer dreizehn','Im Keller','An der Tür','Am Fenster']],['Wer trägt die Maske?',['Marco','Luca','Sara','Ein Gespenst']]] } }
      ],
      2:[
        { title:'Di che colore è?', de:'Welche Farbe hat es?', focus:'Vertiefung: Adjektive & Farben',
          tip:'Farben sind Adjektive und passen sich an: il gatto ner<b>o</b>, la scopa ner<b>a</b>. Farben auf -e bleiben gleich: il mostro verd<b>e</b>, la candela verd<b>e</b>. <b>Arancione</b> ist die Farbe des Kürbisses. <b>Di che colore è?</b> heißt „Welche Farbe hat es?“',
          words:[['nero / nera','schwarz','wie'],['bianco / bianca','weiß','wie'],['rosso / rossa','rot','wie'],['verde','grün','wie'],['arancione','orange','wie'],['il colore','die Farbe'],['piccolo / piccola','klein','wie'],['grande','groß','wie'],['gli occhi','die Augen']],
          sentences:[['La zucca è arancione.','Der Kürbis ist orange.'],['Il fantasma è bianco.','Das Gespenst ist weiß.'],['Lo zombie è verde.','Der Zombie ist grün.'],['La strega ha una scopa nera.','Die Hexe hat einen schwarzen Besen.'],['Di che colore è il gatto? È nero.','Welche Farbe hat die Katze? Sie ist schwarz.'],['Il ragno è piccolo, ma la paura è grande!','Die Spinne ist klein, aber die Angst ist groß!'],['La mummia è bianca e vecchia.','Die Mumie ist weiß und alt.'],['Lo scheletro non ha gli occhi.','Das Skelett hat keine Augen.'],['Ho una candela verde.','Ich habe eine grüne Kerze.']],
          reading:{ title:'Il mostro nell’armadio',
            text:'Nella stanza di Marco c’è un armadio grande e vecchio. A mezzanotte Marco sente un rumore. Marco apre l’armadio: ci sono due occhi rossi! È un mostro? No, è il gatto nero con una maschera verde!',
            tr:'In Marcos Zimmer steht ein großer, alter Schrank. Um Mitternacht hört Marco ein Geräusch. Marco öffnet den Schrank: Da sind zwei rote Augen! Ist es ein Monster? Nein, es ist die schwarze Katze mit einer grünen Maske!',
            qs:[['Was sieht Marco im Schrank?',['Zwei rote Augen','Ein Skelett','Eine Kerze','Nichts']],['Wer ist im Schrank?',['Die schwarze Katze','Ein Monster','Luca','Ein Vampir']]] } },
        { title:'Mi piace Halloween!', de:'Ich mag Halloween!', focus:'Vertiefung: Gegenwart & Vorlieben',
          tip:'<b>Mi piace</b> + eine Sache oder ein Verb: mi piace Halloween, mi piace ballare (ich tanze gern). <b>Mi piacciono</b> + mehrere Sachen. Gegenwart bei -are-Verben: ball<b>o</b> (ich tanze), ball<b>i</b> (du tanzt), ball<b>a</b> (er/sie tanzt), ball<b>iamo</b> (wir tanzen).',
          words:[['mi piace','ich mag (eine Sache)','verben'],['ballare','tanzen','verben'],['ballo / balliamo','ich tanze / wir tanzen','verben'],['mangio / mangi','ich esse / du isst','verben'],['guardo / guardi','ich schaue / du schaust','verben'],['la musica','die Musik'],['i dolci','die Süßigkeiten'],['la notte','die Nacht','zeit']],
          sentences:[['Mi piace Halloween!','Ich mag Halloween!'],['Mi piace ballare con gli scheletri.','Ich tanze gern mit den Skeletten.'],['Mangio le caramelle nel letto.','Ich esse die Bonbons im Bett.'],['Guardi un film horror?','Schaust du einen Horrorfilm?'],['Balliamo a mezzanotte!','Wir tanzen um Mitternacht!'],['Mi piacciono i dolci di Halloween.','Ich mag die Halloween-Süßigkeiten.'],['Lo zombie non mi piace.','Den Zombie mag ich nicht.'],['Mangi una zucca? No, mangio i dolci!','Isst du einen Kürbis? Nein, ich esse die Süßigkeiten!'],['Mi piace la musica della notte.','Ich mag die Musik der Nacht.']],
          reading:{ title:'Sara e Halloween',
            text:'Mi chiamo Sara e mi piace Halloween! La notte di Halloween guardo un film horror e mangio i dolci. Luca intaglia una zucca. A mezzanotte mettiamo la musica e balliamo con le maschere. Lo zombie? Non mi piace!',
            tr:'Ich heiße Sara und ich mag Halloween! In der Halloween-Nacht schaue ich einen Horrorfilm und esse Süßigkeiten. Luca schnitzt einen Kürbis. Um Mitternacht machen wir Musik an und tanzen mit den Masken. Der Zombie? Den mag ich nicht!',
            qs:[['Was macht Luca?',['Er schnitzt einen Kürbis','Er tanzt','Er schläft','Er isst Bonbons']],['Was machen sie um Mitternacht?',['Sie tanzen mit Masken','Sie schlafen','Sie schauen einen Film','Sie gehen nach Hause']]] } },
        { title:'Il lupo mannaro', de:'Der Werwolf', focus:'Vertiefung: Gegenwart -ere/-ire & „nicht“',
          tip:'Gegenwart bei -ere und -ire, Form für er/sie: corr<b>ere</b> → corr<b>e</b> (er rennt), dorm<b>ire</b> → dorm<b>e</b> (er schläft), sent<b>ire</b> → sent<b>e</b> (er hört). <b>Non … mai</b> heißt „nie“: non dorme <b>mai</b> (er schläft nie).',
          words:[['corre','er/sie rennt','verben'],['dorme','er/sie schläft','verben'],['sente','er/sie hört','verben'],['vede','er/sie sieht','verben'],['non … mai','nie','zeit'],['sempre','immer','zeit'],['il bosco','der Wald'],['la luna piena','der Vollmond'],['ulula','er/sie heult','verben brividi']],
          sentences:[['Il lupo mannaro corre nel bosco.','Der Werwolf rennt durch den Wald.'],['Con la luna piena non dorme mai.','Bei Vollmond schläft er nie.'],['A mezzanotte ulula alla luna.','Um Mitternacht heult er den Mond an.'],['Nel bosco è sempre buio.','Im Wald ist es immer dunkel.'],['Il vampiro dorme nella bara.','Der Vampir schläft im Sarg.'],['Luca non vede il lupo mannaro, ma sente un rumore.','Luca sieht den Werwolf nicht, aber er hört ein Geräusch.'],['Il gatto nero corre sotto il letto.','Die schwarze Katze rennt unter das Bett.'],['Non apro mai la porta a mezzanotte.','Ich öffne nie um Mitternacht die Tür.']],
          reading:{ title:'Paolo',
            text:'Nel bosco c’è una casa piccola. Di giorno Paolo è un uomo normale. Ma con la luna piena Paolo non dorme: corre nel bosco e ulula alla luna. È un lupo mannaro! I bambini hanno paura, ma Paolo non è cattivo.',
            tr:'Im Wald steht ein kleines Haus. Tagsüber ist Paolo ein normaler Mann. Aber bei Vollmond schläft Paolo nicht: Er rennt durch den Wald und heult den Mond an. Er ist ein Werwolf! Die Kinder haben Angst, aber Paolo ist nicht böse.',
            qs:[['Was macht Paolo bei Vollmond?',['Er rennt durch den Wald und heult','Er schläft','Er schnitzt Kürbisse','Er schaut einen Film']],['Ist Paolo böse?',['Nein','Ja','Nur tagsüber','Das weiß niemand']]] } },
        { title:'Nel cimitero', de:'Auf dem Friedhof', focus:'Vertiefung: Wo ist was?',
          tip:'Noch mehr Ortsangaben: <b>dentro</b> (drinnen, darin), <b>fuori</b> (draußen), <b>tra</b> (zwischen), <b>in fondo a</b> (ganz hinten in). Wie bei davanti a verschmilzt <b>a</b> mit dem Artikel: in fondo <b>al</b> cimitero, davanti <b>al</b> cancello.',
          words:[['il cimitero','der Friedhof'],['la tomba','das Grab'],['l’albero','der Baum'],['la chiesa','die Kirche'],['il cancello','das Tor'],['dentro','drinnen, darin','orte'],['fuori','draußen','orte'],['tra','zwischen','orte'],['in fondo a','ganz hinten in','orte']],
          sentences:[['Il cimitero è dietro la chiesa.','Der Friedhof ist hinter der Kirche.'],['Tra la chiesa e l’albero c’è una tomba.','Zwischen der Kirche und dem Baum ist ein Grab.'],['In fondo al cimitero c’è un albero vecchio.','Ganz hinten auf dem Friedhof steht ein alter Baum.'],['Il fantasma è dentro la tomba.','Das Gespenst ist im Grab.'],['Fuori è buio e il cancello è vecchio.','Draußen ist es dunkel, und das Tor ist alt.'],['Davanti al cancello c’è uno zombie!','Vor dem Tor ist ein Zombie!'],['Sopra la tomba c’è una candela.','Auf dem Grab steht eine Kerze.'],['Il pipistrello dorme sull’albero.','Die Fledermaus schläft auf dem Baum.']],
          reading:{ title:'Il cancello',
            text:'È mezzanotte. Davanti alla chiesa c’è un cancello vecchio. Dietro il cancello c’è il cimitero. Io apro il cancello: dentro è buio. In fondo al cimitero, tra due alberi, vedo una luce. Chi c’è? È il guardiano con una candela!',
            tr:'Es ist Mitternacht. Vor der Kirche ist ein altes Tor. Hinter dem Tor ist der Friedhof. Ich öffne das Tor: Drinnen ist es dunkel. Ganz hinten auf dem Friedhof, zwischen zwei Bäumen, sehe ich ein Licht. Wer ist da? Es ist der Wärter mit einer Kerze!',
            qs:[['Was ist hinter dem Tor?',['Der Friedhof','Die Kirche','Ein Wald','Ein Spukhaus']],['Woher kommt das Licht?',['Von der Kerze des Wärters','Von einem Gespenst','Vom Mond','Von einer Taschenlampe']]] } }

      3:[
        { title:'Che film hai visto?', de:'Welchen Film hast du gesehen?', focus:'Vertiefung: Vergangenheit – abgeschlossen',
          tip:'Vergangenheit – abgeschlossen mit „haben“: <b>ho, hai, ha, abbiamo</b> + Partizip. Regelmäßig: guard<b>are</b> → guard<b>ato</b>, mangi<b>are</b> → mangi<b>ato</b>, sent<b>ire</b> → sent<b>ito</b>. Viele häufige Verben sind unregelmäßig: vedere → <b>visto</b>, chiudere → <b>chiuso</b>, spegnere → <b>spento</b>.',
          words:[['hai','du hast','verben'],['ho visto / hai visto','ich habe gesehen / du hast gesehen','verben'],['ho guardato','ich habe angeschaut','verben'],['ho mangiato','ich habe gegessen','verben'],['ho chiuso','ich habe zugemacht','verben'],['ha spento','er/sie hat ausgemacht','verben'],['la notte scorsa','letzte Nacht','zeit'],['il divano','das Sofa']],
          sentences:[['Che film hai visto ieri sera?','Welchen Film hast du gestern Abend gesehen?'],['Ho visto un film horror vecchio.','Ich habe einen alten Horrorfilm gesehen.'],['La notte scorsa ho guardato il film sul divano.','Letzte Nacht habe ich den Film auf dem Sofa angeschaut.'],['Ho chiuso gli occhi!','Ich habe die Augen zugemacht!'],['Luca ha spento la luce.','Luca hat das Licht ausgemacht.'],['Ho mangiato dieci caramelle.','Ich habe zehn Bonbons gegessen.'],['Hai sentito il rumore?','Hast du das Geräusch gehört?'],['Abbiamo visto un vampiro alla finestra!','Wir haben einen Vampir am Fenster gesehen!']],

    { title:'Che ore sono?', de:'Wie spät ist es?', focus:'Die Uhrzeit',

      words:[['Che ore sono?','Wie spät ist es?','fragen zeit'],['È l’una.','Es ist ein Uhr.','zeit'],['Sono le due.','Es ist zwei Uhr.','zeit'],['e mezza','… Uhr dreißig (halb)','zeit'],['e un quarto','Viertel nach','zeit'],['mezzogiorno','Mittag (12 Uhr)','zeit'],['È mezzanotte.','Es ist Mitternacht.','zeit'],['l’ora','die Stunde, die Uhrzeit','zeit']],
      sentences:[['Che ore sono? Sono le tre.','Wie spät ist es? Es ist drei Uhr.'],['È mezzanotte! Aiuto!','Es ist Mitternacht! Hilfe!'],['Sono le dieci e mezza.','Es ist halb elf.'],['È l’una e un quarto.','Es ist Viertel nach eins.'],['È mezzogiorno: il fantasma è in cantina.','Es ist Mittag: Das Gespenst ist im Keller.'],['Sono le undici e un quarto, Luca!','Es ist Viertel nach elf, Luca!'],['Che ore sono? Non lo so.','Wie spät ist es? Ich weiß es nicht.'],['Quando? A mezzanotte!','Wann? Um Mitternacht!']],
      reading:{ title:'L’ora dei fantasmi',
        text:'Che ore sono? Sono le nove. In casa non c’è un rumore. Sono le dieci e mezza: c’è un pipistrello alla finestra. Sono le undici e un quarto: c’è un’ombra in giardino. È mezzanotte: ecco i fantasmi! È l’ora dei fantasmi.',

        qs:[['Was ist um halb elf am Fenster?',['Eine Fledermaus','Ein Schatten','Ein Gespenst','Nichts']],['Wann kommen die Gespenster?',['Um Mitternacht','Um neun','Um Viertel nach elf','Um Mittag']]] } },

    { title:'Che tempo fa?', de:'Wie ist das Wetter?', focus:'Das Wetter',

      words:[['Che tempo fa?','Wie ist das Wetter?','fragen'],['fa freddo','es ist kalt'],['fa caldo','es ist warm'],['piove','es regnet','verben'],['c’è il vento','es ist windig'],['c’è la nebbia','es ist neblig'],['il sole','die Sonne'],['la pioggia','der Regen']],
      sentences:[['Che tempo fa? Piove.','Wie ist das Wetter? Es regnet.'],['Oggi fa freddo e c’è il vento.','Heute ist es kalt und windig.'],['A mezzanotte c’è la nebbia.','Um Mitternacht ist es neblig.'],['Non c’è il sole: è buio.','Es gibt keine Sonne: Es ist dunkel.'],['Il fantasma e il sole? No, grazie!','Das Gespenst und die Sonne? Nein, danke!'],['Fa caldo in cantina? No, fa freddo!','Ist es im Keller warm? Nein, es ist kalt!'],['Piove e la strega è in cucina.','Es regnet, und die Hexe ist in der Küche.'],['C’è la pioggia, c’è il vento: è Halloween!','Es regnet, es ist windig: Es ist Halloween!']],

      sentences:[['Scusa, dov’è la scuola?','Entschuldigung, wo ist die Schule?'],['Il cinema è in piazza.','Das Kino ist auf dem Platz.'],['C’è uno zombie nella strada!','Auf der Straße ist ein Zombie!'],['Nel parco c’è un lupo.','Im Park ist ein Wolf.'],['Dov’è l’ospedale? Aiuto!','Wo ist das Krankenhaus? Hilfe!'],['La farmacia è là.','Die Apotheke ist dort.'],['Quanti fantasmi ci sono in città? Venti!','Wie viele Gespenster gibt es in der Stadt? Zwanzig!'],['La mummia è all’ospedale? No, è al cinema!','Ist die Mumie im Krankenhaus? Nein, sie ist im Kino!']],
      reading:{ title:'La notte del 31 ottobre',

        qs:[['Was steht auf dem Platz?',['Hundert Kürbisse','Zombies und Skelette','Ein Kino','Kinder mit Masken']],['Wer ist im Krankenhaus?',['Ein Gespenst','Die Mumie','Die Kinder','Niemand']]] } }

  2:[
    { title:'Com’è il mostro?', de:'Wie sieht das Monster aus?', focus:'Adjektive: Aussehen',
      tip:'Adjektive auf -o haben vier Formen: alt<b>o</b> (er), alt<b>a</b> (sie), alt<b>i</b> (mehrere, männlich), alt<b>e</b> (mehrere, weiblich). Adjektive auf -e wie <b>forte</b> haben nur zwei: forte, fort<b>i</b>.',
      words:[['alto / alta','groß (gewachsen)','wie'],['basso / bassa','klein (gewachsen)','wie'],['grasso / grassa','dick','wie'],['magro / magra','dünn','wie'],['bello / bella','schön','wie'],['brutto / brutta','hässlich','wie'],['forte','stark','wie'],['lungo / lunga / lunghi','lang','wie']],
      sentences:[['Il gigante è alto e forte.','Der Riese ist groß und stark.'],['Il folletto è basso e brutto.','Der Kobold ist klein und hässlich.'],['Lo scheletro è magro, molto magro!','Das Skelett ist dünn, sehr dünn!'],['La strega ha un naso lungo.','Die Hexe hat eine lange Nase.'],['Il vampiro è bello, ma è cattivo.','Der Vampir ist schön, aber er ist böse.'],['L’orco è grasso e brutto.','Der Oger ist dick und hässlich.'],['La fata è bassa e bella.','Die Fee ist klein und schön.'],['Il lupo mannaro ha i capelli lunghi.','Der Werwolf hat lange Haare.']],
      reading:{ title:'Chi è il mostro?',
        text:'Il mostro è alto, molto alto. Ha la testa piccola e il naso lungo. È magro, ma è forte. Ha tre occhi verdi e una bocca enorme. È brutto? Sì, è molto brutto! Ma ha paura del buio. Chi è? È il mostro sotto il mio letto!',
        tr:'Das Monster ist groß, sehr groß. Es hat einen kleinen Kopf und eine lange Nase. Es ist dünn, aber stark. Es hat drei grüne Augen und einen riesigen Mund. Ist es hässlich? Ja, es ist sehr hässlich! Aber es hat Angst im Dunkeln. Wer ist es? Es ist das Monster unter meinem Bett!',
        qs:[['Wie viele Augen hat das Monster?',['Drei grüne Augen','Zwei rote Augen','Vier Augen','Ein Auge']],['Wovor hat das Monster Angst?',['Vor der Dunkelheit','Vor Luca','Vor Spinnen','Vor der Sonne']]] } },

    { title:'Come ti senti?', de:'Wie fühlst du dich?', focus:'Adjektive: Gefühle',
      tip:'Gefühle mit <b>sono</b> (ich bin): sono triste, sono stanco. Hunger und Durst „hat“ man: <b>ho fame</b> (ich habe Hunger), <b>ho sete</b> (ich habe Durst). Eine Frau sagt: sono stanc<b>a</b>, arrabbiat<b>a</b>.',
      words:[['felice','glücklich','wie'],['triste','traurig','wie'],['arrabbiato / arrabbiata','wütend','wie'],['stanco / stanca','müde','wie'],['nervoso / nervosa','nervös','wie'],['calmo / calma','ruhig','wie'],['ho fame','ich habe Hunger'],['ho sete','ich habe Durst'],['l’amico / gli amici','der Freund / die Freunde','leute']],
      sentences:[['Il fantasma è triste: non ha amici.','Das Gespenst ist traurig: Es hat keine Freunde.'],['Sono stanca, è mezzanotte!','Ich bin müde, es ist Mitternacht!'],['Il vampiro ha sete.','Der Vampir hat Durst.'],['Lo zombie ha fame. Aiuto!','Der Zombie hat Hunger. Hilfe!'],['La strega è arrabbiata: dov’è la scopa?','Die Hexe ist wütend: Wo ist der Besen?'],['Sono nervoso nella casa stregata.','Ich bin nervös im Spukhaus.'],['Il gatto nero è calmo.','Die schwarze Katze ist ruhig.'],['La mummia è felice: ha un vestito bello!','Die Mumie ist glücklich: Sie hat ein schönes Kleid!']],
      reading:{ title:'Il fantasma triste',
        text:'Nella soffitta c’è un fantasma. Il fantasma è triste. Non ha amici e ha freddo. Di notte non dorme: è nervoso e arrabbiato. Ma una sera arriva un gatto nero. Il gatto è calmo e dorme sul letto del fantasma. Ora il fantasma è felice!',
        tr:'Auf dem Dachboden wohnt ein Gespenst. Das Gespenst ist traurig. Es hat keine Freunde, und ihm ist kalt. Nachts schläft es nicht: Es ist nervös und wütend. Aber eines Abends kommt eine schwarze Katze. Die Katze ist ruhig und schläft auf dem Bett des Gespensts. Jetzt ist das Gespenst glücklich!',
        qs:[['Warum ist das Gespenst traurig?',['Es hat keine Freunde und friert','Es hat Hunger','Es ist krank','Es hat seinen Besen verloren']],['Wer macht das Gespenst glücklich?',['Eine schwarze Katze','Luca','Eine Hexe','Ein Vampir']]] } },

    { title:'Noi siamo mostri!', de:'Wir sind Monster!', focus:'sein & haben: alle Personen',
      tip:'<b>essere</b> (sein): sono, sei, è, <b>siamo</b>, <b>siete</b>, sono. <b>avere</b> (haben): ho, hai, ha, <b>abbiamo</b>, <b>avete</b>, <b>hanno</b>. Das h bei avere spricht man nie: hanno klingt wie „anno“.',
      words:[['noi siamo','wir sind','verben'],['voi siete','ihr seid','verben'],['loro sono','sie sind (mehrere)','verben'],['hai','du hast','verben'],['abbiamo','wir haben','verben'],['avete','ihr habt','verben'],['hanno','sie haben','verben'],['voi','ihr']],
      sentences:[['Noi siamo i fantasmi della casa!','Wir sind die Gespenster des Hauses!'],['Voi siete fantasmi o zombie?','Seid ihr Gespenster oder Zombies?'],['Loro sono due zombie.','Das sind zwei Zombies.'],['Hai paura del buio?','Hast du Angst vor der Dunkelheit?'],['Abbiamo una casa stregata.','Wir haben ein Spukhaus.'],['Avete le caramelle? Dolcetto o scherzetto!','Habt ihr Bonbons? Süßes oder Saures!'],['I bambini hanno sete.','Die Kinder haben Durst.'],['Noi abbiamo fame, e voi?','Wir haben Hunger, und ihr?']],
      reading:{ title:'La famiglia Mostro', dialog:true,
        text:'— Buonasera! Chi siete?\n— Noi siamo la famiglia Mostro! Io sono il papà, lei è la mamma.\n— E loro?\n— Loro sono i bambini: uno zombie e una piccola strega.\n— Avete fame?\n— Sì, abbiamo fame! Hai una torta?\n— Ho i biscotti. Ecco!\n— Grazie! I bambini hanno anche sete…',
        tr:'– Guten Abend! Wer seid ihr? – Wir sind die Familie Monster! Ich bin der Papa, sie ist die Mama. – Und sie? – Das sind die Kinder: ein Zombie und eine kleine Hexe. – Habt ihr Hunger? – Ja, wir haben Hunger! Hast du einen Kuchen? – Ich habe Kekse. Bitte sehr! – Danke! Die Kinder haben auch Durst …',
        qs:[['Wer sind die Kinder?',['Ein Zombie und eine kleine Hexe','Zwei Vampire','Zwei Gespenster','Eine Mumie und ein Skelett']],['Was bekommt die Familie?',['Kekse','Einen Kuchen','Bonbons','Nichts']]] } },

    { title:'La giornata del fantasma', de:'Der Tag des Gespensts', focus:'Gegenwart: Verben auf -are',
      tip:'Verben auf -are: parl<b>are</b> → parl<b>o</b> (ich), parl<b>i</b> (du), parl<b>a</b> (er/sie), parl<b>iamo</b> (wir), parl<b>ate</b> (ihr), parl<b>ano</b> (sie). Achtung bei cercare: tu cer<b>chi</b> – das h hält den Laut hart.',
      words:[['abito','ich wohne','verben'],['lavoro','ich arbeite','verben'],['parlo / parli / parla','ich spreche / du sprichst / er, sie spricht','verben'],['cammino','ich gehe (zu Fuß)','verben'],['aspetto','ich warte','verben'],['cerco / cerchi','ich suche / du suchst','verben'],['trovo','ich finde','verben'],['canto / canta','ich singe / er, sie singt','verben']],
      sentences:[['Abito in una casa stregata.','Ich wohne in einem Spukhaus.'],['Di notte lavoro, di giorno dormo.','Nachts arbeite ich, tagsüber schlafe ich.'],['Il fantasma parla con il gatto.','Das Gespenst spricht mit der Katze.'],['Cammino nel cimitero a mezzanotte.','Ich gehe um Mitternacht über den Friedhof.'],['Aspetto la luna piena.','Ich warte auf den Vollmond.'],['Chi cerchi? Cerco il gatto!','Wen suchst du? Ich suche die Katze!'],['Non trovo la mia testa!','Ich finde meinen Kopf nicht!'],['La strega canta in cucina.','Die Hexe singt in der Küche.']],
      reading:{ title:'Io, fantasma',
        text:'Ciao, sono un fantasma. Abito in una casa vecchia. Di giorno dormo in soffitta. Di notte lavoro: cammino nel corridoio, apro le porte e canto. Parlo con il gatto e con i pipistrelli. Aspetto sempre i bambini di Halloween. Ma stanotte non trovo la mia voce!',
        tr:'Hallo, ich bin ein Gespenst. Ich wohne in einem alten Haus. Tagsüber schlafe ich auf dem Dachboden. Nachts arbeite ich: Ich gehe durch den Flur, öffne die Türen und singe. Ich spreche mit der Katze und mit den Fledermäusen. Ich warte immer auf die Halloween-Kinder. Aber heute Nacht finde ich meine Stimme nicht!',
        qs:[['Wo schläft das Gespenst tagsüber?',['Auf dem Dachboden','Im Keller','Im Bett','Auf dem Friedhof']],['Was findet das Gespenst heute Nacht nicht?',['Seine Stimme','Seinen Kopf','Die Katze','Den Schlüssel']]] } },

    { title:'La strega legge', de:'Die Hexe liest', focus:'Gegenwart: Verben auf -ere',
      tip:'Verben auf -ere: legg<b>ere</b> → legg<b>o</b>, legg<b>i</b>, legg<b>e</b>, legg<b>iamo</b>, legg<b>ete</b>, legg<b>ono</b>. Der Unterschied zu -are: er/sie endet auf <b>-e</b> (legge) und sie (mehrere) auf <b>-ono</b> (leggono).',
      words:[['prendo / prende','ich nehme / er, sie nimmt','verben'],['leggo / legge','ich lese / er, sie liest','verben'],['scrivo','ich schreibe','verben'],['bevo / beve','ich trinke / er, sie trinkt','verben'],['metto / mette','ich lege / er, sie legt','verben'],['chiudo / chiude','ich schließe / er, sie schließt','verben'],['rispondo / risponde','ich antworte / er, sie antwortet','verben'],['il libro di magia','das Zauberbuch'],['vivo / vive','ich lebe / er, sie lebt','verben']],
      sentences:[['La strega legge un libro di magia.','Die Hexe liest ein Zauberbuch.'],['Il vampiro beve di notte.','Der Vampir trinkt nachts.'],['La strega prende la scopa e vola.','Die Hexe nimmt den Besen und fliegt.'],['Metto la zucca sulla finestra.','Ich stelle den Kürbis ans Fenster.'],['Chiudo la porta: c’è il lupo mannaro!','Ich schließe die Tür: Da ist der Werwolf!'],['Scrivo sulla tomba: aiuto!','Ich schreibe auf das Grab: Hilfe!'],['Chi è? Nessuno risponde.','Wer ist da? Niemand antwortet.'],['Il mostro vive sotto il letto.','Das Monster lebt unter dem Bett.']],
      reading:{ title:'Il libro della strega',
        text:'La strega vive nel bosco. A mezzanotte prende il libro di magia e legge. Poi mette una candela sulla finestra e chiude la porta. Beve una pozione verde e… ecco un mostro! «Chi sei?» Il mostro non risponde. È un topo!',
        tr:'Die Hexe lebt im Wald. Um Mitternacht nimmt sie das Zauberbuch und liest. Dann stellt sie eine Kerze ans Fenster und schließt die Tür. Sie trinkt einen grünen Zaubertrank und … da ist das Monster! „Wer bist du?“ Das Monster antwortet nicht. Es ist eine Maus!',
        qs:[['Wo lebt die Hexe?',['Im Wald','Im Schloss','In der Stadt','Auf dem Friedhof']],['Was erscheint am Ende?',['Eine Maus','Ein Drache','Ein Vampir','Nichts']]] } },

    { title:'Preferisco il buio', de:'Mir ist die Dunkelheit lieber', focus:'Gegenwart: Verben auf -ire',
      tip:'Viele Verben auf -ire bekommen ein <b>-isc-</b>: fin<b>isc</b>o (ich beende), cap<b>isc</b>o (ich verstehe), prefer<b>isc</b>o (mir ist … lieber), pul<b>isc</b>o (ich putze). Andere nicht: part<b>o</b> (ich fahre ab), apr<b>o</b> (ich öffne), dorm<b>o</b> (ich schlafe).',
      words:[['parto','ich fahre ab, ich reise ab','verben'],['finisco / finisce','ich beende / er, sie endet','verben'],['capisco / capisci','ich verstehe / du verstehst','verben'],['preferisco','mir ist … lieber','verben'],['pulisco','ich putze','verben'],['apre','er, sie öffnet','verben'],['scopro','ich entdecke','verben'],['offro','ich biete an','verben']],
      sentences:[['Preferisco il buio alla luce.','Mir ist die Dunkelheit lieber als das Licht.'],['Non capisco: dov’è il fantasma?','Ich verstehe nicht: Wo ist das Gespenst?'],['Capisci la strega? No!','Verstehst du die Hexe? Nein!'],['Il film finisce a mezzanotte.','Der Film endet um Mitternacht.'],['Pulisco la bara del vampiro.','Ich putze den Sarg des Vampirs.'],['La mummia apre la porta.','Die Mumie öffnet die Tür.'],['Scopro una porta dietro il quadro.','Ich entdecke eine Tür hinter dem Bild.'],['Offro una caramella al fantasma.','Ich biete dem Gespenst ein Bonbon an.']],
      reading:{ title:'Il vampiro in vacanza',
        text:'Sono un vampiro. Stasera parto con la mia famiglia. Io preferisco il freddo e il buio. Ma la mia famiglia preferisce il sole! Io non capisco. Allora pulisco la mia bara e scopro una grotta buia nel bosco. Perfetto!',
        tr:'Ich bin ein Vampir. Heute Abend reise ich mit meiner Familie ab. Mir sind Kälte und Dunkelheit lieber. Aber meiner Familie ist die Sonne lieber! Ich verstehe das nicht. Also putze ich meinen Sarg und entdecke eine dunkle Höhle im Wald. Perfekt!',
        qs:[['Was ist dem Vampir lieber?',['Kälte und Dunkelheit','Die Sonne','Das Meer','Die Stadt']],['Welchen Ort findet er?',['Eine dunkle Höhle im Wald','Ein Hotel','Eine Burg','Einen Friedhof']]] } },

    { title:'Vieni con me?', de:'Kommst du mit?', focus:'Unregelmäßig: andare, fare, venire',
      tip:'Drei wichtige unregelmäßige Verben: <b>andare</b> (gehen): vado, vai, va, andiamo. <b>fare</b> (machen): faccio, fai, fa, facciamo. <b>venire</b> (kommen): vengo, vieni, viene, veniamo. <b>Andare a casa</b> heißt nach Hause gehen.',
      words:[['vado / vai / va','ich gehe / du gehst / er, sie geht','verben'],['andiamo','wir gehen','verben'],['faccio / fai / fa','ich mache / du machst / er, sie macht','verben'],['facciamo','wir machen','verben'],['vengo / vieni / viene','ich komme / du kommst / er, sie kommt','verben'],['veniamo','wir kommen','verben'],['con me','mit mir'],['a casa','nach Hause, zu Hause','orte']],
      sentences:[['Vado al cimitero. Vieni con me?','Ich gehe zum Friedhof. Kommst du mit?'],['Che fai domani? Faccio una zucca.','Was machst du morgen? Ich mache einen Kürbis.'],['Andiamo nella casa stregata!','Gehen wir ins Spukhaus!'],['Il vampiro viene a mezzanotte.','Der Vampir kommt um Mitternacht.'],['Vengo, ma ho paura!','Ich komme, aber ich habe Angst!'],['Facciamo paura ai bambini?','Erschrecken wir die Kinder?'],['Dove vai, Luca? Vado a casa.','Wohin gehst du, Luca? Ich gehe nach Hause.'],['Veniamo con la maschera e il mantello!','Wir kommen mit Maske und Umhang!']],
      reading:{ title:'Un piano per stasera', dialog:true,
        text:'— Ciao Luca! Che fai stasera?\n— Vado al cimitero con mio fratello. Vieni con me?\n— Al cimitero? Di notte? Che facciamo là?\n— Facciamo le foto ai fantasmi!\n— Va bene, vengo. Ma a mezzanotte vado a casa!\n— Perfetto. Veniamo da te alle dieci.',
        tr:'– Hallo Luca! Was machst du heute Abend? – Ich gehe mit meinem Bruder zum Friedhof. Kommst du mit? – Zum Friedhof? Nachts? Was machen wir dort? – Wir machen Fotos von den Gespenstern! – Na gut, ich komme. Aber um Mitternacht gehe ich nach Hause! – Perfekt. Wir kommen um zehn zu dir.',
        qs:[['Was wollen sie auf dem Friedhof machen?',['Fotos von Gespenstern','Kürbisse schnitzen','Eine Party feiern','Schlafen']],['Wann holen sie die Freundin ab?',['Um zehn','Um Mitternacht','Um neun','Um elf']]] } },

    { title:'La cena dei mostri', de:'Das Abendessen der Monster', focus:'Wörter: Essen & Trinken',
      tip:'<b>Mangiare</b> (essen) und <b>bere</b> (trinken): mangio, mangi, mangia – bevo, bevi, beve. Mit <b>mi piace</b> sagst du, was du gern isst: mi piace la pizza. Bei mehreren Sachen: <b>mi piacciono</b> i biscotti.',
      words:[['la cena','das Abendessen'],['la pizza','die Pizza'],['la pasta','die Nudeln'],['la zuppa','die Suppe'],['il pane','das Brot'],['il formaggio','der Käse'],['l’acqua','das Wasser'],['il succo','der Saft'],['mangia / mangiano','er, sie isst / sie essen','verben']],
      sentences:[['Oggi la cena è in cantina.','Heute ist das Abendessen im Keller.'],['Mi piace la pizza con il formaggio.','Ich mag Pizza mit Käse.'],['La strega mangia una zuppa verde.','Die Hexe isst eine grüne Suppe.'],['Il vampiro beve un succo rosso.','Der Vampir trinkt einen roten Saft.'],['Lo zombie non mangia la pasta.','Der Zombie isst keine Nudeln.'],['Hai sete? Ecco l’acqua.','Hast du Durst? Hier ist Wasser.'],['Il pane è vecchio e nero!','Das Brot ist alt und schwarz!'],['Mi piacciono la pasta e la pizza.','Ich mag Nudeln und Pizza.']],
      reading:{ title:'A tavola!',
        text:'Stasera la famiglia Mostro fa una cena. La mamma strega prepara una zuppa di zucca. Il papà vampiro beve un succo rosso. Lo zombie mangia il pane e il formaggio. La mummia? La mummia non mangia: ha la bocca chiusa! E i bambini? Mangiano la pizza, naturalmente.',
        tr:'Heute Abend macht die Familie Monster ein Abendessen. Mama Hexe kocht eine Kürbissuppe. Papa Vampir trinkt einen roten Saft. Der Zombie isst Brot und Käse. Die Mumie? Die Mumie isst nichts: Ihr Mund ist zu! Und die Kinder? Die essen natürlich Pizza.',
        qs:[['Was kocht die Mama?',['Kürbissuppe','Pizza','Nudeln','Nichts']],['Warum isst die Mumie nichts?',['Ihr Mund ist zu','Sie hat keinen Hunger','Sie ist müde','Sie ist nicht da']]] } },

    { title:'Al cinema horror', de:'Im Horrorkino', focus:'Gegenwart & Vorlieben im Kino',
      tip:'Mit <b>comincia</b> (beginnt) und <b>finisce</b> (endet) sprichst du über Uhrzeiten: il film comincia <b>alle</b> nove (um neun). Ein Adjektiv für gruselige Filme: <b>spaventoso</b> (gruselig, furchterregend).',
      words:[['la sala','der Kinosaal'],['lo schermo','die Leinwand'],['la fila','die Reihe'],['il posto','der Platz'],['comincia','beginnt','verben'],['il finale','das Ende'],['spaventoso / spaventosa','gruselig','wie'],['divertente / divertenti','lustig','wie']],
      sentences:[['Il film comincia alle nove.','Der Film beginnt um neun.'],['Il nostro posto è nella fila tre.','Unser Platz ist in Reihe drei.'],['Lo schermo è enorme!','Die Leinwand ist riesig!'],['Il film è spaventoso, ma il finale è divertente.','Der Film ist gruselig, aber das Ende ist lustig.'],['Nella sala è buio.','Im Saal ist es dunkel.'],['Mangio i popcorn e guardo lo schermo.','Ich esse Popcorn und schaue auf die Leinwand.'],['Il finale? Non lo so, non guardo!','Das Ende? Ich weiß es nicht, ich schaue nicht hin!'],['Preferisco i film divertenti.','Mir sind lustige Filme lieber.']],
      reading:{ title:'«La notte degli zombie»',
        text:'Stasera io e mia sorella siamo al cinema. Il film comincia alle nove: «La notte degli zombie». Il nostro posto è nella fila due, davanti allo schermo. Il film è molto spaventoso! Mia sorella chiude gli occhi. Io mangio tutti i popcorn. Il finale? È divertente: gli zombie ballano!',
        tr:'Heute Abend sind meine Schwester und ich im Kino. Der Film beginnt um neun: „Die Nacht der Zombies“. Unser Platz ist in Reihe zwei, vor der Leinwand. Der Film ist sehr gruselig! Meine Schwester macht die Augen zu. Ich esse das ganze Popcorn. Das Ende? Es ist lustig: Die Zombies tanzen!',
        qs:[['In welcher Reihe sitzen sie?',['In Reihe zwei','In Reihe drei','In Reihe neun','Ganz hinten']],['Was passiert am Ende des Films?',['Die Zombies tanzen','Die Zombies essen Popcorn','Alle schreien','Das Licht geht aus']]] } },

    { title:'Lo zaino per la notte', de:'Der Rucksack für die Nacht', focus:'Wörter: Ausrüstung',
      tip:'<b>Porto</b> heißt „ich bringe mit“ oder „ich trage“. <b>Serve</b> heißt „man braucht“: Cosa serve? (Was braucht man?) – Serve una torcia (Man braucht eine Taschenlampe).',
      words:[['lo zaino','der Rucksack'],['la torcia','die Taschenlampe'],['la coperta','die Decke'],['il cuscino','das Kissen'],['la mappa','die Karte, der Plan'],['il telefono','das Telefon, das Handy'],['porto','ich bringe mit','verben'],['serve','man braucht','verben']],
      sentences:[['Che porto nello zaino?','Was nehme ich im Rucksack mit?'],['Serve una torcia: nel bosco è buio.','Man braucht eine Taschenlampe: Im Wald ist es dunkel.'],['Porto una coperta e un cuscino.','Ich nehme eine Decke und ein Kissen mit.'],['Dov’è la mappa del cimitero?','Wo ist der Plan des Friedhofs?'],['Il telefono non ha la luce!','Das Handy hat kein Licht!'],['Nello zaino ci sono cinque caramelle.','Im Rucksack sind fünf Bonbons.'],['Serve una chiave per il cancello.','Man braucht einen Schlüssel für das Tor.'],['Porto anche il gatto? No!','Nehme ich auch die Katze mit? Nein!']],
      reading:{ title:'Una notte nel bosco',
        text:'Stanotte dormo nel bosco con mio fratello. Che serve? Nello zaino porto una torcia, una coperta, un cuscino e la mappa del bosco. Porto anche il telefono e dieci caramelle. Mio fratello porta… il suo gatto nero! Il gatto dorme sul mio cuscino. Buonanotte!',
        tr:'Heute Nacht schlafe ich mit meinem Bruder im Wald. Was braucht man? Im Rucksack habe ich eine Taschenlampe, eine Decke, ein Kissen und die Karte vom Wald. Ich nehme auch das Handy und zehn Bonbons mit. Mein Bruder nimmt … seine schwarze Katze mit! Die Katze schläft auf meinem Kissen. Gute Nacht!',
        qs:[['Wie viele Bonbons sind im Rucksack?',['Zehn','Fünf','Keine','Hundert']],['Wo schläft die Katze?',['Auf dem Kissen','Im Rucksack','Unter der Decke','Beim Bruder']]] } },

    { title:'La scuola di magia', de:'Die Zauberschule', focus:'Gegenwart: lernen & Schule',

      sentences:[['Cosa hai fatto ieri sera?','Was hast du gestern Abend gemacht?'],['Ho letto un libro di magia.','Ich habe ein Zauberbuch gelesen.'],['Ho scritto «aiuto» sulla finestra.','Ich habe „Hilfe“ auf das Fenster geschrieben.'],['Ho preso la torcia e sono uscito.','Ich habe die Taschenlampe genommen und bin hinausgegangen.'],['Ho messo la zucca sulla finestra.','Ich habe den Kürbis ans Fenster gestellt.'],['Il vampiro ha bevuto un succo rosso.','Der Vampir hat einen roten Saft getrunken.'],['Ho aperto la bara: non c’è nessuno!','Ich habe den Sarg geöffnet: Da ist niemand!'],['Cosa hai detto? Non ho sentito.','Was hast du gesagt? Ich habe nichts gehört.']],

    { title:'Viaggio in Transilvania', de:'Reise nach Transsilvanien', focus:'Vergangenheit mit „sein“: Reisen',

      words:[['il viaggio','die Reise'],['sono partito / partita','ich bin abgefahren','verben'],['siamo partiti','wir sind abgefahren','verben'],['è arrivato / arrivata','ist angekommen','verben'],['il treno','der Zug'],['l’aereo','das Flugzeug'],['la valigia','der Koffer'],['la stazione','der Bahnhof'],['l’albergo','das Hotel']],
      sentences:[['Sono partita per la Transilvania.','Ich bin nach Transsilvanien gefahren.'],['Siamo partiti in treno alle sei.','Wir sind um sechs mit dem Zug abgefahren.'],['L’aereo è arrivato a mezzanotte.','Das Flugzeug ist um Mitternacht angekommen.'],['Nella valigia c’è una bara piccola!','Im Koffer ist ein kleiner Sarg!'],['Alla stazione c’è la nebbia.','Am Bahnhof ist Nebel.'],['L’albergo è vecchio e buio.','Das Hotel ist alt und dunkel.'],['Il viaggio in treno è lungo.','Die Zugfahrt ist lang.'],['Sono tornato con un pipistrello nella valigia!','Ich bin mit einer Fledermaus im Koffer zurückgekommen!']],
      reading:{ title:'Il castello-albergo',
        text:'La settimana scorsa sono partita per la Transilvania. Sono andata in aereo e poi in treno. Alla stazione ho visto la nebbia. L’albergo? Un castello vecchio sulla montagna! Nella mia camera, al posto del letto, ho visto una bara! Non ho dormito. La mattina sono tornata a casa.',
        tr:'Letzte Woche bin ich nach Transsilvanien gefahren. Ich bin mit dem Flugzeug und dann mit dem Zug gereist. Am Bahnhof habe ich Nebel gesehen. Das Hotel? Eine alte Burg auf dem Berg! In meinem Zimmer habe ich statt eines Betts einen Sarg gesehen! Ich habe nicht geschlafen. Am Morgen bin ich nach Hause gefahren.',
        qs:[['Wie ist die Erzählerin gereist?',['Mit dem Flugzeug und dem Zug','Mit dem Auto','Mit dem Bus','Zu Fuß']],['Was stand im Hotelzimmer statt eines Betts?',['Ein Sarg','Ein Sofa','Nichts','Ein Koffer']]] } },

    { title:'Al ristorante del vampiro', de:'Im Vampir-Restaurant', focus:'Vergangenheit – abgeschlossen: im Restaurant',
      tip:'Im Restaurant: <b>Ho ordinato</b> (ich habe bestellt), <b>ho pagato</b> (ich habe bezahlt). Die Rechnung verlangst du mit <b>Il conto, per favore!</b> <b>Buonissimo</b> heißt „superlecker“.',
      words:[['il ristorante','das Restaurant'],['il cameriere','der Kellner','leute'],['il menù','die Speisekarte'],['il tavolo','der Tisch'],['ho ordinato','ich habe bestellt','verben'],['ho pagato','ich habe bezahlt','verben'],['il conto','die Rechnung'],['buonissimo / buonissima','superlecker','wie'],['per favore','bitte','gruss']],
      sentences:[['Il cameriere è un vampiro!','Der Kellner ist ein Vampir!'],['Ho ordinato una zuppa di zucca.','Ich habe eine Kürbissuppe bestellt.'],['Il menù è nero e rosso.','Die Speisekarte ist schwarz und rot.'],['Il nostro tavolo è accanto alla finestra.','Unser Tisch steht neben dem Fenster.'],['La pizza è buonissima!','Die Pizza ist superlecker!'],['Il conto, per favore!','Die Rechnung, bitte!'],['Ho pagato trenta euro.','Ich habe dreißig Euro bezahlt.'],['Cosa hai ordinato? Un succo rosso.','Was hast du bestellt? Einen roten Saft.']],
      reading:{ title:'«Da Dracula»',
        text:'Ieri sera sono andata con Luca al ristorante «Da Dracula». Il cameriere: alto e bianco, con un mantello nero. Il menù? Molto strano. Io ho ordinato la pasta, Luca ha ordinato una zuppa rossa. La pasta: buonissima! Poi Luca: «Il conto, per favore!» Il cameriere: «Non pagate con i soldi… pagate con il sangue!»',
        tr:'Gestern Abend bin ich mit Luca ins Restaurant „Da Dracula“ gegangen. Der Kellner: groß und weiß, mit einem schwarzen Umhang. Die Speisekarte? Sehr seltsam. Ich habe Nudeln bestellt, Luca hat eine rote Suppe bestellt. Die Nudeln: superlecker! Dann Luca: „Die Rechnung, bitte!“ Der Kellner: „Ihr bezahlt nicht mit Geld … ihr bezahlt mit Blut!“',
        qs:[['Wie sah der Kellner aus?',['Groß und weiß, mit schwarzem Umhang','Klein und dick','Wie ein Zombie','Normal']],['Womit soll man bezahlen?',['Mit Blut','Mit Geld','Mit Bonbons','Gar nicht']]] } },

    { title:'Il furto al museo', de:'Der Diebstahl im Museum', focus:'Vergangenheit – abgeschlossen: Sie haben …',
      tip:'Für „sie haben“ (mehrere) steht <b>hanno</b> + Partizip: <b>hanno rubato</b> (sie haben gestohlen). Für „er/sie hat“: <b>ha</b> trovato. <b>Qualcuno</b> heißt „jemand“, <b>qualcosa</b> „etwas“.',
      words:[['il museo','das Museum','orte'],['il ladro / i ladri','der Dieb / die Diebe','leute'],['hanno rubato','sie haben gestohlen','verben'],['ha rubato','er, sie hat gestohlen','verben'],['qualcuno','jemand','leute'],['qualcosa','etwas'],['il detective','der Detektiv','leute'],['ha trovato','er, sie hat gefunden','verben']],
      sentences:[['Qualcuno ha rubato la mummia!','Jemand hat die Mumie gestohlen!'],['I ladri hanno rubato un quadro.','Die Diebe haben ein Bild gestohlen.'],['Il museo è chiuso di notte.','Das Museum ist nachts geschlossen.'],['Il detective ha trovato qualcosa.','Der Detektiv hat etwas gefunden.'],['Chi è il ladro? Il fantasma!','Wer ist der Dieb? Das Gespenst!'],['Hai visto qualcosa? No, niente.','Hast du etwas gesehen? Nein, nichts.'],['Il ladro è uscito dalla finestra.','Der Dieb ist durchs Fenster hinausgegangen.'],['La polizia è arrivata al museo.','Die Polizei ist beim Museum angekommen.']],
      reading:{ title:'Dov’è la mummia?',
        text:'La notte scorsa qualcuno ha rubato la mummia del museo. La polizia è arrivata alle sei. Il detective ha guardato nel museo: niente. Poi ha trovato qualcosa sotto il tavolo: una benda bianca. Il detective ha seguito le bende fino alla cantina. E in cantina? La mummia: dorme!',
        tr:'Letzte Nacht hat jemand die Mumie aus dem Museum gestohlen. Die Polizei ist um sechs gekommen. Der Detektiv hat im Museum geschaut: nichts. Dann hat er etwas unter dem Tisch gefunden: eine weiße Binde. Der Detektiv ist den Binden bis in den Keller gefolgt. Und im Keller? Die Mumie: Sie schläft!',
        qs:[['Was hat der Detektiv unter dem Tisch gefunden?',['Eine weiße Binde','Einen Schlüssel','Ein Bild','Nichts']],['Wo war die Mumie?',['Im Keller – sie schläft','Beim Dieb','Auf dem Dach','Im Garten']]] } },

    { title:'Dal dottore', de:'Beim Arzt', focus:'Vergangenheit & Körper: beim Arzt',
      tip:'„Mir tut … weh“ heißt <b>mi fa male</b> + eine Sache: mi fa male la testa. Bei mehreren: <b>mi fanno male</b> i piedi. Fieber „hat“ man: <b>ho la febbre</b>.',
      words:[['il dottore / la dottoressa','der Arzt / die Ärztin','leute'],['mi fa male','mir tut … weh'],['mi fanno male','mir tun … weh'],['la febbre','das Fieber'],['la gamba','das Bein'],['il braccio','der Arm'],['la medicina','das Medikament'],['sono caduto / caduta','ich bin hingefallen','verben']],
      sentences:[['Dottore, mi fa male la testa.','Herr Doktor, mir tut der Kopf weh.'],['Lo zombie ha la febbre.','Der Zombie hat Fieber.'],['Mi fanno male i denti!','Mir tun die Zähne weh!'],['Sono caduta dalle scale.','Ich bin die Treppe hinuntergefallen.'],['Alla mummia fa male il braccio.','Der Mumie tut der Arm weh.'],['Ecco la medicina: una pozione verde.','Hier ist das Medikament: ein grüner Trank.'],['Dov’è la gamba dello scheletro?','Wo ist das Bein des Skeletts?'],['La dottoressa è una strega calma.','Die Ärztin ist eine ruhige Hexe.']],
      reading:{ title:'Lo scheletro dal dottore', dialog:true,
        text:'— Buonasera, dottore.\n— Buonasera! Cosa è successo?\n— Ieri sera sono caduto dalle scale del cimitero. Mi fa male la gamba.\n— Vediamo… Ma lei non ha una gamba!\n— Eh sì! Non c’è più!\n— Allora non serve una medicina. Serve un cane… che trova le ossa!',
        tr:'– Guten Abend, Herr Doktor. – Guten Abend! Was ist passiert? – Gestern Abend bin ich die Treppe am Friedhof hinuntergefallen. Mir tut das Bein weh. – Mal sehen … Aber Sie haben ja gar kein Bein! – Eben! Es ist weg! – Dann braucht man kein Medikament. Man braucht einen Hund … der Knochen findet!',
        qs:[['Wo ist das Skelett hingefallen?',['Auf der Treppe am Friedhof','Im Bad','Im Garten','Auf dem Dach']],['Was braucht das Skelett laut Arzt?',['Einen Hund, der Knochen findet','Ein Medikament','Ruhe','Eine Operation']]] } },

    { title:'Le regole del castello', de:'Die Regeln der Burg', focus:'Dürfen & müssen: Regeln',

      sentences:[['Nella casa stregata è vietato correre.','Im Spukhaus ist Rennen verboten.'],['Non si può toccare la bara.','Man darf den Sarg nicht anfassen.'],['Bisogna parlare piano: il vampiro dorme.','Man muss leise sprechen: Der Vampir schläft.'],['È vietato fare foto ai fantasmi.','Es ist verboten, die Gespenster zu fotografieren.'],['Non si può aprire la soffitta.','Man darf den Dachboden nicht öffnen.'],['A mezzanotte bisogna dormire.','Um Mitternacht muss man schlafen.'],['Ecco la prima regola: non aprire la bara!','Hier ist die erste Regel: Den Sarg nicht öffnen!'],['Posso toccare lo scheletro? No, è vietato!','Darf ich das Skelett anfassen? Nein, das ist verboten!']],
      reading:{ title:'Benvenuti!',
        text:'Benvenuti nella casa stregata! Ecco le regole. Regola uno: è vietato correre nel corridoio. Regola due: non si può toccare la bara. Regola tre: bisogna parlare piano, il vampiro dorme. Regola quattro: è vietato fare foto ai fantasmi… perché non vengono bene!',
        tr:'Willkommen im Spukhaus! Hier sind die Regeln. Regel eins: Rennen im Flur ist verboten. Regel zwei: Man darf den Sarg nicht anfassen. Regel drei: Man muss leise sprechen, der Vampir schläft. Regel vier: Es ist verboten, die Gespenster zu fotografieren … weil sie auf den Fotos nicht gut aussehen!',
        qs:[['Warum muss man leise sprechen?',['Der Vampir schläft','Die Gespenster hören zu','Es ist Nacht','Die Katze hat Angst']],['Warum darf man die Gespenster nicht fotografieren?',['Sie sehen auf Fotos nicht gut aus','Sie werden wütend','Das Licht tut ihnen weh','Das ist zu teuer']]] } },

    { title:'La mattina dello zombie', de:'Der Morgen des Zombies', focus:'Vergangenheit mit „sich“',
      tip:'Verben mit „sich“ nehmen in der abgeschlossenen Vergangenheit immer „sein“: <b>mi sono</b> svegliato (ich bin aufgewacht), <b>si è</b> lavato (er hat sich gewaschen). Das Partizip passt sich an: mi sono alzat<b>a</b> (eine Frau).',
      words:[['mi sono svegliato / svegliata','ich bin aufgewacht','verben'],['mi sono alzato / alzata','ich bin aufgestanden','verben'],['mi sono lavato / lavata','ich habe mich gewaschen','verben'],['mi sono vestito / vestita','ich habe mich angezogen','verben'],['si è pettinato','er hat sich gekämmt','verben'],['la colazione','das Frühstück'],['in ritardo','zu spät','zeit'],['presto','früh','zeit'],['stamattina','heute Morgen','zeit']],
      sentences:[['Stamattina mi sono svegliato nella tomba.','Heute Morgen bin ich im Grab aufgewacht.'],['Mi sono alzata alle due!','Ich bin um zwei aufgestanden!'],['Lo zombie non si è lavato.','Der Zombie hat sich nicht gewaschen.'],['Mi sono vestito da vampiro.','Ich habe mich als Vampir angezogen.'],['Il lupo mannaro si è pettinato allo specchio.','Der Werwolf hat sich im Spiegel gekämmt.'],['A colazione ho mangiato una torta.','Zum Frühstück habe ich einen Kuchen gegessen.'],['Sono arrivato in ritardo a scuola.','Ich bin zu spät in die Schule gekommen.'],['La strega si è svegliata presto.','Die Hexe ist früh aufgewacht.']],
      reading:{ title:'Zombie in ritardo',
        text:'Stamattina lo zombie si è svegliato alle nove. Si è alzato dalla tomba. Non si è lavato e non si è pettinato. Si è vestito: le scarpe? Una nera e una rossa! A colazione ha mangiato solo un biscotto. Poi è andato a scuola… ed è arrivato in ritardo. L’insegnante: «Ancora, zombie?»',
        tr:'Heute Morgen ist der Zombie um neun aufgewacht. Er ist aus dem Grab aufgestanden. Er hat sich nicht gewaschen und nicht gekämmt. Er hat sich angezogen: die Schuhe? Einer schwarz, einer rot! Zum Frühstück hat er nur einen Keks gegessen. Dann ist er zur Schule gegangen … und ist zu spät gekommen. Die Lehrerin: „Schon wieder, Zombie?“',
        qs:[['Welche Schuhe trägt der Zombie?',['Einen schwarzen und einen roten','Zwei schwarze','Keine','Zwei rote']],['Was hat er zum Frühstück gegessen?',['Nur einen Keks','Eine Pizza','Nichts','Eine Suppe']]] } },

    { title:'Lo shopping di Halloween', de:'Halloween-Einkauf', focus:'Vergangenheit – abgeschlossen: einkaufen',

        tr:'Gestern bin ich in den Halloween-Laden gegangen. Ich habe ein Hexenkleid anprobiert: zu eng! Dann habe ich ein Vampirkostüm anprobiert: zu lang! Das Mumienkostüm? Zu teuer. Dann habe ich mit Rabatt ein weißes Bettlaken gekauft: zehn Euro. Ich bin ein perfektes Gespenst!',
        qs:[['Warum passte das Hexenkleid nicht?',['Es war zu eng','Es war zu lang','Es war zu teuer','Es war kaputt']],['Was hat sie am Ende gekauft?',['Ein weißes Bettlaken','Das Vampirkostüm','Eine Maske','Nichts']]] } },
