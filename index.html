<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Con Passione ist umgezogen</title>
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f1e9;color:#2b2622;font:17px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box;text-align:center}
a{display:inline-block;margin-top:12px;padding:12px 22px;border-radius:14px;background:#b33a2e;color:#fff;text-decoration:none;font-weight:700}
</style>
<script>
/* 11.11.2026: Die App wohnt jetzt auf https://con-passione.app/. Diese alte Adresse leitet sofort weiter
   und nimmt den Lernstand beim ersten Mal mit (wie der Umzugsknopf; die neue Seite behält einen weiteren Stand, der dort schon ist). */
(function(){
  var ziel = 'https://con-passione.app/';
  try{
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
    var d = {}, n = 0;
    for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k && k.indexOf('conpassione.') === 0){ d[k] = localStorage.getItem(k); if (k !== 'conpassione.lang') n++; } }
    if (n && !localStorage.getItem('cp-umgezogen')){
      localStorage.setItem('cp-umgezogen', new Date().toISOString());
      ziel += '#umzug=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));
    }
  }catch(e){}
  location.replace(ziel);
})();
</script>
</head>
<body>
<div><p><b>Con Passione ist umgezogen.</b><br>Die App findest du jetzt unter con-passione.app.</p>
<a href="https://con-passione.app/">Zur App</a></div>
</body>
</html>
