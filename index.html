      tip:'Mit diesen Wörtern bringst du Ordnung in eine Geschichte: <b>prima</b> (zuerst), <b>poi</b> (dann), <b>dopo</b> (danach), <b>alla fine</b> (am Ende), <b>finalmente</b> (endlich).',
      words:[['il diario','das Tagebuch'],['caro diario','liebes Tagebuch'],['all’inizio','am Anfang','zeit'],['alla fine','am Ende','zeit'],['finalmente','endlich','zeit'],['ho deciso','ich habe beschlossen','verben'],['ho volato','ich bin geflogen','verben'],['ho preparato','ich habe zubereitet','verben'],['è stato / è stata','war, ist gewesen','verben']],
      sentences:[['Caro diario, oggi è stato un giorno strano.','Liebes Tagebuch, heute war ein seltsamer Tag.'],['All’inizio ho preparato una pozione.','Am Anfang habe ich einen Zaubertrank zubereitet.'],['Prima ho preso la scopa, poi ho volato.','Zuerst habe ich den Besen genommen, dann bin ich geflogen.'],['Dopo ho deciso: vado al cimitero!','Danach habe ich beschlossen: Ich gehe zum Friedhof!'],['Alla fine sono tornata a casa.','Am Ende bin ich nach Hause zurückgekehrt.'],['Finalmente è mezzanotte!','Endlich ist es Mitternacht!'],['Il diario della strega è nero.','Das Tagebuch der Hexe ist schwarz.'],['Ho volato sopra la città.','Ich bin über die Stadt geflogen.']],
      reading:{ title:'Caro diario…',
        text:'Caro diario, oggi è stato un giorno difficile. All’inizio ho preparato una pozione per volare. Poi ho preso la scopa e ho volato sopra il bosco. Ma a mezzanotte la scopa si è fermata! Sono caduta nel bosco. Alla fine sono tornata a casa a piedi. Finalmente sono a letto. Buonanotte!',
        tr:'Liebes Tagebuch, heute war ein schwieriger Tag. Am Anfang habe ich einen Flugtrank zubereitet. Dann habe ich den Besen genommen und bin über den Wald geflogen. Aber um Mitternacht ist der Besen stehen geblieben! Ich bin in den Wald gefallen. Am Ende bin ich zu Fuß nach Hause gegangen. Endlich liege ich im Bett. Gute Nacht!',
        qs:[['Was ist um Mitternacht passiert?',['Der Besen ist stehen geblieben','Es hat geregnet','Die Katze ist weggelaufen','Der Trank war leer']],['Wie ist die Hexe nach Hause gekommen?',['Zu Fuß','Auf dem Besen','Mit dem Zug','Gar nicht']]] } },

    { title:'La festa a sorpresa', de:'Die Überraschungsparty', focus:'Vergangenheit – abgeschlossen: wir haben …',
      tip:'Für „wir haben“ steht <b>abbiamo</b> + Partizip: abbiamo preparato, abbiamo invitato. Glückwünsche: <b>Tanti auguri!</b> (Alles Gute!). Das Alter: ha compiuto cento anni (er ist hundert geworden).',
      words:[['la festa a sorpresa','die Überraschungsparty'],['il compleanno','der Geburtstag'],['il regalo','das Geschenk'],['gli invitati','die Gäste','leute'],['abbiamo preparato','wir haben vorbereitet','verben'],['abbiamo invitato','wir haben eingeladen','verben'],['Tanti auguri!','Alles Gute!','gruss'],['ha compiuto','ist … geworden (Alter)','verben'],['gli anni','die Jahre','zeit']],
      sentences:[['Oggi è il compleanno del nonno.','Heute hat Opa Geburtstag.'],['Abbiamo preparato una festa a sorpresa.','Wir haben eine Überraschungsparty vorbereitet.'],['Abbiamo invitato la strega e il vampiro.','Wir haben die Hexe und den Vampir eingeladen.'],['Gli invitati sono arrivati alle otto.','Die Gäste sind um acht gekommen.'],['Tanti auguri, Dracula!','Alles Gute, Dracula!'],['Ecco il regalo: una bara nuova!','Hier ist das Geschenk: ein neuer Sarg!'],['Il fantasma ha compiuto cento anni.','Das Gespenst ist hundert Jahre alt geworden.'],['Il regalo è sotto il tavolo.','Das Geschenk ist unter dem Tisch.']],
      reading:{ title:'Trecento candeline',
        text:'Oggi il fantasma della soffitta ha compiuto cento anni. Abbiamo preparato una festa a sorpresa. Abbiamo invitato la strega, il vampiro e la mummia. Alle nove gli invitati sono arrivati. Abbiamo spento la luce e aspettato. Il fantasma è entrato e… «Sorpresa! Tanti auguri!» Il fantasma: «Aiuto!» Ed è scappato!',
        tr:'Heute ist das Gespenst vom Dachboden hundert Jahre alt geworden. Wir haben eine Überraschungsparty vorbereitet. Wir haben die Hexe, den Vampir und die Mumie eingeladen. Um neun sind die Gäste gekommen. Wir haben das Licht ausgemacht und gewartet. Das Gespenst ist hereingekommen und … „Überraschung! Alles Gute!“ Das Gespenst: „Hilfe!“ Und es ist weggelaufen!',
        qs:[['Wie alt ist das Gespenst geworden?',['Hundert Jahre','Dreihundert Jahre','Dreizehn Jahre','Tausend Jahre']],['Wie hat das Gespenst reagiert?',['Es hat sich erschreckt und ist weggelaufen','Es hat gelacht','Es hat geweint','Es hat getanzt']]] } },

    { title:'Dove l’hai messo?', de:'Wo hast du ihn hingelegt?', focus:'Kleine Wörter: ihn, sie, es',
      tip:'Statt das Nomen zu wiederholen, sagst du <b>lo</b> (ihn, es), <b>la</b> (sie), <b>li</b> (sie, mehrere männlich), <b>le</b> (sie, mehrere weiblich). Sie stehen vor dem Verb: <b>lo</b> vedo (ich sehe ihn). Vor ho wird gekürzt: <b>l’</b>ho visto.',
      words:[['lo vedo / la vedo','ich sehe ihn / sie'],['li vedo / le vedo','ich sehe sie (mehrere)'],['l’ho visto / l’ho vista','ich habe ihn / sie gesehen','verben'],['l’ho messo / l’ho messa','ich habe ihn / sie hingelegt','verben'],['non lo trovo','ich finde ihn/es nicht'],['lo prendo','ich nehme ihn/es'],['la chiamo','ich rufe sie an'],['l’ho perso / l’ho persa','ich habe ihn / sie verloren','verben']],
      sentences:[['Dov’è la scopa? Non la vedo!','Wo ist der Besen? Ich sehe ihn nicht!'],['Il gatto nero? L’ho visto in cantina.','Die schwarze Katze? Ich habe sie im Keller gesehen.'],['La torcia? L’ho messa nello zaino.','Die Taschenlampe? Ich habe sie in den Rucksack gelegt.'],['Il cappello? Non lo trovo.','Der Hut? Ich finde ihn nicht.'],['Ecco il mantello: lo prendo io.','Hier ist der Umhang: Ich nehme ihn.'],['La nonna? La chiamo stasera.','Oma? Ich rufe sie heute Abend an.'],['I fantasmi? Li vedo alla finestra!','Die Gespenster? Ich sehe sie am Fenster!'],['La chiave? L’ho persa nel cimitero!','Der Schlüssel? Ich habe ihn auf dem Friedhof verloren!']],
      reading:{ title:'Dov’è la testa?', dialog:true,
        text:'— Mamma, dov’è la mia testa?\n— La tua testa? L’ho vista in cucina.\n— In cucina? Non la vedo!\n— Allora l’ho messa in soffitta.\n— Non la trovo! E il mio cappello?\n— Il cappello l’hai perso al cimitero.\n— Ah, ecco la testa! È sotto il letto… con il cappello!',
        tr:'– Mama, wo ist mein Kopf? – Dein Kopf? Ich habe ihn in der Küche gesehen. – In der Küche? Ich sehe ihn nicht! – Dann habe ich ihn auf den Dachboden gelegt. – Ich finde ihn nicht! Und mein Hut? – Den Hut hast du auf dem Friedhof verloren. – Ah, da ist er! Er ist unter dem Bett … mit dem Hut!',
        qs:[['Was sucht das Kind?',['Seinen Kopf','Seinen Umhang','Die Katze','Den Schlüssel']],['Wo ist er am Ende?',['Unter dem Bett','In der Küche','Auf dem Dachboden','Auf dem Friedhof']]] } },

    { title:'Il nascondino', de:'Verstecken spielen', focus:'Vergangenheit: suchen & finden',
      tip:'<b>Nascondersi</b> (sich verstecken) hat eine unregelmäßige Form: mi sono <b>nascosto</b> / <b>nascosta</b> (ich habe mich versteckt). <b>Dappertutto</b> heißt „überall“.',
      words:[['il nascondino','Verstecken (Spiel)'],['mi sono nascosto / nascosta','ich habe mich versteckt','verben'],['ho contato','ich habe gezählt','verben'],['ho cercato','ich habe gesucht','verben'],['ho trovato','ich habe gefunden','verben'],['dappertutto','überall','orte'],['l’armadio','der Schrank'],['vinto','gewonnen','verben']],
      sentences:[['Facciamo il nascondino nella casa stregata?','Spielen wir Verstecken im Spukhaus?'],['Ho contato fino a venti.','Ich habe bis zwanzig gezählt.'],['Mi sono nascosta nell’armadio.','Ich habe mich im Schrank versteckt.'],['Ho cercato dappertutto.','Ich habe überall gesucht.'],['Ho trovato il vampiro nella bara!','Ich habe den Vampir im Sarg gefunden!'],['Il fantasma ha vinto: non lo vedo!','Das Gespenst hat gewonnen: Ich sehe es nicht!'],['Dove ti sei nascosto? Sotto le scale.','Wo hast du dich versteckt? Unter der Treppe.'],['Nell’armadio c’è uno scheletro!','Im Schrank ist ein Skelett!']],
      reading:{ title:'Nascondino con il fantasma',
        text:'Ieri sera abbiamo fatto il nascondino nella casa stregata. Io ho contato fino a venti. Mia sorella si è nascosta nell’armadio, mio fratello sotto il letto. Ho trovato mia sorella e mio fratello. Ma il fantasma? Ho cercato dappertutto: in cantina, in soffitta, in giardino. Niente! Alla fine ha vinto lui. Ma è sempre accanto a me!',
        tr:'Gestern Abend haben wir im Spukhaus Verstecken gespielt. Ich habe bis zwanzig gezählt. Meine Schwester hat sich im Schrank versteckt, mein Bruder unter dem Bett. Ich habe meine Schwester und meinen Bruder gefunden. Aber das Gespenst? Ich habe überall gesucht: im Keller, auf dem Dachboden, im Garten. Nichts! Am Ende hat es gewonnen. Dabei ist es die ganze Zeit neben mir!',
        qs:[['Wo hat sich die Schwester versteckt?',['Im Schrank','Unter dem Bett','Im Keller','Im Garten']],['Wo war das Gespenst?',['Die ganze Zeit neben dem Kind','Auf dem Dachboden','Im Garten','Unter der Treppe']]] } }
  ],

  4:[
    { title:'Quando ero piccolo', de:'Als ich klein war', focus:'Vergangenheit – erzählend: Kindheit',
      tip:'Mit der erzählenden Vergangenheit beschreibst du, wie es früher war: <b>ero</b> (ich war), <b>avevo</b> (ich hatte), <b>giocavo</b> (ich spielte), <b>credevo</b> (ich glaubte). Typischer Einstieg: <b>da piccolo</b> / <b>da piccola</b> (als ich klein war).',
      words:[['da piccolo / da piccola','als ich klein war','zeit'],['ero','ich war','verben'],['avevo','ich hatte','verben'],['giocavo','ich spielte','verben'],['credevo','ich glaubte','verben'],['avevo paura di','ich hatte Angst vor','verben'],['la sera','am Abend','zeit'],['i giocattoli','die Spielsachen'],['il bambino / la bambina','das Kind','leute']],
      sentences:[['Da piccola avevo paura del buio.','Als ich klein war, hatte ich Angst vor der Dunkelheit.'],['Ero un bambino molto nervoso.','Ich war ein sehr nervöses Kind.'],['Giocavo con i giocattoli in soffitta.','Ich spielte mit den Spielsachen auf dem Dachboden.'],['Credevo che sotto il letto c’era un mostro.','Ich glaubte, dass unter dem Bett ein Monster war.'],['La sera avevo paura di dormire.','Abends hatte ich Angst vor dem Schlafen.'],['Da piccolo credevo ai fantasmi.','Als ich klein war, glaubte ich an Gespenster.'],['Avevo un gatto nero e un cane.','Ich hatte eine schwarze Katze und einen Hund.'],['Ogni sera giocavo con mio fratello.','Jeden Abend spielte ich mit meinem Bruder.']],
      reading:{ title:'Il mostro nell’armadio',
        text:'Da piccola avevo paura di tutto. La sera credevo che nell’armadio c’era un mostro. Ogni notte la mamma apriva l’armadio: «Non c’è nessuno!» Ma io credevo sempre al mostro. Oggi so la verità: nell’armadio dormiva il gatto!',
        tr:'Als ich klein war, hatte ich vor allem Angst. Abends glaubte ich, dass im Schrank ein Monster war. Jede Nacht machte Mama den Schrank auf: „Da ist niemand!“ Aber ich glaubte immer an das Monster. Heute kenne ich die Wahrheit: Im Schrank schlief die Katze!',
        qs:[['Was glaubte die Erzählerin als Kind?',['Dass im Schrank ein Monster war','Dass die Mutter eine Hexe war','Dass es keine Gespenster gibt','Dass die Katze sprechen kann']],['Was war wirklich im Schrank?',['Die Katze','Ein Monster','Spielsachen','Nichts']]] } },

    { title:'C’era una volta', de:'Es war einmal', focus:'Vergangenheit – erzählend: Märchen',
      tip:'Märchen beginnen mit <b>C’era una volta</b> (Es war einmal). Die Kulisse steht in der erzählenden Vergangenheit (viveva – lebte, voleva – wollte, poteva – konnte). Wenn plötzlich etwas passiert, wechselt man: <b>un giorno è arrivato</b> (eines Tages kam).',
      words:[['c’era una volta','es war einmal'],['viveva','lebte','verben'],['voleva','wollte','verben'],['poteva','konnte','verben'],['il re','der König','leute'],['la principessa','die Prinzessin','leute'],['il principe / i principi','der Prinz / die Prinzen','leute'],['un giorno','eines Tages','zeit'],['la figlia','die Tochter','leute']],
      sentences:[['C’era una volta una strega gentile.','Es war einmal eine nette Hexe.'],['Viveva in un castello nel bosco.','Sie lebte in einer Burg im Wald.'],['Il re aveva una figlia: la principessa.','Der König hatte eine Tochter: die Prinzessin.'],['La principessa voleva un drago.','Die Prinzessin wollte einen Drachen.'],['Il principe non poteva dormire.','Der Prinz konnte nicht schlafen.'],['Un giorno è arrivato un vampiro.','Eines Tages kam ein Vampir.'],['Il vampiro voleva solo un amico.','Der Vampir wollte nur einen Freund.'],['La strega poteva volare di notte.','Die Hexe konnte nachts fliegen.']],
      reading:{ title:'La principessa e il drago',
        text:'C’era una volta una principessa. Viveva in un castello con il re. Tutti i principi volevano sposare la principessa, ma lei voleva solo una cosa: un drago. Un giorno è arrivato un drago enorme. Il re aveva paura, i principi sono scappati. E la principessa? È partita con il drago. Oggi viaggiano insieme per il mondo.',
        tr:'Es war einmal eine Prinzessin. Sie lebte mit dem König in einer Burg. Alle Prinzen wollten die Prinzessin heiraten, aber sie wollte nur eines: einen Drachen. Eines Tages kam ein riesiger Drache. Der König hatte Angst, die Prinzen rannten weg. Und die Prinzessin? Sie ist mit dem Drachen losgezogen. Heute reisen sie zusammen um die Welt.',
        qs:[['Was wollte die Prinzessin?',['Einen Drachen','Einen Prinzen','Eine Krone','Einen Hund']],['Was machten die Prinzen, als der Drache kam?',['Sie rannten weg','Sie kämpften','Sie heirateten die Prinzessin','Sie lachten']]] } },

    { title:'Il detective', de:'Der Detektiv', focus:'Kulisse & Handlung: der Detektiv',
      tip:'Was gerade lief, steht in der erzählenden Vergangenheit: il detective <b>cercava</b> (suchte gerade). Was dazwischenkam, in der abgeschlossenen: <b>ha scoperto</b> (hat entdeckt). Oft verbindet <b>mentre</b> (während) beides.',
      words:[['il detective','der Detektiv','leute'],['cercava','suchte (gerade)','verben'],['guardava','schaute (gerade)','verben'],['parlava','sprach (gerade)','verben'],['ha scoperto','hat entdeckt','verben'],['l’indizio / gli indizi','der Hinweis / die Hinweise'],['il colpevole','der Täter','leute'],['la lente','die Lupe'],['la verità','die Wahrheit']],
      sentences:[['Il detective cercava indizi nel castello.','Der Detektiv suchte Hinweise in der Burg.'],['Mentre guardava il quadro, ha scoperto una porta.','Während er das Bild ansah, entdeckte er eine Tür.'],['Mentre parlava con il guardiano, la luce si è spenta.','Während er mit dem Wärter sprach, ging das Licht aus.'],['Con la lente ha trovato qualcosa.','Mit der Lupe hat er etwas gefunden.'],['Chi è il colpevole? Il vampiro?','Wer ist der Täter? Der Vampir?'],['Il detective aveva paura? No!','Hatte der Detektiv Angst? Nein!'],['Tutti dicevano che il colpevole era un fantasma.','Alle sagten, der Täter sei ein Gespenst.'],['Alla fine ha scoperto la verità.','Am Ende hat er die Wahrheit entdeckt.']],
      reading:{ title:'Il caso della candela',
        text:'Era una notte di temporale. Il detective cercava indizi nel castello. Mentre guardava un quadro vecchio, la candela si è spenta. Mentre cercava la torcia, qualcuno ha riso nel buio. Il detective ha acceso la luce: davanti a lui c’era il guardiano. «Il colpevole è il vento!» ha detto il guardiano. Ma il detective ha scoperto un indizio: la finestra era chiusa.',
        tr:'Es war eine Gewitternacht. Der Detektiv suchte Hinweise in der Burg. Während er ein altes Bild ansah, ging die Kerze aus. Während er die Taschenlampe suchte, lachte jemand in der Dunkelheit. Der Detektiv machte das Licht an: Vor ihm stand der Wärter. „Der Täter ist der Wind!“, sagte der Wärter. Aber der Detektiv entdeckte einen Hinweis: Das Fenster war geschlossen.',
        qs:[['Was passierte, während der Detektiv das Bild ansah?',['Die Kerze ging aus','Das Bild fiel herunter','Der Wärter kam','Es begann zu regnen']],['Warum glaubt der Detektiv dem Wärter nicht?',['Das Fenster war geschlossen','Der Wärter lachte','Es gab keinen Wind','Die Kerze war neu']]] } },

    { title:'Il guardiano del cimitero', de:'Der Friedhofswärter', focus:'Vergangenheit – erzählend: Gewohnheiten',
      tip:'Für Gewohnheiten früher steht die erzählende Vergangenheit, oft mit <b>di solito</b> (normalerweise), <b>ogni notte</b> (jede Nacht), <b>a volte</b> (manchmal). Die Endungen für „ich“: lavora<b>vo</b>, cammina<b>vo</b>, vede<b>vo</b>, senti<b>vo</b>.',
      words:[['lavoravo','ich arbeitete','verben'],['camminavo','ich ging (immer)','verben'],['vedevo','ich sah','verben'],['sentivo','ich hörte','verben'],['di solito','normalerweise','zeit'],['a volte','manchmal','zeit'],['una notte','eines Nachts','zeit'],['la lanterna','die Laterne']],
      sentences:[['Lavoravo nel cimitero ogni notte.','Ich arbeitete jede Nacht auf dem Friedhof.'],['Di solito camminavo nel cimitero.','Normalerweise ging ich über den Friedhof.'],['A volte vedevo una luce rossa.','Manchmal sah ich ein rotes Licht.'],['Sentivo una voce accanto alla chiesa.','Ich hörte eine Stimme neben der Kirche.'],['Avevo sempre una lanterna.','Ich hatte immer eine Laterne dabei.'],['Una notte ho visto un fantasma.','Eines Nachts habe ich ein Gespenst gesehen.'],['Di solito non avevo paura.','Normalerweise hatte ich keine Angst.'],['A volte il cancello era aperto.','Manchmal war das Tor offen.']],
      reading:{ title:'Le notti del guardiano',
        text:'Da giovane lavoravo nel cimitero. Di solito camminavo con la mia lanterna nel buio. A volte sentivo una voce, a volte vedevo un’ombra. Non avevo paura: erano i miei amici. Una notte, però, ho visto un fantasma piccolo che piangeva. Era perso. L’ho aiutato.',
        tr:'Als junger Mann arbeitete ich auf dem Friedhof. Normalerweise ging ich mit meiner Laterne durch die Dunkelheit. Manchmal hörte ich eine Stimme, manchmal sah ich einen Schatten. Ich hatte keine Angst: Das waren meine Freunde. Eines Nachts sah ich aber ein kleines Gespenst, das weinte. Es hatte sich verirrt. Ich habe ihm geholfen.',
        qs:[['Was hatte der Wärter immer dabei?',['Eine Laterne','Einen Hund','Eine Kerze','Nichts']],['Warum weinte das kleine Gespenst?',['Es hatte sich verirrt','Es hatte Angst vor dem Wärter','Es hatte Hunger','Es war müde']]] } },

    { title:'La sfera di cristallo', de:'Die Kristallkugel', focus:'Zukunft: du wirst …',
      tip:'Zukunft für „du“ endet auf <b>-ai</b>: incontrer<b>ai</b> (du wirst treffen), vedr<b>ai</b> (du wirst sehen), avr<b>ai</b> (du wirst haben). Unregelmäßig: essere → <b>sarai</b> (du wirst sein). „Es wird regnen“: <b>pioverà</b>.',
      words:[['la sfera di cristallo','die Kristallkugel'],['il futuro','die Zukunft','zeit'],['incontrerai','du wirst treffen','verben'],['sarai','du wirst sein','verben'],['avrai','du wirst haben','verben'],['vedrai','du wirst sehen','verben'],['diventerai','du wirst werden','verben'],['pioverà','es wird regnen','verben']],
      sentences:[['Nella sfera di cristallo vedo il tuo futuro.','In der Kristallkugel sehe ich deine Zukunft.'],['Domani incontrerai un vampiro gentile.','Morgen wirst du einen netten Vampir treffen.'],['Sarai molto felice.','Du wirst sehr glücklich sein.'],['Avrai una casa stregata.','Du wirst ein Spukhaus haben.'],['Vedrai un fantasma a mezzanotte.','Du wirst um Mitternacht ein Gespenst sehen.'],['Diventerai una strega molto forte.','Du wirst eine sehr starke Hexe werden.'],['Il prossimo Halloween pioverà.','Nächstes Halloween wird es regnen.'],['Il tuo futuro? Sarà strano!','Deine Zukunft? Sie wird seltsam sein!']],
      reading:{ title:'La maga Zelda', dialog:true,
        text:'— Buonasera, maga Zelda. Vorrei sapere il mio futuro.\n— Ecco la sfera di cristallo… Domani incontrerai un uomo alto con un mantello nero.\n— Un vampiro?\n— Forse. Avrai paura, ma sarà gentile.\n— E poi?\n— Poi pioverà. Porta un ombrello!',
        tr:'– Guten Abend, Zauberin Zelda. Ich möchte meine Zukunft wissen. – Hier ist die Kristallkugel … Morgen wirst du einen großen Mann mit einem schwarzen Umhang treffen. – Einen Vampir? – Vielleicht. Du wirst Angst haben, aber er wird nett sein. – Und dann? – Dann wird es regnen. Nimm einen Regenschirm mit!',
        qs:[['Wen wird die Person morgen treffen?',['Einen großen Mann mit schwarzem Umhang','Eine Hexe','Einen Werwolf','Niemanden']],['Was soll die Person mitnehmen?',['Einen Regenschirm','Eine Taschenlampe','Die Kristallkugel','Bonbons']]] } },

    { title:'Organizziamo Halloween!', de:'Wir planen Halloween!', focus:'Zukunft: ich werde, wir werden',
      tip:'Zukunft für „ich“ endet auf <b>-ò</b> (inviter<b>ò</b>, preparer<b>ò</b>), für „wir“ auf <b>-emo</b> (decorer<b>emo</b>, compreremo). Bei -are-Verben wird das a zu e: decor<b>a</b>re → decor<b>e</b>remo.',
      words:[['organizzeremo','wir werden organisieren','verben'],['inviterò','ich werde einladen','verben'],['decoreremo','wir werden schmücken','verben'],['preparerò','ich werde zubereiten','verben'],['compreremo','wir werden kaufen','verben'],['metteremo','wir werden hinstellen','verben'],['la decorazione / le decorazioni','die Dekoration / die Dekorationen'],['la lista','die Liste'],['quest’anno','dieses Jahr','zeit']],
      sentences:[['Quest’anno organizzeremo una festa enorme.','Dieses Jahr werden wir eine riesige Party organisieren.'],['Inviterò tutta la famiglia.','Ich werde die ganze Familie einladen.'],['Decoreremo la casa con i ragni.','Wir werden das Haus mit Spinnen schmücken.'],['Preparerò una torta di zucca.','Ich werde einen Kürbiskuchen backen.'],['Compreremo cento candele.','Wir werden hundert Kerzen kaufen.'],['Metteremo le zucche davanti alla porta.','Wir werden die Kürbisse vor die Tür stellen.'],['Ecco la lista delle decorazioni.','Hier ist die Liste der Dekorationen.'],['Verranno tutti alla festa?','Werden alle zur Party kommen?']],
      reading:{ title:'Il grande piano',

      tip:'Zahlen von 1 bis 10: uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci. <b>c’è</b> heißt „es gibt / da ist“ bei einer Sache, <b>ci sono</b> bei mehreren. Übrigens: Die Römer schrieben Zahlen mit Buchstaben: I = 1, V = 5, X = 10.',
      words:[...NUMS,['il sesterzio / i sesterzi','der Sesterz / die Sesterzen (römische Münze)','zahlen roma'],['il mercato','der Markt'],['la bottega','der Laden, die Werkstatt'],['le olive','die Oliven']],
      sentences:[['Al mercato c’è una bottega.','Auf dem Markt gibt es einen Laden.'],['Nella bottega ci sono le olive.','Im Laden gibt es Oliven.'],['Il pane? Due sesterzi.','Das Brot? Zwei Sesterzen.'],['C’è un tempio nella strada.','In der Straße gibt es einen Tempel.'],['Le olive: quattro sesterzi.','Die Oliven: vier Sesterzen.'],['Ci sono dieci sesterzi.','Da sind zehn Sesterzen.']],
      reading:{ title:'Al mercato', dialog:true,
        text:'— Salve! C’è il pane?\n— Sì, ecco il pane. Due sesterzi.\n— E le olive?\n— Le olive: tre sesterzi.\n— Ecco cinque sesterzi. Grazie!\n— Prego! Arrivederci!',
        tr:'– Hallo! Gibt es Brot? – Ja, hier ist das Brot. Zwei Sesterzen. – Und die Oliven? – Die Oliven: drei Sesterzen. – Hier sind fünf Sesterzen. Danke! – Gern geschehen! Auf Wiedersehen!',
        qs:[['Wie viel kostet das Brot?',['Zwei Sesterzen','Drei Sesterzen','Fünf Sesterzen','Zehn Sesterzen']],['Wie viel zahlt die Person insgesamt?',['Fünf Sesterzen','Drei Sesterzen','Zwei Sesterzen','Acht Sesterzen']]] } },
    n4:{ title:'Dov’è il Colosseo?', de:'Wo ist das Kolosseum?',
      tip:'Fragewörter: <b>chi</b> (wer), <b>che cosa</b> (was), <b>dove</b> (wo), <b>quando</b> (wann), <b>perché</b> (warum). Vor „è“ wird gekürzt: dove + è = <b>dov’è</b>, che cosa + è = <b>che cos’è</b>. Das <b>Forum</b> war der große Platz in der Mitte Roms, im <b>Circus</b> gab es Wagenrennen.',
      words:[['chi','wer','fragen'],['Che cos’è?','Was ist das?','fragen'],['dove / dov’è','wo / wo ist','fragen'],['quando','wann','fragen'],['perché','warum, weil','fragen'],['il Colosseo','das Kolosseum'],['le terme','die Thermen (das Badehaus)'],['il Foro','das Forum (der große Platz)'],['il circo','die Rennbahn (für Wagenrennen)']],
      sentences:[['Dov’è il Colosseo?','Wo ist das Kolosseum?'],['Chi è? È un soldato.','Wer ist das? Das ist ein Soldat.'],['Che cos’è? È il Foro.','Was ist das? Das ist das Forum.'],['Dove sono le terme?','Wo sind die Thermen?'],['Perché c’è un soldato nel tempio?','Warum ist ein Soldat im Tempel?'],['Quando c’è il mercato?','Wann ist Markt?']],
      reading:{ title:'Dov’è?', dialog:true,
        text:'— Salve! Che cos’è?\n— È il circo!\n— E dov’è il Colosseo?\n— Il Colosseo è là.\n— E le terme?\n— Le terme sono dietro il tempio.\n— Grazie!\n— Prego!',
        tr:'– Hallo! Was ist das? – Das ist die Rennbahn! – Und wo ist das Kolosseum? – Das Kolosseum ist dort. – Und die Thermen? – Die Thermen sind hinter dem Tempel. – Danke! – Gern geschehen!',
        qs:[['Was sieht die Person zuerst?',['Die Rennbahn (Circus)','Das Kolosseum','Die Thermen','Einen Tempel']],['Wo sind die Thermen?',['Hinter dem Tempel','Neben dem Kolosseum','Am Markt','Auf dem Forum']]] } }

  more:{

    lessons:{ 1:[
      { title:'La famiglia di Livia', de:'Livias Familie', focus:'Wörter: Familie',
        tip:'Vor <b>mio</b> / <b>mia</b> (mein / meine) fällt bei Familienmitgliedern in der Einzahl der Artikel weg: <b>mio</b> padre, <b>mia</b> madre. Mit „die Familie“ bleibt er: <b>la</b> mia famiglia.',
        words:[['la famiglia','die Familie','leute roma'],['il padre','der Vater','leute roma'],['la madre','die Mutter','leute roma'],['il fratello','der Bruder','leute roma'],['la sorella','die Schwester','leute roma'],['il nonno','der Opa','leute roma'],['la nonna','die Oma','leute roma'],['il cane','der Hund']],
        sentences:[['Ecco la mia famiglia!','Hier ist meine Familie!'],['Mio padre è un soldato.','Mein Vater ist Soldat.'],['Mia madre è romana.','Meine Mutter ist Römerin.'],['Tito è mio fratello.','Tito ist mein Bruder.'],['Chi è? È la nonna.','Wer ist das? Das ist Oma.'],['Il nonno è nel tempio.','Opa ist im Tempel.'],['Dov’è il cane? Nella strada!','Wo ist der Hund? Auf der Straße!'],['Livia è mia sorella.','Livia ist meine Schwester.']],
        reading:{ title:'La famiglia di Livia',
          text:'Salve! Mi chiamo Livia e sono romana. Ecco la mia famiglia. Mio padre Quinto è un soldato. Mia madre si chiama Cornelia. Tito è mio fratello. La nonna Aurelia è nel tempio. E il cane? Il cane Argo è nella strada.',
          tr:'Hallo! Ich heiße Livia und bin Römerin. Hier ist meine Familie. Mein Vater Quinto ist Soldat. Meine Mutter heißt Cornelia. Tito ist mein Bruder. Oma Aurelia ist im Tempel. Und der Hund? Der Hund Argo ist auf der Straße.',
          qs:[['Was ist Livias Vater?',['Soldat','Bäcker','Lehrer','Händler']],['Wo ist Oma Aurelia?',['Im Tempel','Auf der Straße','Auf dem Markt','Zu Hause']]] } },
      { title:'Ave, Quinto!', de:'Sei gegrüßt, Quinto!', focus:'Vertiefung: Begrüßen & Kennenlernen',
        tip:'Die alten Römer grüßten mit <b>Ave!</b> und verabschiedeten sich mit <b>Vale!</b>. Das ist Latein. Heute sagt man in Italien <b>Ciao!</b> unter Freunden (Hallo und Tschüss) und <b>Salve!</b>, wenn es etwas höflicher sein soll. <b>Come stai?</b> heißt „Wie geht es dir?“.',
        words:[['Ciao!','Hallo! (auch: Tschüss!)','gruss'],['Come stai?','Wie geht es dir?','gruss'],['Bene, grazie!','Gut, danke!','gruss'],['E tu?','Und du?','gruss'],['sì / no','ja / nein','gruss'],['Scusa!','Entschuldigung!','gruss'],['A domani!','Bis morgen!','gruss'],['Aiuto!','Hilfe!'],['Ave!','Sei gegrüßt! (Latein, Gruß der alten Römer)','gruss roma']],
        sentences:[['Ciao, Tito! Come stai?','Hallo, Tito! Wie geht es dir?'],['Bene, grazie! E tu?','Gut, danke! Und du?'],['Ave! Sono un soldato romano.','Sei gegrüßt! Ich bin ein römischer Soldat.'],['Scusa, dov’è il Foro?','Entschuldigung, wo ist das Forum?'],['Aiuto! C’è un cane!','Hilfe! Da ist ein Hund!'],['Sei romana? Sì!','Bist du Römerin? Ja!'],['Ciao, nonna! A domani!','Tschüss, Oma! Bis morgen!'],['Il cane? No, è il fratello di Livia!','Der Hund? Nein, das ist Livias Bruder!']],
        reading:{ title:'Alle terme', dialog:true,
          text:'— Ave, Quinto!\n— Ciao, Marco! Come stai?\n— Bene, grazie! E tu?\n— Bene! Ecco mio figlio, Tito.\n— Piacere, Tito!\n— Piacere! Scusa, papà… dov’è il cane?\n— Aiuto! Il cane è nelle terme!',
          tr:'– Sei gegrüßt, Quinto! – Hallo, Marco! Wie geht es dir? – Gut, danke! Und dir? – Gut! Hier ist mein Sohn, Tito. – Freut mich, Tito! – Freut mich! Entschuldigung, Papa … wo ist der Hund? – Hilfe! Der Hund ist in den Thermen!',
          qs:[['Wen stellt Quinto vor?',['Seinen Sohn Tito','Seine Tochter Livia','Seinen Hund','Seinen Vater']],['Wo ist der Hund?',['In den Thermen','Auf dem Forum','Im Tempel','Zu Hause']]] } },
      { title:'Venti sesterzi', de:'Zwanzig Sesterzen', focus:'Vertiefung: Zahlen bis 20',
        tip:'Zahlen von 11 bis 20: undici, dodici, tredici, quattordici, quindici, sedici, diciassette, diciotto, diciannove, venti. Die Römer schrieben XI, XII … XX. <b>Quanto costa?</b> fragt nach dem Preis. <b>Quanti</b> (bei männlichen Wörtern) und <b>quante</b> (bei weiblichen) fragen nach der Anzahl.',
        words:[['undici, dodici, tredici','elf, zwölf, dreizehn','zahlen'],['quattordici, quindici, sedici','vierzehn, fünfzehn, sechzehn','zahlen'],['diciassette, diciotto','siebzehn, achtzehn','zahlen'],['diciannove, venti','neunzehn, zwanzig','zahlen'],['Quanto costa?','Wie viel kostet das?','fragen'],['quanti / quante','wie viele','fragen zahlen'],['caro / cara','teuer','wie roma'],['il mercante','der Händler','leute roma']],
        sentences:[['Quanto costa la toga? Venti sesterzi!','Wie viel kostet die Toga? Zwanzig Sesterzen!'],['Venti sesterzi? È cara!','Zwanzig Sesterzen? Sie ist teuer!'],['Quante olive ci sono? Diciotto.','Wie viele Oliven gibt es? Achtzehn.'],['Il mercante è nella bottega.','Der Händler ist im Laden.'],['Quanti sesterzi? Tredici.','Wie viele Sesterzen? Dreizehn.'],['La tunica costa dodici sesterzi.','Die Tunika kostet zwölf Sesterzen.'],['Il pane non è caro.','Das Brot ist nicht teuer.'],['Quindici sesterzi? No, grazie!','Fünfzehn Sesterzen? Nein, danke!']],
        reading:{ title:'Il mercante', dialog:true,
          text:'— Salve! Quanto costa la tunica?\n— La tunica? Diciannove sesterzi.\n— Diciannove? È cara!\n— E la toga costa venti sesterzi.\n— No, grazie. Quanto costa il pane?\n— Il pane? Due sesterzi.\n— Ecco due sesterzi. Grazie!',
          tr:'– Hallo! Wie viel kostet die Tunika? – Die Tunika? Neunzehn Sesterzen. – Neunzehn? Die ist teuer! – Und die Toga kostet zwanzig Sesterzen. – Nein, danke. Wie viel kostet das Brot? – Das Brot? Zwei Sesterzen. – Hier sind zwei Sesterzen. Danke!',
          qs:[['Wie viel kostet die Tunika?',['Neunzehn Sesterzen','Zwanzig Sesterzen','Zwölf Sesterzen','Neun Sesterzen']],['Was kauft die Person am Ende?',['Brot','Die Toga','Die Tunika','Nichts']]] } },
      { title:'Dove sei, Tito?', de:'Wo bist du, Tito?', focus:'Vertiefung: Fragen & Orte',
        tip:'Auf „wo?“ antwortest du mit <b>qui</b> (hier) oder <b>là</b> (dort). <b>Quale</b> heißt „welcher, welche, welches“. <b>Non lo so</b> heißt „Ich weiß es nicht“. Eine Ja-Nein-Frage erkennt man oft nur an der Stimme: <b>Sei qui?</b> (Bist du hier?)',
        words:[['qui','hier','orte'],['là','dort','orte'],['quale','welcher, welche, welches','fragen'],['la città','die Stadt','orte roma'],['la piazza','der Platz','orte roma'],['il ponte','die Brücke','orte roma'],['il fiume','der Fluss','orte roma'],['la fontana','der Brunnen'],['Non lo so.','Ich weiß es nicht.']],
        sentences:[['Tito, dove sei?','Tito, wo bist du?'],['Sono qui, alla fontana!','Ich bin hier, am Brunnen!'],['Il Foro è là.','Das Forum ist dort.'],['Quale ponte? Il ponte sul fiume.','Welche Brücke? Die Brücke über den Fluss.'],['Dov’è la piazza? Non lo so.','Wo ist der Platz? Ich weiß es nicht.'],['Roma è una città.','Rom ist eine Stadt.'],['Il cane è qui, nella fontana!','Der Hund ist hier, im Brunnen!'],['Quale strada? Questa strada.','Welche Straße? Diese Straße.']],
        reading:{ title:'Dov’è Tito?',
          text:'Livia è in piazza con il cane. Dov’è Tito? Non è alla fontana. Non è sul ponte. Livia: «Tito, dove sei?» Tito: «Sono qui, nel fiume!» Il cane salta nel fiume. Che famiglia!',
          tr:'Livia ist mit dem Hund auf dem Platz. Wo ist Tito? Er ist nicht am Brunnen. Er ist nicht auf der Brücke. Livia: „Tito, wo bist du?“ Tito: „Ich bin hier, im Fluss!“ Der Hund springt in den Fluss. Was für eine Familie!',
          qs:[['Wo ist Tito?',['Im Fluss','Am Brunnen','Auf der Brücke','Auf dem Platz']],['Was macht der Hund?',['Er springt in den Fluss','Er schläft','Er läuft nach Hause','Er bellt']]] } },
      { title:'Toga o tunica?', de:'Toga oder Tunika?', focus:'Wörter: Kleidung',
        tip:'Die <b>toga</b> war ein großes weißes Tuch, das nur freie römische Männer tragen durften, vor allem zu feierlichen Anlässen. Im Alltag trug man die <b>tunica</b>. Frauen trugen darüber die <b>stola</b>, ein langes Kleid. Mehrzahl: il sandalo → <b>i sandali</b>.',
        words:[['la stola','die Stola (langes Frauenkleid)'],['i sandali','die Sandalen'],['il mantello','der Umhang'],['l’anello','der Ring'],['la collana','die Halskette'],['la cintura','der Gürtel'],['il vestito','das Kleid, die Kleidung'],['bianco / bianca','weiß','wie roma']],
        sentences:[['La toga è bianca.','Die Toga ist weiß.'],['Ecco la stola di mia madre.','Hier ist die Stola meiner Mutter.'],['Dove sono i sandali?','Wo sind die Sandalen?'],['Quanto costa l’anello?','Wie viel kostet der Ring?'],['La collana della nonna è cara.','Omas Halskette ist teuer.'],['Il mantello del soldato è qui.','Der Umhang des Soldaten ist hier.'],['Quale cintura? La cintura bianca.','Welcher Gürtel? Der weiße Gürtel.'],['Il vestito di Livia è nella casa.','Livias Kleid ist im Haus.']],
        reading:{ title:'Il giorno della festa',
          text:'Oggi c’è una festa. Livia ha una stola bianca e i sandali. La nonna ha una collana. Tito ha una tunica e una cintura. E il padre? Il padre ha la toga bianca. E il cane? Il cane ha… un anello!',
          tr:'Heute ist ein Fest. Livia hat eine weiße Stola und die Sandalen an. Oma trägt eine Halskette. Tito hat eine Tunika und einen Gürtel. Und der Vater? Der Vater trägt die weiße Toga. Und der Hund? Der Hund hat … einen Ring!',
          qs:[['Was trägt der Vater?',['Die weiße Toga','Eine Tunika','Einen Umhang','Eine Stola']],['Was hat der Hund?',['Einen Ring','Eine Halskette','Sandalen','Einen Gürtel']]] } },
      { title:'La casa romana', de:'Das römische Haus', focus:'Wörter: Haus & Zimmer',
        tip:'Reiche Römer wohnten in einer <b>domus</b>, einem Haus mit Innenhof (<b>l’atrio</b>) und Garten. Die meisten wohnten aber in einer <b>insula</b>, einem Mietshaus mit vielen Stockwerken. <b>In</b> + Zimmer geht oft ohne Artikel: <b>in</b> cucina (in der Küche), <b>in</b> giardino (im Garten).',
        words:[['l’atrio','der Innenhof (das Atrium)'],['la cucina','die Küche'],['la camera da letto','das Schlafzimmer'],['il giardino','der Garten'],['il tetto','das Dach'],['la porta','die Tür'],['la finestra','das Fenster'],['il bagno','das Bad, die Toilette']],
        sentences:[['La cucina è qui.','Die Küche ist hier.'],['Nell’atrio c’è una fontana.','Im Innenhof ist ein Brunnen.'],['Dov’è il bagno? Là!','Wo ist die Toilette? Dort!'],['Il cane è in cucina.','Der Hund ist in der Küche.'],['Tito è sul tetto! Aiuto!','Tito ist auf dem Dach! Hilfe!'],['La porta della camera da letto è qui.','Die Tür des Schlafzimmers ist hier.'],['Quale finestra? Questa finestra.','Welches Fenster? Dieses Fenster.'],['Nel giardino ci sono le olive.','Im Garten gibt es Oliven.']],
        reading:{ title:'La domus di Livia',
          text:'Ecco la casa di Livia. Nell’atrio c’è una fontana. La cucina è piccola. In giardino ci sono le olive. La camera da letto di Livia ha una finestra. E il bagno? Il bagno romano è… in strada!',
          tr:'Hier ist Livias Haus. Im Innenhof ist ein Brunnen. Die Küche ist klein. Im Garten gibt es Oliven. Livias Schlafzimmer hat ein Fenster. Und die Toilette? Die römische Toilette ist … auf der Straße! (Viele Römer gingen in öffentliche Toiletten.)',
          qs:[['Was ist im Innenhof?',['Ein Brunnen','Ein Olivenbaum','Ein Hund','Ein Tempel']],['Wo ist die Toilette?',['Auf der Straße','In der Küche','Im Garten','Im Schlafzimmer']]] } },
      { title:'La cena', de:'Das Abendessen', focus:'Wörter: Essen & Trinken',
        tip:'Zum Frühstück aßen Römer oft nur Brot mit Käse, Oliven oder Honig. Das große Essen war am späten Nachmittag: <b>la cena</b>. Mit <b>vorrei</b> (ich hätte gern) kaufst du höflich ein.',
        words:[['vorrei','ich hätte gern','verben'],['il formaggio','der Käse'],['il vino','der Wein'],['l’acqua','das Wasser'],['il miele','der Honig'],['i fichi','die Feigen'],['l’uva','die Weintrauben'],['il pesce','der Fisch'],['la cena','das Abendessen']],
        sentences:[['Vorrei il pane e il formaggio.','Ich hätte gern das Brot und den Käse.'],['Quanto costa il miele?','Wie viel kostet der Honig?'],['Il vino è caro.','Der Wein ist teuer.'],['Vorrei l’uva, per favore.','Ich hätte gern die Weintrauben, bitte.'],['Il pesce? Sei sesterzi.','Der Fisch? Sechs Sesterzen.'],['C’è l’acqua nella fontana.','Im Brunnen ist Wasser.'],['La cena è in giardino.','Das Abendessen ist im Garten.'],['Il mercante: «Ecco i fichi!»','Der Händler: „Hier sind die Feigen!“']],
        reading:{ title:'A cena',
          text:'Oggi la cena è in giardino. Ci sono il pane, il formaggio e le olive. C’è anche il pesce del mercato. Per Tito ci sono i fichi con il miele. Il padre beve il vino, Livia beve l’acqua. E il cane? Il cane mangia il pesce!',
          tr:'Heute ist das Abendessen im Garten. Es gibt Brot, Käse und Oliven. Es gibt auch den Fisch vom Markt. Für Tito gibt es Feigen mit Honig. Der Vater trinkt Wein, Livia trinkt Wasser. Und der Hund? Der Hund frisst den Fisch!',
          qs:[['Was trinkt Livia?',['Wasser','Wein','Milch','Nichts']],['Wer frisst den Fisch?',['Der Hund','Tito','Der Vater','Die Katze']]] } },
      { title:'Gli animali', de:'Die Tiere', focus:'Wörter: Tiere',
        tip:'Nach der Sage wurden Romulus und Remus, die Gründer Roms, von einer Wölfin gesäugt: <b>la lupa</b>. Und Gänse (<b>le oche</b>) sollen Rom einmal gerettet haben, weil sie laut schnatterten, als nachts Feinde kamen. Mehrzahl: l’oca → <b>le oche</b>.',
        words:[['il gatto','die Katze, der Kater'],['il cavallo','das Pferd'],['l’asino','der Esel'],['la gallina','das Huhn'],['il maiale','das Schwein'],['l’oca / le oche','die Gans / die Gänse'],['la lupa','die Wölfin'],['il topo','die Maus']],
        sentences:[['Il gatto è sul tetto.','Die Katze ist auf dem Dach.'],['C’è un asino nella strada!','Auf der Straße ist ein Esel!'],['Quante oche ci sono? Undici.','Wie viele Gänse gibt es? Elf.'],['Il maiale è in cucina! Aiuto!','Das Schwein ist in der Küche! Hilfe!'],['La gallina è nel giardino.','Das Huhn ist im Garten.'],['Il cavallo del soldato è bianco.','Das Pferd des Soldaten ist weiß.'],['Chi è? È la lupa di Roma!','Wer ist das? Das ist die Wölfin von Rom!'],['Il topo è nella camera da letto.','Die Maus ist im Schlafzimmer.']],
        reading:{ title:'Un’oca per Tito',
          text:'Nella strada di Livia c’è un mercato. C’è una gallina, c’è un maiale e c’è un asino. Un mercante ha dodici oche. Tito: «Quanto costa un’oca?» Il mercante: «Tre sesterzi.» Livia: «Tito, no! C’è il cane!» E il cane? Il cane corre dietro le oche!',
          tr:'In Livias Straße ist ein Markt. Da ist ein Huhn, da ist ein Schwein und da ist ein Esel. Ein Händler hat zwölf Gänse. Tito: „Wie viel kostet eine Gans?“ Der Händler: „Drei Sesterzen.“ Livia: „Tito, nein! Der Hund ist da!“ Und der Hund? Der Hund rennt hinter den Gänsen her!',
          qs:[['Wie viele Gänse hat der Händler?',['Zwölf','Drei','Elf','Zwei']],['Was kostet eine Gans?',['Drei Sesterzen','Zwölf Sesterzen','Zehn Sesterzen','Nichts']]] } },
      { title:'La meridiana', de:'Die Sonnenuhr', focus:'Die Uhrzeit',
        tip:'Die Römer hatten keine Uhren wie wir, sondern Sonnenuhren (<b>la meridiana</b>). Nach der Uhrzeit fragst du mit <b>Che ore sono?</b> Die Antwort: <b>sono le</b> + Zahl (sono le tre). Nur bei eins, Mittag und Mitternacht heißt es <b>è</b>: è l’una, è mezzogiorno, è mezzanotte.',
        words:[['Che ore sono?','Wie spät ist es?','fragen zeit'],['È l’una.','Es ist ein Uhr.','zeit'],['Sono le due.','Es ist zwei Uhr.','zeit'],['e mezza','… Uhr dreißig (halb)','zeit'],['mezzogiorno','Mittag (12 Uhr)','zeit'],['È mezzanotte.','Es ist Mitternacht.','zeit'],['la meridiana','die Sonnenuhr'],['la mattina','der Morgen, am Morgen','zeit'],['il sole','die Sonne']],
        sentences:[['Che ore sono? Sono le dieci.','Wie spät ist es? Es ist zehn Uhr.'],['È mezzogiorno. Dov’è il sole?','Es ist Mittag. Wo ist die Sonne?'],['La meridiana è in piazza.','Die Sonnenuhr ist auf dem Platz.'],['Sono le otto e mezza.','Es ist halb neun.'],['Che ore sono? Non c’è il sole!','Wie spät ist es? Es gibt keine Sonne!'],['La mattina Tito è al mercato.','Am Morgen ist Tito auf dem Markt.'],['È l’una: dov’è la cena?','Es ist ein Uhr: Wo ist das Essen?'],['È mezzanotte: il cane è sul tetto!','Es ist Mitternacht: Der Hund ist auf dem Dach!']],
        reading:{ title:'Che ore sono?',
          text:'In piazza c’è una meridiana. La mattina Livia guarda la meridiana: sono le sette. Sono le nove e mezza: Tito è a scuola. È mezzogiorno: c’è il sole. Ma oggi piove! Tito: «Che ore sono?» Livia: «Non lo so. Non c’è il sole!»',
          tr:'Auf dem Platz ist eine Sonnenuhr. Am Morgen schaut Livia auf die Sonnenuhr: Es ist sieben Uhr. Es ist halb zehn: Tito ist in der Schule. Es ist Mittag: Die Sonne scheint. Aber heute regnet es! Tito: „Wie spät ist es?“ Livia: „Ich weiß es nicht. Es gibt keine Sonne!“',
          qs:[['Warum weiß Livia die Uhrzeit nicht?',['Es regnet, die Sonne scheint nicht','Die Sonnenuhr ist kaputt','Sie kann die Zahlen nicht lesen','Es ist Nacht']],['Wo ist Tito um halb zehn?',['In der Schule','Auf dem Markt','Zu Hause','In den Thermen']]] } },
      { title:'I giorni degli dei', de:'Die Tage der Götter', focus:'Wochentage',
        tip:'Die Namen der Wochentage kommen von römischen Göttern und Himmelskörpern: <b>lunedì</b> von der Luna (Mond), <b>martedì</b> von Mars, <b>mercoledì</b> von Merkur, <b>giovedì</b> von Jupiter (italienisch Giove), <b>venerdì</b> von Venus. Man schreibt sie klein.',
        words:[['lunedì, martedì, mercoledì','Montag, Dienstag, Mittwoch','zeit'],['giovedì, venerdì','Donnerstag, Freitag','zeit'],['sabato, domenica','Samstag, Sonntag','zeit'],['oggi','heute','zeit'],['domani','morgen','zeit'],['il giorno / i giorni','der Tag / die Tage','zeit'],['la settimana','die Woche','zeit'],['il dio / gli dei','der Gott / die Götter']],

  { title:'Al Circo Massimo', de:'Im Circus Maximus',

    reading:{ title:'Verdi o azzurri?',

      tr:'Heute ist das Rennen im Circus. Der Vater und Tito schauen den Wagen zu. Tito ist ein Fan der Grünen. Der Vater ist ein Fan der Blauen. Die Wagen rasen los. Wer gewinnt? Es gewinnen … die Roten! Der Vater und Tito sind nicht glücklich.',
      qs:[['Für wen ist Tito?',['Für die Grünen','Für die Blauen','Für die Roten','Für die Weißen']],['Wer gewinnt?',['Die Roten','Die Grünen','Die Blauen','Niemand']]] } }

      text:'Stasera il senatore fa un banchetto. Gli ospiti mangiano sul triclinio. Il cuoco prepara il pollo, le uova e il pesce con il garum. Poi c’è la frutta con il miele. Il padre di Livia è un ospite. Ma il garum… non gli piace!',
      tr:'Heute Abend gibt der Senator ein Festessen. Die Gäste essen auf der Speiseliege. Der Koch macht Hähnchen, Eier und Fisch mit Garum. Danach gibt es Obst mit Honig. Livias Vater ist ein Gast. Aber das Garum … mag er nicht!',
      qs:[['Wo essen die Gäste?',['Auf der Speiseliege','Am Tisch auf Stühlen','Im Garten auf dem Boden','In der Küche']],['Was mag Livias Vater nicht?',['Das Garum','Den Honig','Das Obst','Das Hähnchen']]] } },
  { title:'Come ti senti?', de:'Wie fühlst du dich?', focus:'Adjektive: Gefühle',
    tip:'Gefühle mit <b>sono</b>: sono triste, sono stanco. Hunger, Durst und Angst „hat“ man: <b>ho fame</b>, <b>ho sete</b>, <b>ho paura</b>. Eine Frau sagt: sono stanc<b>a</b>, arrabbiat<b>a</b>.',
    words:[['Come ti senti?','Wie fühlst du dich?','fragen'],['felice','glücklich','wie roma'],['triste','traurig','wie roma'],['arrabbiato / arrabbiata','wütend','wie roma'],['stanco / stanca','müde','wie roma'],['ho fame','ich habe Hunger'],['ho sete','ich habe Durst'],['la paura','die Angst']],
    sentences:[['Come ti senti? Sono stanca.','Wie fühlst du dich? Ich bin müde.'],['Tito è felice: vince il carro verde!','Tito ist glücklich: Der grüne Wagen gewinnt!'],['Il gladiatore ha paura del leone.','Der Gladiator hat Angst vor dem Löwen.'],['Ho fame! C’è il pane?','Ich habe Hunger! Gibt es Brot?'],['Il cane ha sete.','Der Hund hat Durst.'],['La madre è arrabbiata: Tito è sul tetto!','Die Mutter ist wütend: Tito ist auf dem Dach!'],['Livia è triste: il gatto non c’è.','Livia ist traurig: Die Katze ist nicht da.'],['Sono stanco, vado a casa.','Ich bin müde, ich gehe nach Hause.']],
    reading:{ title:'Un giorno difficile',
      text:'Oggi è un giorno difficile per Tito. La mattina a scuola è stanco. Il maestro è arrabbiato. A mezzogiorno Tito ha fame, ma il pane non c’è. Poi è triste: il suo cane è con Livia. Ma la sera la nonna ha i fichi con il miele. Adesso Tito è felice!',
      tr:'Heute ist ein schwieriger Tag für Tito. Am Morgen in der Schule ist er müde. Der Lehrer ist wütend. Mittags hat Tito Hunger, aber es gibt kein Brot. Dann ist er traurig: Sein Hund ist bei Livia. Aber am Abend hat Oma Feigen mit Honig. Jetzt ist Tito glücklich!',
      qs:[['Wie ist der Lehrer?',['Wütend','Müde','Glücklich','Traurig']],['Was macht Tito am Ende glücklich?',['Omas Feigen mit Honig','Sein Hund','Das Brot','Der Lehrer']]] } },
  { title:'Il ladro del mercato', de:'Der Dieb vom Markt', focus:'Adjektive: Aussehen',
    tip:'Adjektive auf -o haben vier Formen: alt<b>o</b> (er), alt<b>a</b> (sie), alt<b>i</b> (mehrere, männlich), alt<b>e</b> (mehrere, weiblich). Darum heißt es i capelli lungh<b>i</b> (die langen Haare). Viele Römer rasierten sich. Erst Kaiser Hadrian machte den Bart wieder modern.',
    words:[['alto / alta','groß (gewachsen)','wie roma'],['basso / bassa','klein (gewachsen)','wie roma'],['grasso / grassa','dick','wie roma'],['magro / magra','dünn','wie roma'],['biondo / bionda','blond','wie roma'],['lungo / lunga / lunghi','lang','wie roma'],['corto / corta / corti','kurz','wie roma'],['la barba','der Bart']],
    sentences:[['Il gladiatore è alto e forte.','Der Gladiator ist groß und stark.'],['Il senatore è basso e grasso.','Der Senator ist klein und dick.'],['Il cane è magro.','Der Hund ist dünn.'],['Livia ha i capelli lunghi.','Livia hat lange Haare.'],['Il padre ha la barba corta.','Der Vater hat einen kurzen Bart.'],['Tito è piccolo e biondo.','Tito ist klein und blond.'],['La nonna è alta e magra.','Oma ist groß und dünn.'],['L’imperatore ha la barba lunga.','Der Kaiser hat einen langen Bart.']],
    reading:{ title:'Com’è il ladro?',
      text:'Al mercato c’è un ladro! Il mercante: «Il ladro è alto e magro. Ha la barba lunga e i capelli corti.» Tito guarda: c’è un uomo alto e magro con la barba lunga… È il maestro Lucio! Ma il maestro non è un ladro: compra le olive.',
      tr:'Auf dem Markt ist ein Dieb! Der Händler: „Der Dieb ist groß und dünn. Er hat einen langen Bart und kurze Haare.“ Tito schaut sich um: Da ist ein großer, dünner Mann mit langem Bart … Es ist Lehrer Lucio! Aber der Lehrer ist kein Dieb: Er kauft Oliven.',
      qs:[['Wie sieht der Dieb aus?',['Groß und dünn, langer Bart, kurze Haare','Klein und dick, blond','Groß und dick, ohne Bart','Klein und dünn, lange Haare']],['Was macht Lehrer Lucio auf dem Markt?',['Er kauft Oliven','Er stiehlt','Er unterrichtet','Er sucht den Dieb']]] } },
  { title:'Al teatro', de:'Im Theater', focus:'Wörter: Theater',
    tip:'Im römischen Theater spielten nur Männer, auch die Frauenrollen. Sie trugen Masken: eine lachende für die Komödie, eine traurige für die Tragödie. Wörter auf -e haben in der Mehrzahl -i: l’attor<b>e</b> → gli attor<b>i</b>.',
    words:[['l’attore / gli attori','der Schauspieler / die Schauspieler','leute roma'],['la maschera del teatro','die Theatermaske'],['la commedia','die Komödie'],['ride / ridono','er lacht / sie lachen','verben'],['piange','er, sie weint','verben'],['il palco','die Bühne'],['divertente','lustig','wie roma'],['la storia','die Geschichte']],
    sentences:[['Gli attori sono sul palco.','Die Schauspieler sind auf der Bühne.'],['La commedia è divertente.','Die Komödie ist lustig.'],['Il pubblico ride.','Das Publikum lacht.'],['L’attore prende la maschera del teatro.','Der Schauspieler nimmt die Theatermaske.'],['La nonna piange: la storia è triste.','Oma weint: Die Geschichte ist traurig.'],['Tito e Gaio ridono.','Tito und Gaio lachen.'],['Dov’è il palco? Là, davanti al pubblico.','Wo ist die Bühne? Dort, vor dem Publikum.'],['Mi piace la commedia, non mi piace la storia triste.','Ich mag die Komödie, die traurige Geschichte mag ich nicht.']],
    reading:{ title:'La commedia',
      text:'Oggi la famiglia va al teatro. C’è una commedia. Sul palco ci sono tre attori con le maschere. Un attore è un vecchio, un attore è un servo, un attore è una ragazza. Ma è un uomo! Il pubblico ride. La commedia è divertente. Solo il cane dorme.',
      tr:'Heute geht die Familie ins Theater. Es gibt eine Komödie. Auf der Bühne sind drei Schauspieler mit Masken. Ein Schauspieler ist ein alter Mann, einer ist ein Diener, einer ist ein Mädchen. Aber es ist ein Mann! Das Publikum lacht. Die Komödie ist lustig. Nur der Hund schläft.',
      qs:[['Wie viele Schauspieler sind auf der Bühne?',['Drei','Zwei','Vier','Einer']],['Wer spielt das Mädchen?',['Ein Mann','Eine Frau','Livia','Ein Kind']]] } },
  { title:'Le terme', de:'Die Thermen', focus:'Wörter: Baden & Sport',
    tip:'Die Römer hatten keine Seife. Sie rieben sich mit Öl ein und schabten es mit einem gebogenen Metallstück wieder ab, zusammen mit dem Schmutz. In den Thermen gab es ein warmes, ein lauwarmes und ein kaltes Becken und einen Sportplatz.',
    words:[['la piscina','das Becken, das Schwimmbad'],['nuoto / nuota','ich schwimme / er, sie schwimmt','verben'],['l’olio','das Öl'],['la palestra','der Sportplatz'],['l’asciugamano','das Handtuch'],['tiepido / tiepida','lauwarm','wie roma'],['il massaggio','die Massage'],['pulito / pulita','sauber','wie roma']],
    sentences:[['Alle terme c’è una piscina grande.','In den Thermen gibt es ein großes Becken.'],['Tito nuota nella piscina.','Tito schwimmt im Becken.'],['L’acqua è tiepida.','Das Wasser ist lauwarm.'],['Dov’è l’olio?','Wo ist das Öl?'],['Nella palestra Gaio gioca.','Auf dem Sportplatz spielt Gaio.'],['Ecco l’asciugamano!','Hier ist das Handtuch!'],['Il massaggio? Tre sesterzi.','Die Massage? Drei Sesterzen.'],['Adesso sono pulito!','Jetzt bin ich sauber!']],
    reading:{ title:'Un giorno alle terme',
      text:'Alle terme Quinto va prima in palestra. Poi prende l’olio. Poi c’è l’acqua calda, poi l’acqua tiepida, poi l’acqua fredda. Brrr! Dopo il massaggio Quinto è pulito e felice. Ma dov’è la sua toga? Non c’è! Qualcuno ha preso la toga!',
      tr:'In den Thermen geht Quinto zuerst auf den Sportplatz. Dann nimmt er das Öl. Dann kommt das warme Wasser, dann das lauwarme Wasser, dann das kalte Wasser. Brrr! Nach der Massage ist Quinto sauber und glücklich. Aber wo ist seine Toga? Sie ist nicht da! Jemand hat die Toga genommen!',
      qs:[['Wohin geht Quinto zuerst?',['Auf den Sportplatz','Ins warme Wasser','Zur Massage','Nach Hause']],['Was fehlt am Ende?',['Seine Toga','Sein Handtuch','Das Öl','Sein Geld']]] } },
  { title:'Al porto di Ostia', de:'Im Hafen von Ostia', focus:'Wörter: Hafen & Handel',
    tip:'Ostia war der Hafen Roms, am Meer an der Mündung des Tiber. Schiffe brachten Getreide aus Ägypten, Öl aus Spanien und Wein aus Gallien. Getreide war so wichtig, dass der Staat es an arme Römer verteilte.',
    words:[['il porto','der Hafen'],['la nave / le navi','das Schiff / die Schiffe'],['il marinaio','der Seemann','leute roma'],['il grano','das Getreide'],['il sale','das Salz'],['arriva / arrivano','er kommt an / sie kommen an','verben'],['pesante','schwer','wie roma'],['il mare','das Meer']],
    sentences:[['Ostia è il porto di Roma.','Ostia ist der Hafen von Rom.'],['Le navi arrivano al porto.','Die Schiffe kommen im Hafen an.'],['Il marinaio è sulla nave.','Der Seemann ist auf dem Schiff.'],['La nave ha il grano.','Das Schiff hat Getreide an Bord.'],['L’anfora è pesante.','Die Amphore ist schwer.'],['Il sale è caro? No.','Ist das Salz teuer? Nein.'],['Il mare è grande.','Das Meer ist groß.'],['Quando arriva la nave? Domani.','Wann kommt das Schiff an? Morgen.']],
    reading:{ title:'A Ostia',
      text:'Oggi Livia, Tito e il padre sono a Ostia. Al porto ci sono tante navi. Le navi arrivano dal mare con il grano, il vino e l’olio. I marinai portano le anfore. Un’anfora è molto pesante. Tito: «Io sono forte!» Tito prende un’anfora… e cade in mare!',
      tr:'Heute sind Livia, Tito und der Vater in Ostia. Im Hafen liegen viele Schiffe. Die Schiffe kommen vom Meer mit Getreide, Wein und Öl. Die Seeleute tragen die Amphoren. Eine Amphore ist sehr schwer. Tito: „Ich bin stark!“ Tito nimmt eine Amphore … und fällt ins Meer!',
      qs:[['Was bringen die Schiffe?',['Getreide, Wein und Öl','Löwen','Kleidung','Steine']],['Was passiert mit Tito?',['Er fällt ins Meer','Er trägt die Amphore','Er wird Seemann','Er schläft ein']]] } },
  { title:'Gli dei di Roma', de:'Die Götter Roms', focus:'Wörter: Tempel & Götter',
    tip:'Die Römer hatten viele Götter: <b>Giove</b> (Jupiter) war der König der Götter, <b>Marte</b> (Mars) der Gott des Krieges, <b>Venere</b> (Venus) die Göttin der Liebe. Jede Familie hatte zu Hause auch einen kleinen Altar für ihre Hausgötter.',
    words:[['la dea','die Göttin'],['l’altare','der Altar'],['il fiore / i fiori','die Blume / die Blumen'],['il sacerdote','der Priester','leute roma'],['prega / preghiamo','er, sie betet / wir beten','verben roma'],['offre','bietet an, opfert','verben roma'],['protegge','beschützt','verben roma'],['il cielo','der Himmel']],
    sentences:[['Giove è il dio del cielo.','Jupiter ist der Gott des Himmels.'],['Venere è una dea.','Venus ist eine Göttin.'],['Marte protegge il soldato.','Mars beschützt den Soldaten.'],['La nonna prega nel tempio.','Oma betet im Tempel.'],['Il sacerdote è davanti all’altare.','Der Priester steht vor dem Altar.'],['Offre i fiori alla dea.','Er opfert der Göttin Blumen.'],['Preghiamo per il padre.','Wir beten für den Vater.'],['Sull’altare ci sono i fiori.','Auf dem Altar liegen Blumen.']],
    reading:{ title:'Il pane degli dei',
      text:'Ogni mattina la nonna va all’altare della casa. Offre il pane e i fiori agli dei della famiglia. Poi prega: «Proteggete la mia famiglia!» Tito guarda il pane sull’altare. Ha fame… La nonna: «Tito! Il pane è per gli dei!»',
      tr:'Jeden Morgen geht Oma zum Hausaltar. Sie opfert den Göttern der Familie Brot und Blumen. Dann betet sie: „Beschützt meine Familie!“ Tito schaut auf das Brot auf dem Altar. Er hat Hunger … Oma: „Tito! Das Brot ist für die Götter!“',
      qs:[['Was opfert Oma?',['Brot und Blumen','Wein','Honig','Geld']],['Warum schaut Tito auf den Altar?',['Er hat Hunger','Er betet','Er sucht den Hund','Er ist müde']]] } },
  { title:'La legione', de:'Die Legion', focus:'Wörter: Soldaten & Legion',
    tip:'Ein römischer Legionär marschierte bis zu 30 Kilometer am Tag, mit über 20 Kilo Gepäck. Am Abend baute die Legion ein Lager mit Zelten auf. Livias Vater Quinto ist Legionär und oft weit weg von zu Hause.',
    words:[['la legione','die Legion (eine Truppe)'],['il legionario','der Legionär','leute roma'],['marcia / marciano','er marschiert / sie marschieren','verben roma'],['il generale','der General','leute roma'],['la tenda','das Zelt'],['il nemico','der Feind','leute roma'],['lo zaino','der Rucksack, das Gepäck'],['lontano','weit weg','orte roma']],
    sentences:[['Il padre è un legionario.','Der Vater ist Legionär.'],['La legione marcia.','Die Legion marschiert.'],['Lo zaino del soldato è pesante.','Das Gepäck des Soldaten ist schwer.'],['Il generale è nella tenda.','Der General ist im Zelt.'],['Dov’è il nemico? Lontano.','Wo ist der Feind? Weit weg.'],['Il legionario marcia con lo scudo.','Der Legionär marschiert mit dem Schild.'],['La legione è lontano da Roma.','Die Legion ist weit weg von Rom.'],['Il nemico ha paura della legione.','Der Feind hat Angst vor der Legion.']],
    reading:{ title:'Una lettera del padre',
      text:'Cara Livia, caro Tito, sono lontano, con la legione. Ogni giorno marciamo e marciamo. Lo zaino è pesante. La sera dormo nella tenda. Il generale è bravo. Il nemico? Non vedo nessuno. Domani torno a Roma! Il vostro padre, Quinto',
      tr:'Liebe Livia, lieber Tito, ich bin weit weg, mit der Legion. Jeden Tag marschieren und marschieren wir. Das Gepäck ist schwer. Abends schlafe ich im Zelt. Der General ist gut. Der Feind? Ich sehe niemanden. Morgen komme ich zurück nach Rom! Euer Vater, Quinto',
      qs:[['Wo schläft der Vater abends?',['Im Zelt','In einem Haus','Im Freien','In einer Taverne']],['Was schreibt er am Ende?',['Dass er morgen nach Rom zurückkommt','Dass er den Feind gesehen hat','Dass er krank ist','Dass er General wird']]] } },
  { title:'Giochi romani', de:'Römische Spiele', focus:'Wörter: Spielen',
    tip:'Römische Kinder spielten mit Nüssen (ähnlich wie mit Murmeln), mit Bällen, Puppen und Würfeln. Auch die Erwachsenen würfelten gern, oft um Geld, obwohl das eigentlich verboten war.',

    reading:{ title:'Il gioco delle noci',
      text:'In piazza Tito e Gaio giocano con le noci. Tito ha dieci noci, Gaio ha venti noci. Giocano e giocano. Alla fine Tito ha trenta noci! È il vincitore. Gaio è triste. Tito: «Ecco dieci noci per te.» Adesso Gaio è felice.',
      tr:'Auf dem Platz spielen Tito und Gaio mit Nüssen. Tito hat zehn Nüsse, Gaio hat zwanzig. Sie spielen und spielen. Am Ende hat Tito dreißig Nüsse! Er ist der Sieger. Gaio ist traurig. Tito: „Hier sind zehn Nüsse für dich.“ Jetzt ist Gaio glücklich.',

  { title:'I Saturnali', de:'Die Saturnalien', focus:'Wörter: Feste & Geschenke',
    tip:'Im Dezember feierten die Römer die <b>Saturnali</b>, ein fröhliches Fest für den Gott Saturn. Man schenkte sich Kerzen und kleine Figuren, trug eine Filzmütze und würfelte. Für ein paar Tage durften Diener mit am Tisch sitzen, und einer wurde als „König des Festes“ ausgelost.',
    words:[['la festa','das Fest'],['il regalo / i regali','das Geschenk / die Geschenke'],['dicembre','Dezember','zeit'],['la candela / le candele','die Kerze / die Kerzen'],['il re','der König','leute roma'],['tutti / tutte','alle'],['cantano','sie singen','verben'],['il berretto','die Mütze']],

    reading:{ title:'Il re della festa',

      tr:'Es ist Dezember: Es sind Saturnalien. Die ganze Familie ist zu Hause. Alle tragen eine Mütze. Der Vater nimmt die Würfel: Wer ist der König des Festes? Tito! König Tito sagt: „Heute macht der Vater das Essen, und Oma singt!“ Alle lachen.',

  { at:'roma-v2-2', kind:'Spannend · Witzig', title:'Argo e il leone', de:'Argo und der Löwe', dialog:true,
    voices:{Tito:'Diego', Padre:'Giuseppe', Livia:'Elsa'},
    words:[['guarda!','schau!'],['entra','kommt herein'],['abbaia','bellt'],['scappa','flieht, haut ab'],['incredibile','unglaublich']],
    text:'Oggi Tito, Livia e il padre sono al Colosseo. Il pubblico è enorme. Argo è con loro.\nTito: Papà, guarda! Il gladiatore ha un elmo grande!\nPadre: Sì, è forte. Ma dov’è Argo?\nLivia: Non lo so! Argo non è qui!\nNell’arena entra un leone. Il pubblico applaude. Ma poi… nell’arena c’è anche un cane!\nTito: È Argo! Argo è nell’arena!\nLivia: Aiuto! Il leone!\nIl leone guarda Argo. Argo guarda il leone. Il pubblico non parla. Poi Argo abbaia: «Bau! Bau!» Il leone ha paura e scappa!\nPadre: Incredibile!\nIl pubblico ride e applaude. Anche l’imperatore ride.\nTito: Argo vince!',
    tr:'Heute sind Tito, Livia und der Vater im Kolosseum. Das Publikum ist riesig. Argo ist bei ihnen.\nTito: Papa, schau! Der Gladiator hat einen großen Helm!\nVater: Ja, er ist stark. Aber wo ist Argo?\nLivia: Ich weiß es nicht! Argo ist nicht hier!\nIn die Arena kommt ein Löwe. Das Publikum klatscht. Aber dann … ist in der Arena auch ein Hund!\nTito: Das ist Argo! Argo ist in der Arena!\nLivia: Hilfe! Der Löwe!\nDer Löwe schaut Argo an. Argo schaut den Löwen an. Das Publikum ist ganz still. Dann bellt Argo: „Wau! Wau!“ Der Löwe bekommt Angst und flieht!\nVater: Unglaublich!\nDas Publikum lacht und klatscht. Sogar der Kaiser lacht.\nTito: Argo gewinnt!',
    qs:[['Was bewundert Tito am Anfang?',['Den großen Helm des Gladiators','Den Löwen','Den Kaiser','Das Publikum']],
        ['Wo ist Argo plötzlich?',['In der Arena','Beim Kaiser','Zu Hause','Beim Gladiator']],
        ['Was macht der Löwe, als Argo bellt?',['Er bekommt Angst und flieht','Er brüllt','Er greift an','Er schläft ein']],
        ['Wer lacht auch?',['Der Kaiser','Der Löwe','Der Gladiator','Niemand']]],
    tf:[['Argo ist mit der Familie im Kolosseum.',true],['Der Löwe frisst Argo.',false],['Das Publikum klatscht, als der Löwe hereinkommt.',true],['Der Kaiser ist wütend.',false]] },

const ORDER = ['l1','l2','n3','n4','l3','l4','n7','n8','l5','n10','n11','n12','l6','n14','n15','n16'];
const OLD_POS = {2:4, 3:5, 4:8, 5:12};
TOPICS.forEach(t => {
  const old = t.lessons;
  old.forEach((l,i) => { l.id = t.id + '-l' + (i+1); });
  /* Fehlende Lektionen (Thema wird noch Stufe für Stufe ausgebaut) werden übersprungen */
  t.lessons = ORDER.map(k => k[0] === 'l' ? old[+k.slice(1) - 1]
    : NEW_LESSONS[t.id][k] && Object.assign({id: t.id + '-' + k, tip: NEW_TIPS[k]}, NEW_LESSONS[t.id][k])).filter(Boolean);
  (t.stories || []).forEach(s => { s.after = OLD_POS[s.after] ?? s.after; });
});

TOPICS.forEach(t => t.lessons.forEach((l,i) => { l.level = LEVELS[i]; l.focus = FOCUS[i]; l.stage = Math.floor(i / 4) + 1; }));

/* Mehr Aufgaben (MORE): Zusatzsätze für bestehende Lektionen, Vertiefungs-Lektionen am Ende jeder Stufe, Übungssätze pro Stufe. */
const STAGES = ['Einstieg · A1','Grundlagen · A1','Aufbau · A2','Fortgeschritten · B1'];
TOPICS.forEach(t => {
  const m = MORE[t.id];
  if (!m) return;
  t.lessons.forEach(l => { const k = l.id.slice(t.id.length + 1); if (m.sent[k]) l.sentences = [...(l.sentences || []), ...m.sent[k]]; });
  const storyAt = t.stories.map(s => t.lessons[s.after]);
  t.lessons = [1,2,3,4].flatMap(st => [...t.lessons.filter(l => l.stage === st),
    ...(m.lessons[st] || []).map((x,j) => Object.assign({id:`${t.id}-v${st}-${j+1}`, stage:st, level:STAGES[st-1], extra:true}, x))]);
  t.stories.forEach((s,i) => { s.after = t.lessons.indexOf(storyAt[i]); });
});
const stageEnd = (t, st) => t.lessons.reduce((m,l,i) => l.stage === st ? i : m, -1);
