<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111513" media="(prefers-color-scheme: dark)">
<meta name="description" content="Italienisch lernen mit Themen, die dich begeistern.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
window.CP_WEB = true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.CP_INSTALL = e; window.dispatchEvent(new Event('cp-install')); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
<title>Con Passione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#17201B; --muted:#5B6760; --line:#D6DDD8;
  --accent:#1E4FB8; --accent-ink:#FFFFFF; --accent-shadow:#143A8A;
  --t-cinema:#AE2A40; --t-cavalli:#2E7A58; --t-dolci:#B5621C; --t-brividi:#6A3F9E; --t-viaggio:#0E7490; --t-roma:#9A3324;
  --ok:#1B8452; --ok-bg:#E1F3E8; --bad:#C0392F; --bad-bg:#FBE6E3; --warn:#8A6300; --warn-bg:#FDF1C7; --warn-line:#E0B000;
  --tile:#FFFFFF; --tile-edge:#C9D1CB;
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111513; --surface:#1A201C; --ink:#E8EEEA; --muted:#9AA69F; --line:#2C3530;
    --accent:#7EA3F2; --accent-ink:#0E1A33; --accent-shadow:#4A6BB5;
    --t-cinema:#F27E8E; --t-cavalli:#63C49B; --t-dolci:#E8A263; --t-brividi:#B793E8; --t-viaggio:#5FC3DB; --t-roma:#EE8A73;
    --ok:#5CCB8E; --ok-bg:#16301F; --bad:#F27B70; --bad-bg:#371B19; --warn:#F2C94C; --warn-bg:#3A300F; --warn-line:#C9A227;
    --tile:#212824; --tile-edge:#0A0C0B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111513; --surface:#1A201C; --ink:#E8EEEA; --muted:#9AA69F; --line:#2C3530;
  --accent:#7EA3F2; --accent-ink:#0E1A33; --accent-shadow:#4A6BB5;
  --t-cinema:#F27E8E; --t-cavalli:#63C49B; --t-dolci:#E8A263; --t-brividi:#B793E8; --t-viaggio:#5FC3DB; --t-roma:#EE8A73;
  --ok:#5CCB8E; --ok-bg:#16301F; --bad:#F27B70; --bad-bg:#371B19; --warn:#F2C94C; --warn-bg:#3A300F; --warn-line:#C9A227;
  --tile:#212824; --tile-edge:#0A0C0B;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap:has(.topicpage){max-width:980px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);min-height:112px;color:var(--ink)}
button.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile .tn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--t);color:var(--t);margin-bottom:2px}
.tile.done .tn{background:var(--t);color:var(--surface)}
.tile .ti{font-family:var(--display);font-size:21px;line-height:1.1}
.tile .sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.tile .rec{position:absolute;top:12px;right:12px;margin:0}
.tile.next{border-color:var(--t);box-shadow:0 3px 0 var(--t)}
.tile.practice{border-style:dashed;box-shadow:none;background:transparent}
.tile.practice .tn{border-style:dashed}
.tile.story .tn{border-style:dashed}
.tile.story.done .tn{border-style:solid}
.tile.story .sbtns{margin-top:auto;padding-top:6px}
.tile.story .sbtn{padding:6px 12px;font-size:13px}
.tile .kind{margin:2px 4px 0 0}
.jump{display:grid;gap:10px;margin-bottom:6px}
.jump .main small{display:block;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;opacity:.9;margin-top:2px}
.jrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{font-size:13.5px;color:var(--muted)}
.chipbtn{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chipbtn[aria-pressed="true"]{border-color:var(--t);background:var(--t);color:var(--surface)}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:13.5px;font-weight:700;color:var(--t);text-decoration:none;padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--t) 40%,var(--line))}
.alldone{margin:4px 0;font-weight:700;color:var(--ok);grid-column:1/-1}
.vfold{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px 12px}
.vfold summary{cursor:pointer;display:flex;flex-direction:column;padding:10px 0;list-style:none}
.vfold summary::-webkit-details-marker{display:none}
.vfold summary .ti{font-family:var(--display);font-size:24px}
.vfold summary .ti::before{content:"▸ ";color:var(--t)}
.vfold[open] summary .ti::before{content:"▾ "}
.vfold summary .sub{font-size:13px;color:var(--muted)}
.vfold .vocab{border:0;border-top:1px solid var(--line);border-radius:0}
.section-h{scroll-margin-top:12px}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}.tile{padding:12px;min-height:104px}.tile .ti{font-size:19px}.tile.story{grid-column:1/-1}}
.it{font-family:var(--display);font-weight:400}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
h1,h2,h3{text-wrap:balance;margin:0}

/* Home */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:28px 8px}
.brand{font-family:var(--display);font-size:44px;line-height:1;font-weight:400}
.brand em{color:var(--accent)}
.stats{display:flex;gap:18px}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.lead{color:var(--muted);max-width:44ch;margin:8px 0 24px}
.topics{display:grid;gap:12px}
.topic{--t:var(--accent);text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.topic .name{font-family:var(--display);font-size:38px;line-height:1;color:var(--t)}
.topic .de{font-size:14px;color:var(--muted);grid-column:1}
.topic .blurb{grid-column:1/-1;font-size:14.5px;margin-top:6px}
.ring{grid-row:1/3;grid-column:2;width:48px;height:48px}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--t);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
.ring text{fill:var(--ink);font:700 13px var(--body);text-anchor:middle;dominant-baseline:central}
.soon{border:1.5px dashed var(--line);border-radius:16px;padding:18px 20px;color:var(--muted);font-size:14.5px}
.soon b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.foot{margin-top:auto;padding-block:32px 20px;font-size:12.5px;color:var(--muted);text-align:center}

/* Topic */
.back{background:none;border:0;padding:8px 0;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-top:16px}
.back:hover{color:var(--ink)}
.thead{padding-block:8px 20px}
.thead .it{font-size:60px;line-height:1;color:var(--t)}
.thead p{color:var(--muted);margin:8px 0 0;max-width:46ch}
.lessons{display:grid;gap:10px}
.lesson{text-align:left;display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line)}
.lesson:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.lesson .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--t);color:var(--t)}
.lesson.done .n{background:var(--t);color:var(--surface)}
.lesson.practice{border-style:dashed;box-shadow:none;background:transparent}
.lesson.practice .n{border-style:dashed}
.lesson .txt{flex:1;min-width:0}
.lesson .ti{font-family:var(--display);font-size:26px;line-height:1.1}
.lesson .sub{font-size:13.5px;color:var(--muted)}
.lesson .go{font-weight:700;color:var(--t);font-size:14px;white-space:nowrap}
.section-h{margin:32px 0 10px}
.lvl{display:flex;align-items:baseline;gap:10px;margin:22px 0 2px}
.lvl:first-child{margin-top:0}
.lvl span{font-size:12.5px;color:var(--muted)}
.rec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--surface);background:var(--t);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.vocab{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .v-it{font-family:var(--display);font-size:21px;flex:1;min-width:0}
.vrow .v-de{color:var(--muted);font-size:14px;text-align:right;flex:1;min-width:0}

/* Speak button */
.spk{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:inline-grid;place-items:center;color:var(--accent)}
.spk svg{width:18px;height:18px}
.spk.lg{width:52px;height:52px}
.spk.lg svg{width:24px;height:24px}
.snd{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:700}
.snd svg{width:18px;height:18px}
.snd[aria-pressed="true"]{color:var(--muted);background:var(--bg)}
.pbar .snd .lbl{display:none}
body.muted .spk{opacity:.35}

/* Lesson player */
.player{min-height:100%;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:14px;padding-block:18px 8px}
.x{background:none;border:0;padding:4px;color:var(--muted);display:grid;place-items:center}
.x svg{width:24px;height:24px}
.x:disabled{opacity:.25}
.rv{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:14px;font-weight:700;color:var(--muted)}
.rv .linkbtn{padding:0}
.pairs{display:flex;flex-direction:column;gap:10px}
.pairs .big{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;gap:10px;flex-wrap:wrap}
.pairs .it{font-size:22px}
.track{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--t);border-radius:99px;transition:width .35s ease}
.stage{flex:1;padding-block:20px 24px;display:flex;flex-direction:column;gap:20px}
.ask{font-size:20px;font-weight:700}
.big{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big .it{font-size:48px;line-height:1.05}
.big .it.de{font-family:var(--body);font-size:30px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.card .it{font-size:54px;line-height:1.05;color:var(--t)}
.card .de{font-size:18px;color:var(--muted)}
.new{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--t);border:1.5px solid var(--t);border-radius:99px;padding:2px 10px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;background:var(--tile);border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);font-size:17px;font-weight:600}
.opt.itf{font-family:var(--display);font-size:24px;font-weight:400;padding-block:10px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 3px 0 var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--tile))}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);box-shadow:0 3px 0 var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);box-shadow:0 3px 0 var(--bad);background:var(--bad-bg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{text-align:center;font-size:15.5px;padding:12px 8px;min-height:56px}
.match .opt.itf{font-size:21px}
.match .opt.gone{opacity:.35;box-shadow:none;border-color:var(--line);background:transparent}
.match .opt.flash{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.answer-line{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.answer-line + .answer-line{min-height:0}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.wt{padding:8px 14px;background:var(--tile);border:2px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);font-family:var(--display);font-size:22px;line-height:1.2}
.wt.used{visibility:hidden}
.field{width:100%;font:500 20px var(--body);padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--tile);color:var(--ink)}
.field:focus{border-color:var(--accent);outline:none}
.reading{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.reading h3{font-family:var(--display);font-size:28px;font-weight:400;color:var(--t)}
.reading .txt{font-family:var(--display);font-size:21px;line-height:1.45;margin:10px 0 0}
.reading .tr{font-size:14.5px;color:var(--muted);margin:10px 0 0;border-top:1px solid var(--line);padding-top:10px}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;font-size:14px}
.picbox{align-self:center;font-size:96px;line-height:1.1;padding:18px 28px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-align:center;letter-spacing:4px}
.opts.picopts{grid-template-columns:1fr 1fr}
.opt.picopt{font-size:44px;text-align:center;padding:14px 8px;line-height:1.2}
.picbox{max-width:100%}
.picbox svg,.opt.picopt svg{max-width:100%}
.abox{display:flex;align-items:center;gap:14px;margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--t) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--t) 25%,var(--line))}
.aplay{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--t);color:var(--surface);display:grid;place-items:center}
.aplay svg{width:24px;height:24px}
.ameta{flex:1;min-width:0}
.abar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.afill{height:100%;width:0;background:var(--t);border-radius:99px}
.actl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.atime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
body.muted .aplay{opacity:.35}
.reading .who{font-family:var(--body);font-size:15px;font-weight:800;color:var(--t)}
.reading .nar{font-style:italic}
.pool.order{flex-direction:column;align-items:stretch}
.order .wt{font-size:18px;text-align:left;width:100%}
.answer-line.order{flex-direction:column;flex-wrap:nowrap;min-height:120px}
.olist{margin:6px 0;padding-left:22px}
.olist li{font-size:17px}
.story-row{flex-wrap:wrap}
.sbtns{display:flex;gap:8px;flex:none}
.sbtn{padding:8px 14px;border-radius:99px;border:2px solid var(--t);background:transparent;color:var(--t);font-weight:700;font-size:14px}
.sbtn.done{background:var(--t);color:var(--surface)}
.kind{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t);border:1px solid var(--t);border-radius:99px;padding:1px 8px;margin:4px 6px 0 0}
.tip{background:color-mix(in srgb,var(--t) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--t) 30%,var(--line));border-radius:14px;padding:14px 16px;font-size:15px}
.tip b{color:var(--t)}

/* Footer feedback */
.fb{position:sticky;bottom:0;margin-inline:-16px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.fb.ok{background:var(--ok-bg);border-color:transparent}
.fb.bad{background:var(--bad-bg);border-color:transparent}
.fb.warn{background:var(--warn-bg);border-color:transparent}
.fb.warn .msg{display:block;color:var(--warn)}
.fb.warn .main{background:var(--warn);color:var(--surface);box-shadow:0 4px 0 color-mix(in srgb,var(--warn) 70%,#000)}
.field.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.fb .msg{display:none;font-weight:800;font-size:19px}
.fb.ok .msg{display:block;color:var(--ok)}
.fb.bad .msg{display:block;color:var(--bad)}
.fb .msg small{display:block;font-size:15px;font-weight:500;color:var(--ink);margin-top:2px}
.fb .msg small .it{font-size:20px}
.main{width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 4px 0 var(--accent-shadow)}
.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-shadow)}
.main:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default;transform:none}
.fb.ok .main{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.fb.bad .main{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.fb.ok .main,.fb.bad .main{color:var(--surface)}

/* Result */
.result{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding-block:40px}
.result .it{font-size:56px;line-height:1;color:var(--t)}
.rstats{display:flex;gap:12px;margin:18px 0;flex-wrap:wrap;justify-content:center}
.rstat{border:2px solid var(--t);border-radius:14px;padding:10px 20px;min-width:120px}
.rstat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.rstat span{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.result .actions{display:grid;gap:10px;width:100%;margin-top:12px}
.ghost{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.w{cursor:pointer;border-bottom:1.5px dotted color-mix(in srgb,var(--ink) 35%,transparent)}
.w:focus{outline:none;background:color-mix(in srgb,var(--accent) 15%,transparent);border-radius:4px}
.w.nw{background:color-mix(in srgb,var(--t) 16%,transparent);border-bottom-color:var(--t);border-radius:4px 4px 0 0;padding-inline:2px}
.pop{position:fixed;z-index:20;max-width:min(260px,calc(100vw - 16px));background:var(--ink);color:var(--bg);font:600 14px/1.3 var(--body);padding:6px 10px;border-radius:10px;box-shadow:0 4px 14px rgb(0 0 0 / .2);pointer-events:none}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted)}
.row2{display:flex;gap:10px}
.row2 > *{flex:1;min-width:0}
.stats{align-items:center;flex-wrap:wrap}
.pbar .snd{padding:7px 9px}
.hint .w.nw{cursor:default}
/* Nachschlagen & Üben */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool,.folder{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line)}
.tool:active,.folder:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tname,.fname{font-family:var(--display);font-size:24px;line-height:1.1}
.tde,.fde{font-size:13px;color:var(--muted)}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.folder{--t:var(--accent);display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px}
.folder .fname{color:var(--t)}
.folder .fcount{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.folder .fde{grid-column:1/-1}
.gp{margin:10px 0;max-width:62ch}
.chapter .thead p{max-width:62ch}
.tscroll{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.gtable{border-collapse:collapse;width:100%;font-size:14.5px}
.gtable th,.gtable td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.gtable thead th{border-top:0;background:color-mix(in srgb,var(--t) 10%,var(--surface));font-size:13px}
.gtable small,.latin{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.tform{background:none;border:0;padding:0;font-family:var(--display);font-size:19px;color:var(--ink);cursor:pointer;border-bottom:1.5px dotted color-mix(in srgb,var(--ink) 30%,transparent)}
.chapter > .ghost{margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);box-shadow:0 2px 0 var(--line);display:inline-flex;gap:6px;align-items:baseline}
.vchip b{font-family:var(--display);font-size:20px;font-weight:400}
.vchip span{font-size:13px;color:var(--muted)}
.tcards{display:grid;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tcard h3{font-size:28px;color:var(--accent)}
.tcard p{margin:4px 0 0}
.why{margin-top:6px!important;font-size:14px!important;opacity:.9}
@media (max-width:420px){.tools,.folders{grid-template-columns:1fr}}
.big.listen{justify-content:center;flex-direction:column;gap:8px;padding:10px 0}
.big.listen .spk.lg{width:72px;height:72px}
.big.listen .spk.lg svg{width:32px;height:32px}
.opts.tf{grid-template-columns:1fr 1fr}
.lesson.story .n{border-style:dashed;font-size:14px}
.lesson.story.done .n{border-style:solid}
.linkbtn.later{justify-self:center;align-self:center;font-weight:600;color:var(--muted)}
.offl{margin-top:22px;display:grid;gap:4px}
.micbig{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--t);background:var(--surface);color:var(--t);font-weight:800;font-size:16px}
.micbig svg{width:24px;height:24px}
.micbig.on{background:var(--t);color:var(--surface);animation:micpulse 1.2s ease-in-out infinite}
@keyframes micpulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--t) 25%,transparent)}}
.recout{min-height:1.3em;margin:0;text-align:center;font-size:16px;color:var(--ink)}
.miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.brand{font-size:38px}.card .it{font-size:44px}.big .it{font-size:40px}.thead .it{font-size:50px}}

const TIPS = {"cinema-l2": "Vor jedem Nomen steht ein Artikel (der/die/das). Italienisch kennt nur männlich und weiblich: <b>il</b> biglietto, <b>lo</b> schermo (vor s + Mitlaut), <b>la</b> serie, <b>l’</b>attore (vor a, e, i, o, u). <b>film</b> bleibt in der Mehrzahl gleich: i film.", "cinema-l3": "<b>è</b> = ist, <b>ho</b> = ich habe, <b>ha</b> = hat. Adjektive beschreiben, wie etwas ist. Sie stehen meist hinter dem Nomen und passen ihre Endung an: il film bell<b>o</b>, la serie bell<b>a</b>. Endet ein Adjektiv auf -e, bleibt es gleich: divertent<b>e</b>.", "cinema-l4": "Gegenwart: Die Endung des Verbs zeigt, wer etwas tut. guard<b>are</b> (schauen) → guard<b>o</b> (ich schaue), guard<b>iamo</b> (wir schauen). „Ich mag“ heißt wörtlich „mir gefällt“: <b>mi piace</b> + eine Sache, <b>mi piacciono</b> + mehrere Sachen.", "cinema-l5": "Vergangenheit – abgeschlossen: für etwas, das einmal passiert und vorbei ist. Gebildet wie im Deutschen „ich habe gesehen“: <b>ho</b> (ich habe) + Partizip. guardare → <b>ho guardato</b>, vedere → <b>ho visto</b> (Ausnahme!). Bei Bewegung nimmt man „sein“: <b>siamo andati</b> (wir sind gegangen).", "cinema-l6": "Vergangenheit – erzählend: So beschreibst du, wie es früher war oder was immer wieder passierte: Totò viv<b>eva</b> (lebte), and<b>ava</b> (ging immer). Ein einzelnes Ereignis steht in der abgeschlossenen Vergangenheit: un giorno <b>è scoppiato</b> un incendio (eines Tages brach ein Feuer aus).", "cavalli-l2": "Wie im Deutschen gibt es männliche und weibliche Formen: <b>il cavallo</b> (das Pferd) und <b>la cavalla</b> (die Stute). Vor z steht der Artikel <b>lo</b>: <b>lo zoccolo</b> (der Huf).", "cavalli-l3": "<b>è</b> = ist, <b>sono</b> = ich bin. Beim Alter sagt man „haben“: Fulmine <b>ha</b> dieci anni (wörtlich: hat zehn Jahre). Adjektive passen sich an: il cavallo bianc<b>o</b>, la cavalla bianc<b>a</b>.", "cavalli-l4": "Gegenwart: spazzol<b>are</b> (bürsten) → spazzol<b>o</b> (ich bürste), cavalc<b>are</b> (reiten) → cavalch<b>iamo</b> (wir reiten). Aus der Reihe tanzt andare (gehen) → <b>vado</b> (ich gehe). „Reiten gehen“ heißt <b>andare a cavallo</b>.", "cavalli-l5": "Vergangenheit – abgeschlossen: <b>ho</b> (ich habe) + Partizip. partecipare → <b>ho partecipato</b>, vincere → <b>abbiamo vinto</b>. Bei einer Veränderung nimmt man „sein“: il puledro <b>è nato</b> (das Fohlen ist geboren).", "cavalli-l6": "Vergangenheit – erzählend: für Gewohnheiten von früher: mio nonno mi port<b>ava</b> (mein Opa nahm mich immer mit). <b>Si corre</b> heißt wörtlich „man läuft“, also: das Rennen findet statt.", "dolci-l2": "Achtung, Ausnahme: <b>l’uovo</b> (das Ei) wird in der Mehrzahl zu <b>le uova</b> – in der Einzahl männlich, in der Mehrzahl weiblich.", "dolci-l3": "<b>è</b> = ist, <b>sono</b> = sind, <b>ho</b> = ich habe, <b>hai</b> = du hast. Hunger „hat“ man: <b>ho fame</b>. Adjektive passen sich an: la torta buon<b>a</b>, i biscotti buon<b>i</b>.", "dolci-l4": "Gegenwart: prepar<b>are</b> → prepar<b>o</b> (ich bereite zu). In Rezepten steht die Befehlsform, die dich zu etwas auffordert: <b>aggiungi!</b> (gib dazu!), <b>mescola!</b> (rühre!), <b>preriscalda!</b> (heize vor!).", "dolci-l5": "Vergangenheit – abgeschlossen: <b>ho</b> + Partizip. preparare → <b>ho preparato</b>, dimenticare → <b>ho dimenticato</b>. Ausnahme: fare → <b>ha fatto</b> (hat gemacht). Mit „sein“: la torta <b>è bruciata</b> (ist verbrannt).", "dolci-l6": "Vergangenheit – erzählend: So war es früher: la nonna prepar<b>ava</b> (Oma machte immer). Ein einzelnes Ereignis steht dagegen in der abgeschlossenen Vergangenheit: un giorno <b>mi ha dato</b> (eines Tages gab sie mir).", "brividi-l3": "<b>sono</b> = ich bin, <b>è</b> = ist, <b>ho</b> = ich habe. Angst „hat“ man wie im Deutschen: <b>ho paura</b>. Adjektive passen sich an: il castello vecchi<b>o</b>, la casa vecchi<b>a</b>.", "brividi-l4": "Gegenwart: intagli<b>are</b> → intagli<b>o</b> (ich schnitze), bussare → i bambini buss<b>ano</b> (die Kinder klopfen). „Ich mag“ bei mehreren Sachen: <b>mi piacciono</b> i film horror.", "brividi-l5": "Vergangenheit – abgeschlossen: <b>ho</b> + Partizip (ho sentito – ich habe gehört). Bei Bewegung nimmt man „sein“: Marco <b>è entrato</b> (ist hineingegangen), <b>siamo scappati</b> (sind weggerannt).", "brividi-l6": "Vergangenheit – erzählend: Sie malt die Stimmung (fac<b>eva</b> freddo – es war kalt). Die abgeschlossene Vergangenheit bringt die Handlung voran (<b>abbiamo deciso</b> – wir beschlossen)."};

  n3:'Zahlen von 1 bis 10: uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci. <b>c’è</b> heißt „es gibt / da ist“ bei einer Sache, <b>ci sono</b> bei mehreren: c’è un posto – ci sono tre posti.',
  n4:'Fragewörter: <b>chi</b> (wer), <b>che cosa</b> (was), <b>dove</b> (wo), <b>quando</b> (wann), <b>perché</b> (warum), <b>quanto</b> (wie viel). Vor „è“ wird gekürzt: dove + è = <b>dov’è</b>, che cosa + è = <b>che cos’è</b>.',
  n7:'Gegenwart bei Verben auf -ere und -ire: ved<b>ere</b> → ved<b>o</b> (ich sehe), ved<b>i</b> (du siehst); dorm<b>ire</b> → dorm<b>o</b>, dorm<b>e</b>. Verneinen ist einfach: <b>non</b> vor das Verb. Doppelt verneint ist im Italienischen richtig: <b>non</b> vedo <b>niente</b> (ich sehe nichts).',
  n8:'Wo ist etwas? <b>davanti a</b> (vor), <b>dietro</b> (hinter), <b>accanto a</b> (neben), <b>sopra</b> (auf, über), <b>sotto</b> (unter). Kleine Wörter verschmelzen mit dem Artikel: a + il = <b>al</b>, in + il = <b>nel</b>, su + il = <b>sul</b>.',
  n10:'Vergangenheit – abgeschlossen mit „sein“: bei Bewegung (andare, arrivare, uscire, tornare) und bei Veränderung (cominciare, finire, cadere). Das Partizip passt sich an wie ein Adjektiv: Luca è arrivat<b>o</b>, Sara è arrivat<b>a</b>, siamo arrivat<b>i</b>.',
  n11:'Wollen und können: <b>voglio</b> (ich will), <b>vuoi</b> (du willst), <b>posso</b> (ich kann/darf) + Grundform des Verbs: voglio <b>vedere</b>, posso <b>andare</b>. So sprichst du über Pläne und fragst um Erlaubnis.',
  n12:'Manche Verben haben ein „sich“ dabei (Fachwort: reflexiv): alzarsi = aufstehen → <b>mi</b> alzo (ich stehe auf), <b>si</b> alza (er/sie steht auf). Wie im Deutschen: ich wasche <b>mich</b>, er wäscht <b>sich</b>.',
  n14:'Kulisse und Handlung: Die erzählende Vergangenheit beschreibt, was gerade lief (pioveva – es regnete). Die abgeschlossene Vergangenheit sagt, was plötzlich passierte. Typisch: <b>mentre</b> (während) + erzählend, <b>all’improvviso</b> (plötzlich) + abgeschlossen.',
  n15:'Zukunft (futuro): Eine eigene Endung zeigt, dass etwas später passiert: guarder<b>ò</b> (ich werde schauen), sar<b>à</b> (wird sein), andr<b>emo</b> (wir werden gehen). Für feste Pläne nimmt man oft auch einfach die Gegenwart – wie im Deutschen: „Morgen gehe ich …“.',
  n16:'Die „würde“-Form (condizionale) für Wünsche und Höflichkeit. Die Endung <b>-ei</b> heißt „ich würde“: vorr<b>ei</b> (ich hätte gern), scapper<b>ei</b> (ich würde weglaufen). <b>Sarebbe</b> = wäre, <b>potresti</b> = könntest du, <b>mi piacerebbe</b> = ich würde gern.'

      reading:{ title:'Il mio film',

      sentences:[['Nella stalla ci sono dieci cavalli.','Im Stall gibt es zehn Pferde.'],['C’è un puledro nel box.','In der Box ist ein Fohlen.'],['Ci sono tre carote per Fulmine.','Es gibt drei Karotten für Fulmine.'],['Questo è il box sette.','Das ist Box sieben.'],['C’è una mela per la cavalla.','Es gibt einen Apfel für die Stute.']],
      reading:{ title:'La stalla',
        text:'Buongiorno! Questa è la stalla. Nella stalla ci sono otto cavalli e due puledri. Fulmine è nel box uno. Stella è nel box due. Nel box tre c’è un puledro. Per i cavalli ci sono dieci carote e cinque mele. Certo, Fulmine vuole tutto!',
        tr:'Guten Morgen! Das ist der Stall. Im Stall gibt es acht Pferde und zwei Fohlen. Fulmine ist in Box eins. Stella ist in Box zwei. In Box drei ist ein Fohlen. Für die Pferde gibt es zehn Karotten und fünf Äpfel. Natürlich will Fulmine alles!',
        qs:[['Wie viele Pferde sind im Stall?',['Acht Pferde und zwei Fohlen','Zehn Pferde','Drei Pferde','Fünf Pferde und ein Fohlen']],['In welcher Box ist Stella?',['Box zwei','Box eins','Box drei','Box acht']]] } },
    n4:{ title:'Come si chiama?', de:'Wie heißt er?',
      words:[['chi','wer','fragen'],['Che cos’è?','Was ist das?','fragen'],['dove / dov’è','wo / wo ist','fragen'],['Quanti anni ha?','Wie alt ist er/sie?','fragen'],['Come si chiama?','Wie heißt er/sie?','fragen gruss'],['il maneggio','der Reitstall'],['l’istruttrice','die Reitlehrerin'],['la lezione','die Reitstunde']],
      sentences:[['Come si chiama la cavalla?','Wie heißt die Stute?'],['Quanti anni ha Fulmine?','Wie alt ist Fulmine?'],['Dov’è il maneggio?','Wo ist der Reitstall?'],['Chi è l’istruttrice?','Wer ist die Reitlehrerin?'],['Che cos’è? È una sella.','Was ist das? Das ist ein Sattel.']],
      reading:{ title:'La prima lezione', dialog:true,
        text:'— Buongiorno! Mi chiamo Sara. Dov’è la lezione?\n— La lezione è nel maneggio. Io sono l’istruttrice, Carla.\n— Piacere! E come si chiama il cavallo?\n— Si chiama Tornado. Ha dieci anni.\n— Dieci anni? Quanti anni ha Fulmine?\n— Fulmine ha sei anni.',
        tr:'– Guten Morgen! Ich heiße Sara. Wo ist die Reitstunde? – Die Reitstunde ist in der Reithalle. Ich bin die Reitlehrerin, Carla. – Freut mich! Und wie heißt das Pferd? – Es heißt Tornado. Es ist zehn Jahre alt. – Zehn Jahre? Wie alt ist Fulmine? – Fulmine ist sechs Jahre alt.',
        qs:[['Wie heißt die Reitlehrerin?',['Carla','Sara','Stella','Anita']],['Wie alt ist Tornado?',['Zehn Jahre','Sechs Jahre','Drei Jahre','Acht Jahre']]] } },
    n7:{ title:'Stella non mangia', de:'Stella frisst nicht',
      words:[['beve','trinkt','verben'],['l’acqua','das Wasser'],['dorme','schläft','verben'],['sente','hört, fühlt','verben'],['non','nicht'],['niente','nichts'],['il veterinario','der Tierarzt'],['malato / malata','krank','wie'],['stanco / stanca','müde','wie']],
      sentences:[['Stella non mangia il fieno.','Stella frisst das Heu nicht.'],['Il cavallo beve l’acqua.','Das Pferd trinkt das Wasser.'],['Il puledro dorme nella stalla.','Das Fohlen schläft im Stall.'],['Stella non è malata, è stanca.','Stella ist nicht krank, sie ist müde.'],['Il veterinario non sente niente.','Der Tierarzt hört nichts.']],
      reading:{ title:'Il veterinario',
        text:'Stella non mangia il fieno e non beve l’acqua. Stella dorme nel box. Sara: «Stella è malata?» Il veterinario sente Stella. «No, Stella non è malata. È stanca!» Poi Stella mangia una carota. Sara è felice!',
        tr:'Stella frisst das Heu nicht und trinkt das Wasser nicht. Stella schläft in der Box. Sara: „Ist Stella krank?“ Der Tierarzt hört Stella ab. „Nein, Stella ist nicht krank. Sie ist müde!“ Dann frisst Stella eine Karotte. Sara ist glücklich!',
        qs:[['Was ist mit Stella los?',['Sie ist müde','Sie ist krank','Sie hat Hunger','Sie ist weggelaufen']],['Was frisst Stella am Ende?',['Eine Karotte','Heu','Einen Apfel','Nichts']]] } },
    n8:{ title:'Dov’è la spazzola?', de:'Wo ist die Bürste?',
      words:[['sopra','auf, über','orte'],['sotto','unter','orte'],['dietro','hinter','orte'],['davanti a','vor','orte'],['accanto a','neben','orte'],['dentro / fuori','drinnen / draußen','orte'],['il recinto','die Koppel'],['la spazzola','die Bürste']],
      sentences:[['La sella è sopra il box.','Der Sattel liegt auf der Box.'],['La spazzola è sotto la sella.','Die Bürste ist unter dem Sattel.'],['Fulmine è fuori, nel recinto.','Fulmine ist draußen, auf der Koppel.'],['Il puledro è dietro la cavalla.','Das Fohlen ist hinter der Stute.'],['Il fieno è accanto alla stalla.','Das Heu ist neben dem Stall.']],
      reading:{ title:'Dove sono tutti?', dialog:true,
        text:'— Carla, dov’è la mia spazzola?\n— È sotto la sella, nel box di Fulmine.\n— E Fulmine dov’è? Non è nel box!\n— Fulmine è fuori, nel recinto, accanto a Stella.\n— E il puledro?\n— Il puledro è dietro Stella. Ha paura!',
        tr:'– Carla, wo ist meine Bürste? – Sie ist unter dem Sattel, in Fulmines Box. – Und wo ist Fulmine? Er ist nicht in der Box! – Fulmine ist draußen auf der Koppel, neben Stella. – Und das Fohlen? – Das Fohlen ist hinter Stella. Es hat Angst!',
        qs:[['Wo ist die Bürste?',['Unter dem Sattel','Auf der Box','Auf der Koppel','Neben dem Heu']],['Wo ist Fulmine?',['Draußen auf der Koppel','In der Box','Im Wald','Im Stall']]] } },
    n10:{ title:'Al lago', de:'Am See',
      words:[['sono andata / andato','ich bin gegangen, geritten','verben'],['siamo partiti','wir sind losgeritten','verben'],['siamo arrivati','wir sind angekommen','verben'],['è caduto / caduta','ist gefallen','verben'],['è scappato','ist weggelaufen','verben'],['siamo tornati','wir sind zurückgekommen','verben'],['il lago','der See'],['ieri','gestern','zeit']],
      sentences:[['Ieri sono andata a cavallo.','Gestern bin ich reiten gegangen.'],['Siamo partiti alle otto.','Wir sind um acht losgeritten.'],['Siamo arrivati al lago.','Wir sind am See angekommen.'],['Il puledro è scappato!','Das Fohlen ist weggelaufen!'],['Sara è caduta nel lago!','Sara ist in den See gefallen!']],
      reading:{ title:'Una passeggiata bagnata',
        text:'Ieri sono andata a cavallo con Luca. Siamo partiti alle nove e siamo arrivati al lago. Al lago Fulmine è scappato! Io sono caduta nell’acqua. Poi Fulmine è tornato. Siamo tornati alla stalla alle dieci.',
        tr:'Gestern bin ich mit Luca ausgeritten. Wir sind um neun losgeritten und am See angekommen. Am See ist Fulmine weggelaufen! Ich bin ins Wasser gefallen. Dann ist Fulmine zurückgekommen. Wir sind um zehn zum Stall zurückgekehrt.',
        qs:[['Was passierte am See?',['Fulmine lief weg und Sara fiel ins Wasser','Luca fiel ins Wasser','Sie haben gepicknickt','Fulmine hat getrunken']],['Wann kamen sie zurück zum Stall?',['Um zehn','Um neun','Um acht','Am Abend']]] } },
    n11:{ title:'Voglio imparare a saltare', de:'Ich will springen lernen',
      words:[['voglio','ich will','verben'],['vuoi','du willst','verben'],['posso','ich kann, ich darf','verben'],['puoi','du kannst, du darfst','verben'],['imparare','lernen','verben'],['saltare','springen','verben cavalli'],['galoppare','galoppieren','verben cavalli'],['cavalcare','reiten','verben cavalli'],['domani','morgen','zeit'],['la prossima settimana','nächste Woche','zeit']],
      sentences:[['Voglio imparare a saltare.','Ich will springen lernen.'],['Puoi galoppare nel recinto.','Du kannst auf der Koppel galoppieren.'],['Domani posso cavalcare Fulmine?','Darf ich morgen Fulmine reiten?'],['Vuoi saltare la prossima settimana?','Willst du nächste Woche springen?'],['Non posso galoppare nel bosco.','Ich darf im Wald nicht galoppieren.']],
      reading:{ title:'Con Carla', dialog:true,
        text:'— Carla, voglio imparare a saltare!\n— Certo! Ma prima devi galoppare bene.\n— Posso galoppare nel recinto domani?\n— Sì. E la prossima settimana puoi saltare gli ostacoli.\n— Posso cavalcare Tornado?\n— No, Tornado è grande. Puoi cavalcare Stella.',
        tr:'– Carla, ich will springen lernen! – Natürlich! Aber zuerst musst du gut galoppieren. – Darf ich morgen auf der Koppel galoppieren? – Ja. Und nächste Woche darfst du über die Hindernisse springen. – Darf ich Tornado reiten? – Nein, Tornado ist groß. Du kannst Stella reiten.',
        qs:[['Was muss Sara zuerst können?',['Gut galoppieren','Gut springen','Satteln','Ohne Sattel reiten']],['Welches Pferd darf Sara reiten?',['Stella','Tornado','Fulmine','Keins']]] } },
    n12:{ title:'La giornata di Carla', de:'Carlas Tag',
      words:[['mi alzo','ich stehe auf','verben'],['si alza','er/sie steht auf','verben'],['si lava','er/sie wäscht sich','verben'],['si veste','er/sie zieht sich an','verben'],['si riposa','er/sie ruht sich aus','verben'],['presto','früh','zeit'],['la sera','am Abend','zeit'],['lavora','arbeitet','verben']],
      sentences:[['Carla si alza presto.','Carla steht früh auf.'],['Si lava e si veste.','Sie wäscht sich und zieht sich an.'],['Poi lavora nella stalla.','Dann arbeitet sie im Stall.'],['La sera si riposa.','Am Abend ruht sie sich aus.'],['Io mi alzo alle sette.','Ich stehe um sieben auf.']],
      reading:{ title:'L’istruttrice',
        text:'Carla è l’istruttrice del maneggio. Si alza alle cinque. Si lava e si veste. Poi lavora nella stalla: il fieno per i cavalli, l’acqua, le carote. Alle nove c’è la prima lezione. La sera Carla si riposa. Ma prima dice: «A domani, cavalli!»',
        tr:'Carla ist die Reitlehrerin im Reitstall. Sie steht um fünf auf. Sie wäscht sich und zieht sich an. Dann arbeitet sie im Stall: Heu für die Pferde, Wasser, Karotten. Um neun ist die erste Reitstunde. Am Abend ruht sich Carla aus. Aber vorher sagt sie: „Bis morgen, Pferde!“',
        qs:[['Wann steht Carla auf?',['Um fünf','Um sieben','Um neun','Um sechs']],['Was macht Carla am Abend?',['Sie ruht sich aus','Sie reitet','Sie gibt Unterricht','Sie geht ins Kino']]] } },
    n14:{ title:'Il temporale', de:'Das Gewitter',
      words:[['mentre','während','zeit'],['pioveva','es regnete','verben'],['c’era il vento','es war windig'],['all’improvviso','plötzlich','zeit'],['il tuono','der Donner'],['si è spaventato','hat sich erschreckt','verben'],['è corso via','ist davongerannt','verben'],['l’ho trovato','ich habe ihn gefunden','verben']],
      sentences:[['Pioveva e c’era il vento.','Es regnete und es war windig.'],['All’improvviso il tuono!','Plötzlich der Donner!'],['Fulmine si è spaventato.','Fulmine hat sich erschreckt.'],['Fulmine è corso via nel bosco.','Fulmine ist in den Wald davongerannt.'],['Mentre pioveva, l’ho trovato nel bosco.','Während es regnete, habe ich ihn im Wald gefunden.']],
      reading:{ title:'Fulmine è sparito',
        text:'Pioveva e c’era il vento. Fulmine era nel recinto. All’improvviso: un tuono! Fulmine si è spaventato ed è corso via nel bosco. Mentre pioveva, sono andata nel bosco con Carla. Alla fine l’ho trovato sotto un albero. Fulmine era stanco, ma stava bene.',
        tr:'Es regnete und war windig. Fulmine war auf der Koppel. Plötzlich: ein Donner! Fulmine erschrak und rannte in den Wald davon. Während es regnete, bin ich mit Carla in den Wald gegangen. Am Ende habe ich ihn unter einem Baum gefunden. Fulmine war müde, aber es ging ihm gut.',
        qs:[['Warum lief Fulmine weg?',['Er erschrak vor dem Donner','Er hatte Hunger','Carla rief ihn','Die Koppel war offen']],['Wo fand Sara Fulmine?',['Unter einem Baum im Wald','Am See','Im Stall','Auf der Koppel']]] } },
    n15:{ title:'Un giorno avrò un cavallo', de:'Eines Tages werde ich ein Pferd haben',
      words:[['avrò','ich werde haben','verben'],['sarà','wird sein','verben'],['comprerò','ich werde kaufen','verben'],['vivremo','wir werden leben','verben'],['ci saranno','es wird … geben','verben'],['un giorno','eines Tages','zeit'],['la campagna','das Land (nicht die Stadt)'],['il prato','die Wiese']],
      sentences:[['Un giorno avrò un cavallo.','Eines Tages werde ich ein Pferd haben.'],['Sarà un cavallo nero.','Es wird ein schwarzes Pferd sein.'],['Comprerò una sella e una spazzola.','Ich werde einen Sattel und eine Bürste kaufen.'],['Vivremo in campagna.','Wir werden auf dem Land leben.'],['Nel prato ci saranno due cavalli.','Auf der Wiese wird es zwei Pferde geben.']],
      reading:{ title:'Il mio sogno',
        text:'Un giorno avrò un cavallo. Sarà nero, come Fulmine, e si chiamerà Tuono. Vivremo in campagna, con un prato grande. Nel prato ci saranno due cavalli e un puledro. Comprerò una sella e una spazzola. Sarà un sogno!',
        tr:'Eines Tages werde ich ein Pferd haben. Es wird schwarz sein, wie Fulmine, und es wird Tuono heißen. Wir werden auf dem Land leben, mit einer großen Wiese. Auf der Wiese wird es zwei Pferde und ein Fohlen geben. Ich werde einen Sattel und eine Bürste kaufen. Es wird ein Traum sein!',
        qs:[['Wie wird das Pferd heißen?',['Tuono','Fulmine','Stella','Tornado']],['Was wird es auf der Wiese geben?',['Zwei Pferde und ein Fohlen','Nur ein Pferd','Kühe','Einen See']]] } },
    n16:{ title:'Vorrei un consiglio', de:'Ich hätte gern einen Rat',
      words:[['vorrei','ich hätte gern, ich möchte','verben'],['potresti','könntest du','verben'],['dovresti','du solltest','verben'],['sarebbe meglio','es wäre besser','verben'],['mi piacerebbe','ich würde gern','verben'],['un consiglio','ein Rat'],['calmo / calma','ruhig','wie']],
      sentences:[['Vorrei un consiglio, Carla.','Ich hätte gern einen Rat, Carla.'],['Mi piacerebbe un cavallo calmo.','Ich hätte gern ein ruhiges Pferd.'],['Dovresti cavalcare Stella.','Du solltest Stella reiten.'],['Sarebbe meglio una cavalla calma.','Eine ruhige Stute wäre besser.'],['Potresti cavalcare con me?','Könntest du mit mir reiten?']],
      reading:{ title:'Il cavallo giusto', dialog:true,
        text:'— Carla, vorrei un consiglio. Mi piacerebbe comprare un cavallo.\n— Bene! Ma sarebbe meglio un cavallo calmo.\n— Tornado?\n— No, Tornado è grande. Dovresti cavalcare Stella: è calma.\n— Potresti cavalcare con me domani?\n— Certo!',
        tr:'– Carla, ich hätte gern einen Rat. Ich würde gern ein Pferd kaufen. – Gut! Aber ein ruhiges Pferd wäre besser. – Tornado? – Nein, Tornado ist groß. Du solltest Stella reiten: Sie ist ruhig. – Könntest du morgen mit mir reiten? – Natürlich!',
        qs:[['Welches Pferd empfiehlt Carla?',['Stella','Tornado','Fulmine','Tuono']],['Was sagt Carla über Tornado?',['Er ist groß','Er ist krank','Er ist zu alt','Er ist verkauft']]] } }

      sentences:[['Ci sono tre cornetti.','Es gibt drei Hörnchen.'],['C’è una brioche?','Gibt es eine Brioche?'],['Un cappuccino costa due euro.','Ein Cappuccino kostet zwei Euro.'],['Vorrei due cornetti, per favore.','Ich hätte gern zwei Hörnchen, bitte.'],['Quanto costa la torta? Dieci euro.','Wie viel kostet der Kuchen? Zehn Euro.']],
      reading:{ title:'Al banco', dialog:true,
        text:'— Buongiorno! C’è una brioche?\n— No, ma ci sono cornetti: tre al cioccolato e due alla crema.\n— Vorrei un cornetto al cioccolato e un cappuccino, per favore.\n— Ecco! Sono quattro euro.\n— Grazie, arrivederci!',

    n4:{ title:'Chi è in cucina?', de:'Wer ist in der Küche?',

      sentences:[['Che cos’è? È una torta.','Was ist das? Das ist ein Kuchen.'],['Dov’è la ricetta?','Wo ist das Rezept?'],['Quanta farina?','Wie viel Mehl?'],['Dov’è il cucchiaio?','Wo ist der Löffel?'],['Chi è in cucina?','Wer ist in der Küche?']],
      reading:{ title:'La nonna in cucina', dialog:true,
        text:'— Chi è in cucina?\n— Io, la nonna!\n— Che cos’è?\n— È l’impasto per la torta.\n— Dov’è la ricetta?\n— Non c’è ricetta!\n— E quanta farina? E quanto zucchero?\n— Tanto!',
        tr:'– Wer ist in der Küche? – Ich, die Oma! – Was ist das? – Das ist der Teig für den Kuchen. – Wo ist das Rezept? – Es gibt kein Rezept! – Und wie viel Mehl? Und wie viel Zucker? – Viel!',
        qs:[['Wer ist in der Küche?',['Die Oma','Die Mutter','Ein Konditor','Niemand']],['Wo ist das Rezept?',['Es gibt kein Rezept','Im Heft','Auf dem Tisch','Im Ofen']]] } },
    n7:{ title:'Non apro mai il forno', de:'Ich öffne nie den Ofen',
      words:[['prendo','ich nehme','verben'],['prendi','du nimmst','verben'],['metto','ich stelle, ich gebe hinein','verben'],['sento','ich rieche, ich höre','verben'],['apro','ich öffne','verben'],['non','nicht'],['mai','nie'],['il profumo','der Duft'],['il latte','die Milch']],
      sentences:[['Prendo il latte e il burro.','Ich nehme die Milch und die Butter.'],['Metto la torta nel forno.','Ich stelle den Kuchen in den Ofen.'],['Sento il profumo del cioccolato!','Ich rieche den Duft der Schokolade!'],['Non apro mai il forno.','Ich öffne den Ofen nie.'],['Prendi un cornetto?','Nimmst du ein Hörnchen?']],
      reading:{ title:'La torta della mamma',
        text:'Preparo una torta al cioccolato. Prendo la farina, lo zucchero, il burro e il latte. Metto l’impasto nel forno a 180 gradi. Non apro mai il forno! Dopo quaranta minuti sento un profumo buono. La torta è pronta. Mia madre: «Buonissima!»',
        tr:'Ich backe einen Schokoladenkuchen. Ich nehme das Mehl, den Zucker, die Butter und die Milch. Ich stelle den Teig bei 180 Grad in den Ofen. Ich öffne den Ofen nie! Nach vierzig Minuten rieche ich einen guten Duft. Der Kuchen ist fertig. Meine Mutter: „Superlecker!“',
        qs:[['Was macht die Person nie?',['Den Ofen öffnen','Schokolade nehmen','Milch nehmen','Den Kuchen probieren']],['Wie lange backt der Kuchen?',['40 Minuten','180 Minuten','4 Minuten','Eine Stunde']]] } },
    n8:{ title:'Dov’è la farina?', de:'Wo ist das Mehl?',
      words:[['sul tavolo','auf dem Tisch','orte'],['nel frigorifero','im Kühlschrank','orte'],['sotto','unter','orte'],['accanto a','neben','orte'],['dietro','hinter','orte'],['davanti a','vor','orte'],['la ciotola','die Schüssel'],['lo scaffale','das Regal']],
      sentences:[['Il latte è nel frigorifero.','Die Milch ist im Kühlschrank.'],['La farina è sullo scaffale.','Das Mehl ist im Regal.'],['La ciotola è sul tavolo.','Die Schüssel ist auf dem Tisch.'],['Il burro è accanto al latte.','Die Butter ist neben der Milch.'],['Lo zucchero è dietro la farina.','Der Zucker ist hinter dem Mehl.']],
      reading:{ title:'Mamma, dov’è…?', dialog:true,
        text:'— Mamma, dov’è la farina?\n— È sullo scaffale, accanto allo zucchero.\n— E il burro?\n— Nel frigorifero, dietro il latte.\n— E la ciotola?\n— Sul tavolo, davanti a te!',
        tr:'– Mama, wo ist das Mehl? – Es ist im Regal, neben dem Zucker. – Und die Butter? – Im Kühlschrank, hinter der Milch. – Und die Schüssel? – Auf dem Tisch, direkt vor dir!',
        qs:[['Wo ist die Butter?',['Im Kühlschrank hinter der Milch','Im Regal','Auf dem Tisch','Neben dem Zucker']],['Wo ist die Schüssel?',['Auf dem Tisch','Im Regal','Im Kühlschrank','Unter dem Tisch']]] } },
    n10:{ title:'In pasticceria', de:'In der Konditorei',
      words:[['siamo andati','wir sind gegangen','verben'],['sono entrata / entrato','ich bin hineingegangen','verben'],['è arrivata','ist angekommen','verben'],['è caduta','ist heruntergefallen','verben'],['siamo tornati','wir sind zurückgekommen','verben'],['ieri','gestern','zeit'],['la pasticceria','die Konditorei'],['il pasticcino / i pasticcini','das Törtchen / die Törtchen']],
      sentences:[['Ieri siamo andati in pasticceria.','Gestern sind wir in die Konditorei gegangen.'],['Sono entrata con mia nonna.','Ich bin mit meiner Oma hineingegangen.'],['La torta è caduta!','Der Kuchen ist heruntergefallen!'],['Mia madre è arrivata con gli amici.','Meine Mutter ist mit den Freunden angekommen.'],['Siamo tornati con i pasticcini.','Wir sind mit den Törtchen zurückgekommen.']],
      reading:{ title:'La torta caduta',
        text:'Ieri io e gli amici siamo andati in pasticceria. Che profumo! Abbiamo comprato dieci pasticcini e una torta al cioccolato. Ma la torta è caduta! Siamo tornati in pasticceria per un’altra torta. Poi abbiamo mangiato tutto a casa.',
        tr:'Gestern sind meine Freunde und ich in die Konditorei gegangen. Was für ein Duft! Wir haben zehn Törtchen und einen Schokoladenkuchen gekauft. Aber der Kuchen ist heruntergefallen! Wir sind für einen anderen Kuchen in die Konditorei zurückgegangen. Dann haben wir zu Hause alles aufgegessen.',
        qs:[['Was ist mit dem Kuchen passiert?',['Er ist heruntergefallen','Er ist verbrannt','Er war ausverkauft','Er war zu süß']],['Wie viele Törtchen haben sie gekauft?',['Zehn','Zwei','Fünf','Keins']]] } },
    n11:{ title:'Voglio fare il pane', de:'Ich will Brot backen',
      words:[['voglio','ich will','verben'],['vuoi','du willst','verben'],['posso','ich kann, ich darf','verben'],['possiamo','wir können','verben'],['fare','machen','verben'],['imparare','lernen','verben'],['il pane','das Brot'],['la pizza','die Pizza'],['domani','morgen','zeit']],
      sentences:[['Voglio imparare a fare il pane.','Ich will lernen, Brot zu backen.'],['Vuoi fare la pizza domani?','Willst du morgen Pizza machen?'],['Possiamo fare la pizza con la nonna.','Wir können mit Oma Pizza machen.'],['Posso fare la torta?','Darf ich den Kuchen machen?'],['Domani non posso.','Morgen kann ich nicht.']],
      reading:{ title:'Con la nonna', dialog:true,
        text:'— Nonna, voglio imparare a fare il pane!\n— Bene! Possiamo fare il pane domani.\n— Vuoi fare la pizza domani?\n— Domani non posso fare la pizza. Sabato!\n— Posso fare la pizza con gli amici sabato?\n— Certo!',
        tr:'– Oma, ich will lernen, Brot zu backen! – Gut! Wir können morgen Brot backen. – Willst du morgen Pizza machen? – Morgen kann ich keine Pizza machen. Am Samstag! – Darf ich am Samstag mit den Freunden Pizza machen? – Natürlich!',
        qs:[['Was machen sie morgen?',['Brot backen','Pizza machen','Kuchen backen','Einkaufen']],['Wann gibt es Pizza?',['Am Samstag','Morgen','Heute','Nie']]] } },
    n12:{ title:'Il pasticciere', de:'Der Konditor',
      words:[['il pasticciere','der Konditor'],['si alza','er/sie steht auf','verben'],['mi alzo','ich stehe auf','verben'],['si lava le mani','er wäscht sich die Hände','verben'],['si mette il grembiule','er zieht die Schürze an','verben'],['si riposa','er ruht sich aus','verben'],['presto','früh','zeit'],['la notte','die Nacht, nachts','zeit']],
      sentences:[['Il pasticciere si alza presto.','Der Konditor steht früh auf.'],['Si lava le mani.','Er wäscht sich die Hände.'],['Si mette il grembiule.','Er zieht die Schürze an.'],['Io mi alzo alle nove.','Ich stehe um neun auf.'],['Alle due si riposa.','Um zwei ruht er sich aus.']],
      reading:{ title:'Marco',
        text:'Marco è pasticciere a Napoli. Si alza alle tre di notte! Si lava le mani e si mette il grembiule. Prepara i cornetti, le brioche e le torte. Alle sette la pasticceria apre. Alle due Marco si riposa. E io? Io mi alzo alle nove e mangio i cornetti di Marco!',
        tr:'Marco ist Konditor in Neapel. Er steht um drei Uhr nachts auf! Er wäscht sich die Hände und zieht die Schürze an. Er macht die Hörnchen, die Brioches und die Kuchen. Um sieben öffnet die Konditorei. Um zwei ruht sich Marco aus. Und ich? Ich stehe um neun auf und esse Marcos Hörnchen!',
        qs:[['Wann steht Marco auf?',['Um drei Uhr nachts','Um sieben','Um neun','Um zwei']],['Wann öffnet die Konditorei?',['Um sieben','Um drei','Um neun','Um zwei']]] } },
    n14:{ title:'Il matrimonio', de:'Die Hochzeit',
      words:[['mentre','während','zeit'],['il matrimonio','die Hochzeit'],['gli sposi','das Brautpaar','leute'],['tutti ballavano','alle tanzten','verben'],['all’improvviso','plötzlich','zeit'],['è crollata','ist eingestürzt','verben'],['la torta nuziale','die Hochzeitstorte'],['ridevano','lachten','verben'],['era nervosa / nervoso','war nervös','wie']],
      sentences:[['Mentre tutti ballavano, la torta è crollata!','Während alle tanzten, ist die Torte eingestürzt!'],['La torta nuziale era buona.','Die Hochzeitstorte war lecker.'],['Gli sposi ridevano.','Das Brautpaar lachte.'],['La nonna era nervosa.','Oma war nervös.'],['Al matrimonio tutti ballavano.','Auf der Hochzeit tanzten alle.']],
      reading:{ title:'La torta crollata',
        text:'Al matrimonio di Giulia c’era una torta nuziale. La torta era di mia nonna. La nonna era nervosa. Mentre tutti ballavano, la torta è crollata! Ma gli sposi ridevano. Alla fine abbiamo mangiato la torta con il cucchiaio. Era buona!',
        tr:'Auf Giulias Hochzeit gab es eine Hochzeitstorte. Die Torte war von meiner Oma. Oma war nervös. Während alle tanzten, ist die Torte eingestürzt! Aber das Brautpaar lachte. Am Ende haben wir die Torte mit dem Löffel gegessen. Sie war lecker!',
        qs:[['Was passierte, während alle tanzten?',['Die Torte stürzte ein','Die Braut fiel hin','Oma tanzte','Das Licht ging aus']],['Wie reagierte das Brautpaar?',['Es lachte','Es weinte','Es ging nach Hause','Es war wütend']]] } },
    n15:{ title:'Aprirò una pasticceria', de:'Ich werde eine Konditorei eröffnen',
      words:[['aprirò','ich werde eröffnen','verben'],['sarà','wird sein','verben'],['farò','ich werde machen','verben'],['venderemo','wir werden verkaufen','verben'],['ci saranno','es wird … geben','verben'],['il prossimo anno','nächstes Jahr','zeit'],['i clienti','die Kunden','leute'],['il nome','der Name']],
      sentences:[['Il prossimo anno aprirò una pasticceria.','Nächstes Jahr werde ich eine Konditorei eröffnen.'],['Farò i cornetti della nonna.','Ich werde Omas Hörnchen machen.'],['Venderemo il tiramisù e i biscotti.','Wir werden Tiramisu und Kekse verkaufen.'],['Ci saranno i clienti alle sette.','Um sieben werden die Kunden da sein.'],['Il nome sarà «Dolce Nonna».','Der Name wird „Dolce Nonna“ sein.']],
      reading:{ title:'Dolce Nonna',
        text:'Il prossimo anno aprirò una pasticceria a Napoli. Il nome sarà «Dolce Nonna». Farò le ricette del quaderno della nonna: i cornetti, il tiramisù, la torta al cioccolato. La mattina ci saranno il caffè e i cornetti caldi. Venderemo anche i biscotti. Sarà il mio sogno!',
        tr:'Nächstes Jahr werde ich in Neapel eine Konditorei eröffnen. Der Name wird „Dolce Nonna“ sein. Ich werde die Rezepte aus Omas Heft machen: die Hörnchen, das Tiramisu, den Schokoladenkuchen. Morgens wird es Kaffee und warme Hörnchen geben. Wir werden auch Kekse verkaufen. Das wird mein Traum sein!',
        qs:[['Wie wird die Konditorei heißen?',['Dolce Nonna','Pasticceria Napoli','Il Quaderno','Dolce Vita']],['Woher kommen die Rezepte?',['Aus Omas Rezeptheft','Aus dem Internet','Von einem Konditor','Aus einem Kochbuch']]] } },
    n16:{ title:'La ricetta segreta', de:'Das Geheimrezept',
      words:[['vorrei','ich hätte gern, ich möchte','verben'],['mi darebbe','würden Sie mir geben','verben'],['sarebbe','wäre','verben'],['mi piacerebbe','ich würde gern','verben'],['assaggiare','probieren','verben dolci'],['la ricetta segreta','das Geheimrezept'],['gentile','nett, freundlich','wie']],
      sentences:[['Vorrei assaggiare la torta.','Ich würde gern den Kuchen probieren.'],['Mi darebbe la ricetta?','Würden Sie mir das Rezept geben?'],['Sarebbe gentile!','Das wäre nett!'],['Mi piacerebbe fare la torta della nonna.','Ich würde gern Omas Kuchen machen.'],['È una ricetta segreta.','Das ist ein Geheimrezept.']],
      reading:{ title:'Peccato!', dialog:true,
        text:'— Buongiorno! Vorrei assaggiare la torta al cioccolato.\n— Ecco! È buona?\n— Buonissima! Mi darebbe la ricetta? Sarebbe gentile.\n— Mi dispiace, è una ricetta segreta della nonna.\n— Peccato! Allora vorrei tre fette, per favore!',
        tr:'– Guten Morgen! Ich würde gern den Schokoladenkuchen probieren. – Bitte sehr! Ist er gut? – Superlecker! Würden Sie mir das Rezept geben? Das wäre nett. – Tut mir leid, das ist ein Geheimrezept der Oma. – Schade! Dann hätte ich gern drei Stück, bitte!',
        qs:[['Bekommt die Person das Rezept?',['Nein, es ist ein Geheimrezept','Ja, sofort','Ja, morgen','Nur gegen Geld']],['Was kauft die Person am Ende?',['Drei Stück Kuchen','Den ganzen Kuchen','Nichts','Kekse']]] } }

  brividi:{
    n3:{ title:'Quanti fantasmi?', de:'Wie viele Gespenster?',
      words:[...NUMS,['i fantasmi','die Gespenster'],['le zucche','die Kürbisse'],['le caramelle','die Bonbons'],['la finestra','das Fenster']],
      sentences:[['Ci sono tre fantasmi!','Da sind drei Gespenster!'],['Nella casa stregata c’è un ragno.','Im Spukhaus ist eine Spinne.'],['Ci sono sette zucche.','Es gibt sieben Kürbisse.'],['C’è un pipistrello alla finestra.','Am Fenster ist eine Fledermaus.'],['Ecco dieci caramelle!','Hier sind zehn Bonbons!']],
      reading:{ title:'La casa stregata',
        text:'Buonasera! Questa è la casa stregata. Alla finestra c’è una zucca. Nella casa ci sono tre fantasmi, due streghe e otto pipistrelli. C’è anche un ragno. E per i bambini ci sono dieci caramelle!',
        tr:'Guten Abend! Das ist das Spukhaus. Am Fenster ist ein Kürbis. Im Haus gibt es drei Gespenster, zwei Hexen und acht Fledermäuse. Da ist auch eine Spinne. Und für die Kinder gibt es zehn Bonbons!',
        qs:[['Wie viele Gespenster sind im Haus?',['Drei','Zwei','Acht','Zehn']],['Was ist am Fenster?',['Ein Kürbis','Eine Fledermaus','Eine Spinne','Eine Hexe']]] } },
    n4:{ title:'Chi c’è?', de:'Wer ist da?',
      words:[['Chi c’è?','Wer ist da?','fragen'],['Che cos’è?','Was ist das?','fragen'],['dove / dov’è','wo / wo ist','fragen'],['quando','wann','fragen'],['perché','warum, weil','fragen'],['il rumore','das Geräusch'],['la porta','die Tür'],['la cantina','der Keller']],
      sentences:[['Chi c’è alla porta?','Wer ist an der Tür?'],['Che cos’è? Un rumore!','Was ist das? Ein Geräusch!'],['Dov’è la cantina?','Wo ist der Keller?'],['Chi c’è in cantina?','Wer ist im Keller?'],['Dov’è il fantasma?','Wo ist das Gespenst?']],
      reading:{ title:'Il rumore in cantina', dialog:true,
        text:'— Chi c’è?\n— Sono io, Luca!\n— Luca, dov’è la cantina?\n— La cantina? Perché?\n— C’è un rumore strano nella cantina!\n— Che cos’è? Un fantasma?\n— No… è un gatto!',
        tr:'– Wer ist da? – Ich bin’s, Luca! – Luca, wo ist der Keller? – Der Keller? Warum? – Im Keller ist ein seltsames Geräusch! – Was ist das? Ein Gespenst? – Nein … es ist eine Katze!',
        qs:[['Wo ist das Geräusch?',['Im Keller','An der Tür','Am Fenster','Im Garten']],['Was macht das Geräusch?',['Eine Katze','Ein Gespenst','Luca','Eine Fledermaus']]] } },
    n7:{ title:'Non dormo!', de:'Ich schlafe nicht!',
      words:[['dormo','ich schlafe','verben'],['dormi','du schläfst','verben'],['sento','ich höre','verben'],['vedo','ich sehe','verben'],['apro','ich öffne','verben'],['non','nicht'],['nessuno','niemand'],['la luce','das Licht'],['il letto','das Bett']],
      sentences:[['Non dormo, ho paura!','Ich schlafe nicht, ich habe Angst!'],['Sento un rumore.','Ich höre ein Geräusch.'],['Apro la porta, ma non vedo nessuno.','Ich öffne die Tür, aber ich sehe niemanden.'],['La luce non c’è!','Es gibt kein Licht!'],['Dormi, Luca?','Schläfst du, Luca?']],
      reading:{ title:'Mezzanotte',
        text:'È mezzanotte. Io non dormo. Sento un rumore alla porta. Apro la porta, ma non vedo nessuno. Nel buio c’è solo il mio letto. Poi sento un altro rumore: sotto il letto! Ho paura… Ma sotto il letto c’è il mio gatto. Buonanotte, gatto!',
        tr:'Es ist Mitternacht. Ich schlafe nicht. Ich höre ein Geräusch an der Tür. Ich öffne die Tür, aber ich sehe niemanden. In der Dunkelheit ist nur mein Bett. Dann höre ich noch ein Geräusch: unter dem Bett! Ich habe Angst … Aber unter dem Bett ist mein Kater. Gute Nacht, Kater!',
        qs:[['Wo ist das zweite Geräusch?',['Unter dem Bett','An der Tür','Am Fenster','Im Keller']],['Wer macht das Geräusch?',['Der Kater','Ein Gespenst','Luca','Ein Vampir']]] } },
    n8:{ title:'Dietro il quadro', de:'Hinter dem Bild',
      words:[['sopra','auf, über','orte'],['sotto','unter','orte'],['dietro','hinter','orte'],['davanti a','vor','orte'],['accanto a','neben','orte'],['il quadro','das Bild'],['le scale','die Treppe'],['la bara','der Sarg']],
      sentences:[['Il ragno è sopra la porta.','Die Spinne ist über der Tür.'],['Il vampiro è nella bara.','Der Vampir ist im Sarg.'],['Dietro il quadro c’è una porta.','Hinter dem Bild ist eine Tür.'],['Sotto le scale c’è la cantina.','Unter der Treppe ist der Keller.'],['La strega è accanto alla zucca.','Die Hexe ist neben dem Kürbis.']],
      reading:{ title:'La porta segreta',
        text:'Nella casa stregata c’è un quadro. Dietro il quadro c’è una porta. Apro la porta: ci sono le scale. Sotto le scale c’è una bara. Nella bara c’è un vampiro! Ma il vampiro dorme. Accanto alla bara ci sono tre pipistrelli. Buonanotte, vampiro!',
        tr:'Im Spukhaus hängt ein Bild. Hinter dem Bild ist eine Tür. Ich öffne die Tür: Da ist eine Treppe. Unter der Treppe steht ein Sarg. Im Sarg liegt ein Vampir! Aber der Vampir schläft. Neben dem Sarg sind drei Fledermäuse. Gute Nacht, Vampir!',
        qs:[['Was ist hinter dem Bild?',['Eine Tür','Ein Sarg','Eine Treppe','Eine Spinne']],['Was macht der Vampir?',['Er schläft','Er fliegt','Er isst','Er lacht']]] } },
    n10:{ title:'La festa di Halloween', de:'Die Halloween-Party',
      words:[['sono andato / andata','ich bin gegangen','verben'],['siamo arrivati','wir sind angekommen','verben'],['è venuto / venuta','ist gekommen','verben'],['sono rimasto / rimasta','ich bin geblieben','verben'],['la festa','die Party'],['ieri sera','gestern Abend','zeit'],['vestito da','verkleidet als'],['tutta la notte','die ganze Nacht','zeit']],
      sentences:[['Ieri sera sono andata a una festa.','Gestern Abend bin ich auf eine Party gegangen.'],['Siamo arrivati a mezzanotte.','Wir sind um Mitternacht angekommen.'],['Luca è venuto vestito da vampiro.','Luca ist als Vampir verkleidet gekommen.'],['Sono rimasta tutta la notte.','Ich bin die ganze Nacht geblieben.'],['Una strega è venuta alla festa.','Eine Hexe ist zur Party gekommen.']],
      reading:{ title:'Chi era la strega?',
        text:'Ieri sera sono andata alla festa di Halloween di Luca. Luca è venuto vestito da vampiro. Siamo arrivati alle nove. A mezzanotte è venuta una strega enorme! Abbiamo urlato. Ma la strega era la nonna di Luca! Sono rimasta alla festa tutta la notte.',
        tr:'Gestern Abend bin ich zu Lucas Halloween-Party gegangen. Luca ist als Vampir verkleidet gekommen. Wir sind um neun angekommen. Um Mitternacht ist eine riesige Hexe gekommen! Wir haben geschrien. Aber die Hexe war Lucas Oma! Ich bin die ganze Nacht auf der Party geblieben.',
        qs:[['Als was war Luca verkleidet?',['Als Vampir','Als Hexe','Als Gespenst','Als Kürbis']],['Wer war die riesige Hexe?',['Lucas Oma','Luca','Die Erzählerin','Ein Gespenst']]] } },
    n11:{ title:'Vuoi vedere un film horror?', de:'Willst du einen Horrorfilm sehen?',
      words:[['voglio','ich will','verben'],['vuoi','du willst','verben'],['posso','ich kann, ich darf','verben'],['vedere','sehen','verben'],['dormire','schlafen','verben'],['stanotte','heute Nacht','zeit'],['da solo / da sola','allein']],
      sentences:[['Vuoi vedere un film horror?','Willst du einen Horrorfilm sehen?'],['Non posso dormire da sola!','Ich kann nicht allein schlafen!'],['Voglio vedere il film stanotte.','Ich will den Film heute Nacht sehen.'],['Posso dormire da te?','Darf ich bei dir schlafen?'],['Stanotte non voglio dormire.','Heute Nacht will ich nicht schlafen.']],
      reading:{ title:'La casa del vampiro', dialog:true,
        text:'— Luca, vuoi vedere un film horror stanotte?\n— Voglio vedere «La casa del vampiro»!\n— Posso dormire da te? Non posso dormire da sola!\n— Ma io ho paura…\n— Allora non vediamo il film!',
        tr:'– Luca, willst du heute Nacht einen Horrorfilm sehen? – Ich will „Das Haus des Vampirs“ sehen! – Darf ich bei dir schlafen? Ich kann nicht allein schlafen! – Aber ich habe Angst … – Dann schauen wir den Film eben nicht!',
        qs:[['Welchen Film will Luca sehen?',['La casa del vampiro','Il castello','La strega','Halloween']],['Wie geht es aus?',['Sie schauen den Film nicht','Sie schauen zwei Filme','Luca schläft ein','Sie gehen ins Kino']]] } },
    n12:{ title:'La giornata del vampiro', de:'Der Tag des Vampirs',
      words:[['si sveglia','er/sie wacht auf','verben'],['mi sveglio','ich wache auf','verben'],['si pettina','er kämmt sich','verben'],['si guarda allo specchio','er schaut sich im Spiegel an','verben'],['si nasconde','er versteckt sich','verben'],['il tramonto','der Sonnenuntergang','zeit'],['l’alba','die Morgendämmerung','zeit'],['la mattina','am Morgen','zeit']],
      sentences:[['Il vampiro si sveglia al tramonto.','Der Vampir wacht bei Sonnenuntergang auf.'],['Si pettina nel buio.','Er kämmt sich im Dunkeln.'],['Si guarda allo specchio.','Er schaut sich im Spiegel an.'],['All’alba si nasconde nella bara.','In der Morgendämmerung versteckt er sich im Sarg.'],['Io mi sveglio la mattina.','Ich wache am Morgen auf.']],
      reading:{ title:'Vlad',
        text:'Vlad è un vampiro. Si sveglia al tramonto. Si pettina e si guarda allo specchio, ma nello specchio non c’è nessuno! A mezzanotte vola sulla casa stregata. All’alba si nasconde nella bara. E io? Io mi sveglio la mattina. Buonanotte, Vlad!',
        tr:'Vlad ist ein Vampir. Er wacht bei Sonnenuntergang auf. Er kämmt sich und schaut sich im Spiegel an, aber im Spiegel ist niemand! Um Mitternacht fliegt er über das Spukhaus. In der Morgendämmerung versteckt er sich im Sarg. Und ich? Ich wache am Morgen auf. Gute Nacht, Vlad!',
        qs:[['Wann wacht Vlad auf?',['Bei Sonnenuntergang','Am Morgen','Um Mitternacht','Mittags']],['Was sieht Vlad im Spiegel?',['Niemanden','Sich selbst','Eine Hexe','Luca']]] } },
    n14:{ title:'Il faro', de:'Der Leuchtturm',
      words:[['mentre','während','zeit'],['il faro','der Leuchtturm'],['il guardiano','der Wärter','leute'],['il mare','das Meer'],['c’era la nebbia','es war neblig'],['all’improvviso','plötzlich','zeit'],['si è spenta','ist ausgegangen','verben'],['è sparito','ist verschwunden','verben']],
      sentences:[['Mentre c’era la nebbia, il guardiano era nel faro.','Während es neblig war, war der Wärter im Leuchtturm.'],['All’improvviso la luce si è spenta.','Plötzlich ist das Licht ausgegangen.'],['Il guardiano è sparito.','Der Wärter ist verschwunden.'],['Il mare era buio e freddo.','Das Meer war dunkel und kalt.'],['Tutti dicevano che il faro era maledetto.','Alle sagten, dass der Leuchtturm verflucht sei.']],
      reading:{ title:'La luce del faro',
        text:'Da bambini passavamo le vacanze al mare. Sul mare c’era un vecchio faro. Tutti dicevano che era maledetto. Una sera c’era la nebbia e faceva freddo. Mentre guardavamo il faro, all’improvviso la luce si è spenta! E il guardiano? È sparito. Nessuno sa dov’è… ma a mezzanotte la luce del faro si accende da sola.',
        tr:'Als Kinder verbrachten wir die Ferien am Meer. Am Meer stand ein alter Leuchtturm. Alle sagten, er sei verflucht. Eines Abends war es neblig und kalt. Während wir den Leuchtturm anschauten, ging plötzlich das Licht aus! Und der Wärter? Er ist verschwunden. Niemand weiß, wo er ist … aber um Mitternacht geht das Licht des Leuchtturms von selbst an.',
        qs:[['Was sagten alle über den Leuchtturm?',['Dass er verflucht sei','Dass er neu sei','Dass er verkauft wird','Dass ein Vampir dort wohnt']],['Was passiert um Mitternacht?',['Das Licht geht von selbst an','Der Wärter kommt zurück','Es wird neblig','Nichts']]] } },
    n15:{ title:'Il prossimo Halloween', de:'Nächstes Halloween',
      words:[['sarà','wird sein','verben'],['andremo','wir werden gehen','verben'],['porterò','ich werde mitbringen','verben'],['avremo paura','wir werden Angst haben','verben'],['ci saranno','es wird … geben','verben'],['il prossimo Halloween','nächstes Halloween','zeit brividi'],['il costume','das Kostüm'],['la torcia','die Taschenlampe']],
      sentences:[['Il prossimo Halloween andremo nel castello.','Nächstes Halloween werden wir in die Burg gehen.'],['Porterò una torcia.','Ich werde eine Taschenlampe mitbringen.'],['Il mio costume sarà da strega.','Mein Kostüm wird ein Hexenkostüm sein.'],['Ci saranno i fantasmi?','Wird es die Gespenster geben?'],['Avremo paura!','Wir werden Angst haben!']],
      reading:{ title:'Il piano',
        text:'Il prossimo Halloween io e Luca andremo nel castello maledetto. Io porterò una torcia e le caramelle. Il mio costume sarà da strega, Luca sarà un vampiro. A mezzanotte ci saranno i fantasmi? Forse. Avremo paura? Certo!',
        tr:'Nächstes Halloween werden Luca und ich in die verfluchte Burg gehen. Ich werde eine Taschenlampe und die Bonbons mitbringen. Mein Kostüm wird ein Hexenkostüm sein, Luca wird ein Vampir sein. Wird es um Mitternacht Gespenster geben? Vielleicht. Werden wir Angst haben? Natürlich!',

        qs:[['Wo muss man links abbiegen?',['An der Ampel','An der Kreuzung','Nach der Brücke','Gar nicht']],['Wo ist das Museum?',['Auf dem Platz, gegenüber der Kirche','Neben dem Bahnhof','Vor der Brücke','Weit weg']]] } },
