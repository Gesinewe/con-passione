    words:[['la tenda','das Zelt'],['il papà','der Papa'],['la torcia','die Taschenlampe'],['la mano','die Hand'],['ride','lacht'],['prende','nimmt']],
    text:'È notte. Luca, Giulia e il papà sono in tenda nel bosco. La luna è piena. Fuori è buio e accanto alla tenda c’è un albero enorme.\nGiulia: Luca, dormi?\nLuca: No. Non dormo mai nel bosco.\nGiulia: Sento un rumore… Chi corre nel bosco?\nLuca: È un gatto.\nAuuuu! Un lupo ulula nel bosco.\nGiulia: Un gatto? Quello non è un gatto! È un lupo!\nLuca: O un lupo mannaro… La luna è piena.\nPoi sulla tenda c’è un’ombra: un’ombra enorme con una mano grande. La mano bussa sulla tenda. Toc. Toc.\nGiulia: Aiuto! Papà! Papà!\nMa il papà non è nella tenda. Luca prende la torcia. La luce è piccola e il bosco è grande.\nLuca: Papà? Dove sei?\nL’ombra entra nella tenda… È il papà! Il papà ride.\nPapà: Buuu! Scherzetto! Io sono il lupo mannaro!\nGiulia: Papà! Che paura!\nLuca: E il lupo? Il lupo che ulula?\nPapà: Quale lupo?\nAuuuu! Il lupo ulula ancora. È qui vicino. È molto vicino.\nPapà: Bambini… quello non sono io.',
    tr:'Es ist Nacht. Luca, Giulia und Papa sind im Zelt im Wald. Es ist Vollmond. Draußen ist es dunkel, und neben dem Zelt steht ein riesiger Baum.\nGiulia: Luca, schläfst du?\nLuca: Nein. Im Wald schlafe ich nie.\nGiulia: Ich höre ein Geräusch … Wer rennt da im Wald?\nLuca: Das ist eine Katze.\nAuuuu! Ein Wolf heult im Wald.\nGiulia: Eine Katze? Das ist keine Katze! Das ist ein Wolf!\nLuca: Oder ein Werwolf … Es ist Vollmond.\nDann ist auf dem Zelt ein Schatten: ein riesiger Schatten mit einer großen Hand. Die Hand klopft auf das Zelt. Klopf. Klopf.\nGiulia: Hilfe! Papa! Papa!\nAber Papa ist nicht im Zelt. Luca nimmt die Taschenlampe. Das Licht ist klein und der Wald ist groß.\nLuca: Papa? Wo bist du?\nDer Schatten kommt ins Zelt … Es ist Papa! Papa lacht.\nPapa: Buuu! Reingelegt! Ich bin der Werwolf!\nGiulia: Papa! So ein Schreck!\nLuca: Und der Wolf? Der Wolf, der heult?\nPapa: Welcher Wolf?\nAuuuu! Der Wolf heult noch einmal. Er ist hier in der Nähe. Er ist sehr nah.\nPapa: Kinder … das bin nicht ich.',
    qs:[['Wo sind Luca, Giulia und Papa?',['Im Zelt im Wald','In einer alten Burg','Im Auto','Auf dem Friedhof']],
        ['Was klopft auf das Zelt?',['Eine große Hand – es ist Papa','Ein Ast','Ein Wolf','Giulia']],
        ['Was nimmt Luca, um Papa zu suchen?',['Die Taschenlampe','Eine Kerze','Einen Stock','Sein Handy']],
        ['Wie endet die Geschichte?',['Der Wolf heult ganz nah, und es ist nicht Papa','Alle schlafen friedlich ein','Papa fängt den Wolf','Die Familie fährt nach Hause']]],
    tf:[['Es ist Vollmond.',true],['Papa liegt die ganze Zeit im Zelt.',false],['Papa spielt den Kindern einen Streich.',true],['Am Ende gibt Papa zu, dass er auch der heulende Wolf war.',false]] },

  { at:'brividi-v3-3', kind:'Alltag · Witzig', title:'Serata horror', de:'Horrorabend',
    voices:{Luca:'Diego', Marta:'Elsa', Voce:'Giuseppe', Fattorino:'Giuseppe'}, names:['Marta'],
    words:[['la pizza / le pizze','die Pizza / die Pizzas'],['il telefono','das Telefon'],['ha squillato','hat geklingelt'],['pronto?','hallo? (am Telefon)'],['la voce','die Stimme'],['la corrente','der Strom'],['si è spenta','ist ausgegangen'],['ho preso','ich habe genommen'],['il fattorino','der Lieferbote'],['ho ordinato','ich habe bestellt'],['finalmente','endlich']],
    text:'Ieri sera io e Marta abbiamo guardato un film horror sul divano. Il film è «La casa stregata». Fuori è buio.\nA mezzanotte, nel film, Marco è entrato in una casa vecchia. Nella casa ha sentito un rumore strano. E all’improvviso… la luce si è spenta! Tutta la casa è buia.\nMarta: Luca! Che cos’è?\nLuca: Non so! Non c’è la corrente!\nPoi il mio telefono ha squillato.\nLuca: Pronto?\nVoce: Sono davanti alla porta… Apri la porta!\nHo chiuso il telefono. Marta ha urlato.\nMarta: Chi è? Chi c’è davanti alla porta?\nLuca: Non so! Dobbiamo chiamare la polizia!\nToc, toc, toc! Io ho preso una candela. Marta ha preso… un cuscino.\nVoce: Apri! Sono qui da venti minuti!\nHo aperto la porta. Davanti alla porta c’è il fattorino con due pizze.\nFattorino: Buonasera! Le pizze! Finalmente!\nMarta: Luca… le pizze sono per te?\nLuca: Sì! Sono per noi! Ho ordinato le pizze prima del film!\nPoi abbiamo mangiato le pizze al buio, con una candela. E il film? Lo abbiamo visto la mattina dopo.',
    tr:'Gestern Abend haben Marta und ich auf dem Sofa einen Horrorfilm geschaut. Der Film ist „Das Spukhaus“. Draußen ist es dunkel.\nUm Mitternacht ist Marco im Film in ein altes Haus gegangen. Im Haus hat er ein seltsames Geräusch gehört. Und plötzlich … ist das Licht ausgegangen! Das ganze Haus ist dunkel.\nMarta: Luca! Was ist das?\nLuca: Ich weiß nicht! Wir haben keinen Strom!\nDann hat mein Telefon geklingelt.\nLuca: Hallo?\nStimme: Ich stehe vor der Tür … Mach die Tür auf!\nIch habe aufgelegt. Marta hat geschrien.\nMarta: Wer ist das? Wer steht vor der Tür?\nLuca: Ich weiß nicht! Wir müssen die Polizei rufen!\nKlopf, klopf, klopf! Ich habe eine Kerze genommen. Marta hat … ein Kissen genommen.\nStimme: Mach auf! Ich stehe seit zwanzig Minuten hier!\nIch habe die Tür aufgemacht. Vor der Tür steht der Lieferbote mit zwei Pizzas.\nLieferbote: Guten Abend! Die Pizzas! Endlich!\nMarta: Luca … sind die Pizzas für dich?\nLuca: Ja! Die sind für uns! Ich habe die Pizzas vor dem Film bestellt!\nDann haben wir die Pizzas im Dunkeln gegessen, mit einer Kerze. Und der Film? Den haben wir am nächsten Morgen geschaut.',
    qs:[['Wie heißt der Film?',['„Das Spukhaus“','„Der Werwolf“','„Die Nacht der Zombies“','„Das Monster im Keller“']],
        ['Was passiert genau in der spannendsten Filmszene?',['Der Strom fällt aus','Das Telefon fällt herunter','Marta schläft ein','Die Pizza kommt']],
        ['Womit „bewaffnet“ sich Marta?',['Mit einem Kissen','Mit einer Kerze','Mit dem Telefon','Mit einem Messer']],
        ['Wer steht vor der Tür?',['Der Pizzabote','Die Polizei','Ein Nachbar','Ein Gespenst']]],
    tf:[['Luca hat die Pizzas vor dem Film bestellt.',true],['Luca ruft wirklich die Polizei.',false],['Der Bote wartet schon zwanzig Minuten.',true],['Sie schauen den Film noch in derselben Nacht zu Ende.',false]] },

  { at:'brividi-v3-4', kind:'Hörstück · Witzig', title:'Quattro messaggi', de:'Vier Nachrichten', dialog:true,
    voices:{Giulia:'Elsa'}, names:['Marco','Nerone'],
    words:[['il messaggio','die Nachricht'],['le ore','Uhr (bei der Uhrzeit)'],['vieni?','kommst du?'],['il bagno','das Bad'],['la tenda della doccia','der Duschvorhang'],['il cellulare','das Handy'],['la batteria','der Akku'],['per fortuna','zum Glück']],
    text:'Messaggio 1. Ore 23 e 10.\nGiulia: Ciao Luca, sono Giulia! Sono alla festa di Halloween da Marco. Mi piace la festa! C’è la musica, ci sono i dolci e io ballo! Ho un vestito da strega. Dove sei? Vieni?\nMessaggio 2. Ore 23 e 40.\nGiulia: Luca, sono ancora io. Sono andata in bagno e adesso non posso aprire la porta! Ho urlato, ma c’è la musica. Nessuno mi sente. E nel bagno c’è buio… Devi chiamare Marco!\nMessaggio 3. Ore 23 e 55.\nGiulia: Luca! Aiuto! Nel bagno non sono sola! Ho sentito un rumore dietro la tenda della doccia. Ho visto un’ombra! Ho paura! La batteria del cellulare è quasi… Luca, vieni! Subito!\nMessaggio 4. Ore 0 e 5.\nGiulia: Ehm… Luca? Sono ancora io. Tutto bene. Dietro la tenda c’è Nerone, il gatto di Marco. E la porta del bagno? Per fortuna Marco è venuto in bagno e ha aperto la porta… da fuori. Adesso ballo con Nerone. Ciao!',
    tr:'Nachricht 1. 23:10 Uhr.\nGiulia: Hallo Luca, ich bin’s, Giulia! Ich bin auf der Halloweenparty bei Marco. Die Party gefällt mir! Es gibt Musik, es gibt Süßes, und ich tanze! Ich habe ein Hexenkostüm an. Wo bist du? Kommst du?\nNachricht 2. 23:40 Uhr.\nGiulia: Luca, ich bin’s noch mal. Ich bin ins Bad gegangen, und jetzt kann ich die Tür nicht aufmachen! Ich habe geschrien, aber die Musik läuft. Niemand hört mich. Und im Bad ist es dunkel … Du musst Marco anrufen!\nNachricht 3. 23:55 Uhr.\nGiulia: Luca! Hilfe! Ich bin nicht allein im Bad! Ich habe hinter dem Duschvorhang ein Geräusch gehört. Ich habe einen Schatten gesehen! Ich habe Angst! Der Akku vom Handy ist fast … Luca, komm! Sofort!\nNachricht 4. 0:05 Uhr.\nGiulia: Ähm … Luca? Ich bin’s noch mal. Alles gut. Hinter dem Vorhang ist Nerone, Marcos Kater. Und die Badezimmertür? Zum Glück ist Marco ins Bad gekommen und hat die Tür aufgemacht … von draußen. Jetzt tanze ich mit Nerone. Tschüss!',
    qs:[['Als was ist Giulia verkleidet?',['Als Hexe','Als Vampir','Als Gespenst','Als Katze']],
        ['Warum hört niemand Giulia rufen?',['Wegen der Musik','Alle sind schon gegangen','Sie hat keine Stimme mehr','Das Bad ist im Keller']],
        ['Was war hinter dem Duschvorhang?',['Marcos Kater Nerone','Ein Einbrecher','Marco','Eine Spinne']],
        ['Wie kommt Giulia aus dem Bad?',['Marco öffnet die Tür von draußen','Sie klettert aus dem Fenster','Luca kommt und hilft','Die Polizei öffnet']]],
    tf:[['Die erste Nachricht kommt um 23:10 Uhr.',true],['Im Bad ist das Licht an.',false],['Giulias Handy-Akku ist fast leer.',true],['Am Ende geht Giulia sofort nach Hause.',false]] },

  { at:'brividi-v3-4', kind:'Witzig · Alltag', title:'Lo zombie sull’autobus', de:'Der Zombie im Bus',
    voices:{Luca:'Diego', Signora:'Elsa', Autista:'Giuseppe'}, names:['Marta'],
    words:[['l’autobus','der Bus'],['il signore / la signora','der Herr / die Dame'],['l’autista','der Fahrer, die Fahrerin'],['il sangue','das Blut'],['brutto','hässlich'],['perfetto','perfekt'],['il nipote','der Enkel'],['si lava','wäscht sich'],['la fermata','die Haltestelle'],['il biglietto','die Fahrkarte']],
    text:'Ieri sera sono andato alla festa di Halloween di Marta. A Halloween mi travesto sempre da zombie: la faccia verde e il sangue rosso. Sono molto brutto. Perfetto!\nAlle nove sono salito sull’autobus. L’autista mi ha guardato.\nAutista: Buonasera… zombie.\nNell’autobus c’è solo una signora vecchia con un gatto nero. Sono andato accanto a lei.\nSignora: Buonasera! Stai bene? Hai la faccia verde!\nLuca: Sì, sì, bene, grazie. Sono uno zombie.\nSignora: Uno zombie! Anche mio nipote è uno zombie. Non si lava mai la faccia!\nPoi la signora ha una caramella per me.\nSignora: Vuoi una caramella?\nLuca: Sì, grazie! Mi piacciono i dolci.\nAlla fermata è salito un signore. Mi ha visto e ha urlato. Poi è scappato dall’autobus.\nSignora: Ha paura! Il tuo trucco spaventa!\nAlla fermata della festa sono uscito dall’autobus. Ma l’autista mi ha chiamato.\nAutista: Ehi, zombie! E il biglietto? Anche gli zombie pagano il biglietto!',
    tr:'Gestern Abend bin ich zu Martas Halloweenparty gegangen. An Halloween verkleide ich mich immer als Zombie: das Gesicht grün und das Blut rot. Ich bin sehr hässlich. Perfekt!\nUm neun bin ich in den Bus gestiegen. Der Fahrer hat mich angeschaut.\nFahrer: Guten Abend … Zombie.\nIm Bus ist nur eine alte Dame mit einer schwarzen Katze. Ich bin zu ihr gegangen.\nDame: Guten Abend! Geht’s dir gut? Du hast ein grünes Gesicht!\nLuca: Ja, ja, gut, danke. Ich bin ein Zombie.\nDame: Ein Zombie! Mein Enkel ist auch ein Zombie. Er wäscht sich nie das Gesicht!\nDann hat die Dame ein Bonbon für mich.\nDame: Möchtest du ein Bonbon?\nLuca: Ja, danke! Ich mag Süßes.\nAn der Haltestelle ist ein Herr eingestiegen. Er hat mich gesehen und geschrien. Dann ist er aus dem Bus geflüchtet.\nDame: Er hat Angst! Dein Make-up macht Angst!\nAn der Haltestelle der Party bin ich aus dem Bus gestiegen. Aber der Fahrer hat mich gerufen.\nFahrer: He, Zombie! Und die Fahrkarte? Auch Zombies zahlen die Fahrkarte!',
    qs:[['Als was verkleidet sich Luca an Halloween?',['Immer als Zombie','Als Vampir','Als Gespenst','Jedes Jahr anders']],
        ['Wer sitzt im Bus, als Luca einsteigt?',['Eine alte Dame mit einer schwarzen Katze','Viele Kinder','Marta','Niemand']],
        ['Was sagt die Dame über ihren Enkel?',['Er ist auch ein „Zombie“ – er wäscht sich nie das Gesicht','Er ist Busfahrer','Er hat Angst vor Zombies','Er feiert auch bei Marta']],
        ['Was will der Fahrer am Ende?',['Dass Luca eine Fahrkarte zahlt','Ein Foto mit Luca','Dass Luca aussteigt','Ein Bonbon']]],
    tf:[['Die alte Dame hat überhaupt keine Angst.',true],['Ein Herr steigt ein, schreit und flüchtet aus dem Bus.',true],['Luca mag keine Süßigkeiten.',false],['Der Fahrer lässt Luca umsonst fahren.',false]] },

  { at:'brividi-v4-2', kind:'Spannend', title:'Il treno di mezzanotte', de:'Der Mitternachtszug',
    voices:{Uomo:'Giuseppe', Luca:'Diego', Controllore:'Diego'}, names:['San','Lorenzo'],
    words:[['il treno','der Zug'],['la stazione','der Bahnhof'],['l’uomo','der Mann'],['il cappello','der Hut'],['il vagone','der Waggon'],['cento anni fa','vor hundert Jahren'],['va','fährt, geht'],['la moglie','die Ehefrau'],['il controllore','der Schaffner'],['il giornale','die Zeitung'],['la foto','das Foto']],
    text:'Dopo la festa, Luca era sul treno di mezzanotte. Nel vagone non c’era nessuno. Fuori c’era la nebbia. Luca aveva un libro, ma non leggeva.\nA una piccola stazione è salito un uomo. Era vecchio, aveva un cappello nero e un vestito molto vecchio, come nei film di cento anni fa. L’uomo era davanti a Luca. Aveva la faccia bianca, bianca come un fantasma.\nUomo: Buonasera. Scusa, il treno va a San Lorenzo?\nLuca: San Lorenzo? Non so dov’è San Lorenzo.\nUomo: È la mia stazione. Ogni notte sono sul treno per San Lorenzo. Mia moglie è là.\nPoi l’uomo guardava la nebbia e non parlava più.\nAll’improvviso la luce nel vagone si è spenta. Quando Luca ha acceso la torcia, l’uomo non c’era più. Era sparito. Davanti a Luca c’era solo il cappello nero.\nLuca è andato dal controllore.\nLuca: Scusa, un uomo vecchio con un cappello… è uscito dal treno?\nControllore: Un uomo? Sul treno ci sei solo tu.\nLuca: Ma ecco il suo cappello!\nIl controllore ha guardato il cappello ed è diventato bianco.\nControllore: San Lorenzo… Era una stazione sul lago. Una notte, cento anni fa, c’era la nebbia. Un treno è caduto nel lago. Il treno non è mai arrivato a San Lorenzo.\nNel giornale vecchio del controllore c’era una foto: un uomo con un cappello nero. Era l’uomo del treno.',
    tr:'Nach der Party saß Luca im Mitternachtszug. Im Waggon war niemand. Draußen war Nebel. Luca hatte ein Buch, aber er las nicht.\nAn einem kleinen Bahnhof ist ein Mann eingestiegen. Er war alt, hatte einen schwarzen Hut und einen sehr alten Anzug, wie in den Filmen von vor hundert Jahren. Der Mann saß Luca gegenüber. Er hatte ein weißes Gesicht, weiß wie ein Gespenst.\nMann: Guten Abend. Entschuldigung, fährt der Zug nach San Lorenzo?\nLuca: San Lorenzo? Ich weiß nicht, wo San Lorenzo ist.\nMann: Das ist mein Bahnhof. Jede Nacht sitze ich im Zug nach San Lorenzo. Meine Frau ist dort.\nDann schaute der Mann in den Nebel und sprach nicht mehr.\nPlötzlich ist das Licht im Waggon ausgegangen. Als Luca die Taschenlampe angemacht hat, war der Mann nicht mehr da. Er war verschwunden. Vor Luca lag nur der schwarze Hut.\nLuca ist zum Schaffner gegangen.\nLuca: Entschuldigung, ein alter Mann mit einem Hut … ist er aus dem Zug gestiegen?\nSchaffner: Ein Mann? Im Zug bist nur du.\nLuca: Aber hier ist sein Hut!\nDer Schaffner hat den Hut angeschaut und ist blass geworden.\nSchaffner: San Lorenzo … Das war ein Bahnhof am See. In einer Nacht vor hundert Jahren war Nebel. Ein Zug ist in den See gestürzt. Der Zug ist nie in San Lorenzo angekommen.\nIn der alten Zeitung des Schaffners war ein Foto: ein Mann mit einem schwarzen Hut. Es war der Mann aus dem Zug.',
    qs:[['Wie war das Wetter draußen?',['Neblig','Sonnig','Es schneite','Es gab ein Gewitter']],
        ['Wie sieht der alte Mann aus?',['Schwarzer Hut, sehr alter Anzug, weißes Gesicht','Rote Jacke und Brille','Jung und fröhlich','Wie ein Schaffner']],
        ['Was liegt auf dem Platz, als Luca die Taschenlampe anmacht?',['Der schwarze Hut','Ein Buch','Eine Fahrkarte','Nichts']],
        ['Was ist vor hundert Jahren passiert?',['Ein Zug ist in den See gestürzt','Der Bahnhof ist abgebrannt','Der Mann hat im Lotto gewonnen','Ein Zug ist nie abgefahren']]],
    tf:[['Im Waggon war am Anfang niemand.',true],['Luca kennt San Lorenzo gut.',false],['Laut Schaffner ist Luca allein im Zug.',true],['Auf dem alten Foto ist eine Frau mit Hut.',false]] },

  { at:'brividi-v4-3', kind:'Spannend', title:'Camera tredici', de:'Zimmer dreizehn',
    voices:{Luca:'Diego', Uomo:'Giuseppe', Ragazza:'Elsa'},
    words:[['l’albergo','das Hotel'],['l’uomo','der Mann'],['la camera','das (Hotel-)Zimmer'],['il corridoio','der Flur'],['l’acqua','das Wasser'],['piangeva','weinte'],['bagnato / bagnata / bagnati','nass'],['la bambola','die Puppe'],['la mamma','die Mama'],['la reception','die Rezeption']],
    text:'Per le vacanze sono andato in un piccolo albergo sul lago. L’albergo era vecchio e grande. La mia camera era la dodici.\nLa prima notte pioveva. C’era un temporale e io non dormivo. Leggevo un libro a letto. A mezzanotte qualcuno ha bussato alla porta. Toc. Toc. Toc.\nLuca: Chi è?\nNessuno. Ho guardato nel corridoio: era buio e non c’era nessuno. Ma davanti alla porta c’era acqua.\nLa notte dopo ho sentito una voce nel corridoio. Una ragazza piangeva e cantava. Ho guardato nel corridoio. In fondo al corridoio c’era una ragazza con i capelli lunghi e bagnati. Aveva una bambola.\nRagazza: Hai visto la mia mamma? La mia mamma è nella camera tredici.\nAll’improvviso la luce si è spenta. Quando ho acceso la torcia, la ragazza non c’era più. Davanti a me c’era solo la bambola. Bagnata.\nLa mattina sono andato alla reception con la bambola.\nLuca: Salve. Stanotte una ragazza piangeva nel corridoio. La sua mamma è nella camera tredici.\nUomo: Camera tredici? Ma qui non c’è una camera tredici. Dopo la dodici c’è la quattordici.\nLuca: Ma la ragazza…\nL’uomo ha guardato la bambola. Poi ha aperto un libro vecchio dell’albergo. Nel libro, nel 1952, c’era una camera tredici: «Camera tredici: una mamma e una ragazza. Una notte di temporale la ragazza è uscita. È andata al lago. Non è mai tornata.»\nQuella sera sono tornato a casa. Ma sul mio letto c’era una bambola. Bagnata.',
    tr:'In den Ferien bin ich in ein kleines Hotel am See gefahren. Das Hotel war alt und groß. Mein Zimmer war die Zwölf.\nIn der ersten Nacht regnete es. Es gab ein Gewitter, und ich schlief nicht. Ich las im Bett ein Buch. Um Mitternacht hat jemand an die Tür geklopft. Klopf. Klopf. Klopf.\nLuca: Wer ist da?\nNiemand. Ich habe in den Flur geschaut: Es war dunkel, und niemand war da. Aber vor der Tür war Wasser.\nIn der Nacht danach habe ich im Flur eine Stimme gehört. Ein Mädchen weinte und sang. Ich habe in den Flur geschaut. Am Ende des Flurs stand ein Mädchen mit langen, nassen Haaren. Sie hatte eine Puppe.\nMädchen: Hast du meine Mama gesehen? Meine Mama ist in Zimmer dreizehn.\nPlötzlich ist das Licht ausgegangen. Als ich die Taschenlampe angemacht habe, war das Mädchen nicht mehr da. Vor mir lag nur die Puppe. Nass.\nAm Morgen bin ich mit der Puppe zur Rezeption gegangen.\nLuca: Guten Tag. Heute Nacht hat ein Mädchen im Flur geweint. Ihre Mama ist in Zimmer dreizehn.\nMann: Zimmer dreizehn? Aber hier gibt es kein Zimmer dreizehn. Nach der Zwölf kommt die Vierzehn.\nLuca: Aber das Mädchen …\nDer Mann hat die Puppe angeschaut. Dann hat er ein altes Buch des Hotels aufgeschlagen. Im Buch gab es 1952 ein Zimmer dreizehn: „Zimmer dreizehn: eine Mutter und ein Mädchen. In einer Gewitternacht ist das Mädchen hinausgegangen. Es ist zum See gegangen. Es ist nie zurückgekommen.“\nAn diesem Abend bin ich nach Hause gefahren. Aber auf meinem Bett lag eine Puppe. Nass.',
    qs:[['Welches Zimmer hat Luca?',['Zimmer zwölf','Zimmer dreizehn','Zimmer vierzehn','Ein Zimmer im Keller']],
        ['Was findet Luca in der ersten Nacht vor der Tür?',['Wasser','Eine Puppe','Einen Brief','Eine Kerze']],
        ['Was sagt der Mann an der Rezeption über Zimmer dreizehn?',['Es gibt kein Zimmer dreizehn','Es ist renoviert','Dort wohnt eine Familie','Es ist besetzt']],
        ['Was liegt am Ende auf Lucas Bett zu Hause?',['Eine nasse Puppe','Der Hotelschlüssel','Ein altes Buch','Ein Brief vom Mädchen']]],
    tf:[['Das Hotel liegt an einem See.',true],['Das Mädchen hatte kurze Haare.',false],['Im alten Buch steht, dass das Mädchen nie zurückkam.',true],['Luca bleibt noch eine ganze Woche im Hotel.',false]] },

  { at:'brividi-v4-4', kind:'Witzig · Alltag', title:'La chat del palazzo', de:'Der Chat im Wohnhaus', dialog:true,

/* ---------- Wortschatz-Logik: Tokens, bekannte Wörter, Übersetzungen ---------- */
const tokenize = s => s.split(/\s+/).map(w => w.replace(/^[^\p{L}\d’]+|[^\p{L}\d’]+$/gu,'')).filter(Boolean);
const splitElision = w => { const m = w.match(/^([\p{L}]+’)(.+)$/u); return m ? [m[1], m[2]] : [w]; };
const stripDe = s => s.replace(/[!?.]/g,'').replace(/^(der|die|das|ein|eine|einen|den)\s+/i,'').trim();
(function autoGloss(){
  TOPICS.forEach(t => [...t.lessons, ...t.stories].forEach(l => (l.words||[]).forEach(([it,de]) => {
    const itV = it.split(' / '), deV = de.split(' / ');
    itV.forEach((v,i) => {
      const content = tokenize(v).flatMap(splitElision).map(x=>x.toLowerCase()).filter(x => !FREE.has(x));
      if (content.length === 1 && !GLOSS[content[0]]) GLOSS[content[0]] = stripDe(deV[i] || deV[0]);
    });
  })));
})();
function glossOf(w){
  const k = w.toLowerCase();
  if (GLOSS[k]) return GLOSS[k];
  const p = splitElision(k);
  if (p.length === 2) return [GLOSS[p[0]], GLOSS[p[1]]].filter(Boolean).join(' ') || '';
  return NAMES.has(w) ? 'Name' : '';
}
function knownWords(topic, uptoIdx){
  const set = new Set(FREE);
  topic.lessons.slice(0, uptoIdx+1).forEach(l => (l.words||[]).forEach(([it]) =>
    tokenize(it.replace(/\s\/\s/g,' ')).flatMap(splitElision).forEach(x => set.add(x.toLowerCase()))));
  return set;
}
/* Bekannte Wörter für eine Geschichte: Lektionen bis „after“ plus ihre Vorab-Wörter */
function storyKnown(t, st){
  const k = knownWords(t, st.after);
  (st.words || []).forEach(([it]) => tokenize(it.replace(/\s\/\s/g,' ')).flatMap(splitElision).forEach(x => k.add(x.toLowerCase())));
  return k;
}
function isKnown(w, known){
  if (/^\d+$/.test(w) || NAMES.has(w)) return true;
  return splitElision(w.toLowerCase()).every(p => known.has(p));
}

function soundUrl(d, k){
  if (d.url[k]) return d.url[k];
  const pos = d.idx[k];
  if (!pos || !d.buf) return null;
  const bytes = new Uint8Array(d.buf, pos[0], pos[1]);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    const mine = box.dataset.akey === player._key, on = mine && !player.paused && !player.ended;
    const btn = box.querySelector('.aplay');
    btn.innerHTML = on ? ICON_PAUSE : ICON_PLAY; btn.setAttribute('aria-label', on ? 'Pause' : 'Abspielen');
    box.querySelector('.afill').style.width = mine && player.duration ? (player.currentTime / player.duration * 100) + '%' : '0%';
    box.querySelector('.atime').textContent = mine ? mmss(player.currentTime) + ' / ' + mmss(player.duration) : '0:00';
  });
}
if (player.addEventListener) ['timeupdate','play','pause','ended','loadedmetadata'].forEach(ev => player.addEventListener(ev, updAudio));
/* Geschichtentext: Dialogzeilen mit fettem Sprechernamen */
function storyHtml(r, known){
  if (!r.voices) return glossify(r.text, known);
  return r.text.split('\n').map(line => {
    const m = line.match(/^([^:]{1,24}): (.+)$/);
    return m && m[1] in r.voices ? `<b class="who">${esc(m[1])}:</b> ${glossify(m[2], known)}` : `<span class="nar">${glossify(line, known)}</span>`;
  }).join('<br>');
}

function topicById(id){ return TOPICS.find(t => t.id === id); }
function doneCount(t){ return t.lessons.filter(l => S.done[l.id]).length; }

  const n = t.lessons.length, d = doneCount(t), r = 20, c = 2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 48 48" aria-label="${d} von ${n} Lektionen erledigt">

    <text x="24" y="24">${d}/${n}</text></svg>`;
}

/* Nächste offene Aufgabe eines Themas: erst Lektionen, dann Geschichten (weder gelesen noch gehört) */
function nextOpen(t){
  const i = t.lessons.findIndex(l => !S.done[l.id]);
  if (i >= 0) return {kind:'lesson', i, l:t.lessons[i]};
  const j = storyOrder(t).find(k => !S.done[storyId(t,k)] && !S.done[storyId(t,k) + 'h']);
  return j == null ? null : {kind:'story', i:j, st:t.stories[j]};
}
const storyOrder = t => t.stories.map((st,i) => i).sort((a,b) => t.stories[a].after - t.stories[b].after || a - b);

/* ---------- build lesson steps ---------- */
const pick = a => a[Math.floor(Math.random()*a.length)];
const sWords = x => x.it.replace(/[.,!?…«»:]/g,'').split(' ').filter(Boolean);
const contentTokens = t => tokenize(t).filter(w => !FREE.has(w.toLowerCase()) && !NAMES.has(w) && !/\d/.test(w) && w.length > 2 && !w.includes('’'));
function meaningStep(x, pool){
  return {type:'choice', ask:'Was bedeutet dieser Satz?', big:x.it, bigIt:true, gloss:true,
    options:shuffle([x.de, ...shuffle(pool.filter(o => o !== x && o.de !== x.de)).slice(0,3).map(o => o.de)]), answer:x.de};
}
function wordStep(x, pool){
  const others = shuffle(pool.filter(o => o !== x && o.it !== x.it && o.de !== x.de)).slice(0,3);
  const v = pick(['choice','choice','listen-it','listen-de']);
  if (v === 'listen-it') return {type:'choice', listen:true, ask:'Was hörst du?', say:x.it, options:shuffle([x.it, ...others.map(o => o.it)]), answer:x.it, itFont:true};
  if (v === 'listen-de') return {type:'choice', listen:true, ask:'Was bedeutet das, was du hörst?', say:x.it, options:shuffle([x.de, ...others.map(o => o.de)]), answer:x.de};
  return {type:'choice', ask:'Was bedeutet das?', big:x.it, bigIt:true, options:shuffle([x.de, ...others.map(o => o.de)]), answer:x.de};
}
function clozeStep(x, pool){
  const cands = contentTokens(x.it);
  if (!cands.length) return null;
  const w = pick(cands), wl = w.toLowerCase();
  const others = shuffle([...new Set(pool.filter(o => o !== x).flatMap(o => contentTokens(o.it)).map(t => t.toLowerCase()))].filter(t => t !== wl)).slice(0,3);
  if (others.length < 2) return null;
  const parts = x.it.split(' ');
  const idx = parts.findIndex(pt => pt.replace(/^[^\p{L}]+|[^\p{L}’]+$/gu,'') === w);
  if (idx < 0) return null;
  parts[idx] = parts[idx].replace(w, '___');
  return {type:'choice', ask:'Welches Wort fehlt?', big:parts.join(' '), bigIt:true, gloss:true, noSpk:true, sub:x.de,
    options:shuffle([wl, ...others]), answer:wl, itFont:true, say:x.it};
}
function listenSentenceStep(x, pool){
  return {type:'choice', listen:true, ask:'Was bedeutet der Satz, den du hörst?', say:x.it,
    options:shuffle([x.de, ...shuffle(pool.filter(o => o !== x && o.de !== x.de)).slice(0,3).map(o => o.de)]), answer:x.de};
}
function buildStep(x, pool){
  const own = new Set(sWords(x).map(w => w.toLowerCase()));
  const dis = [...new Set(pool.filter(o => o !== x).flatMap(sWords))].filter(w => !own.has(w.toLowerCase()));
  return {type:'build', s:x, tiles:shuffle([...sWords(x), ...shuffle(dis).slice(0,2)])};
}
const typeStep = x => (Math.random() < 0.4 && x.it.split(' ').length <= 3)
  ? {type:'type', word:x, dict:true, alts:x.it.split(' / ')} : {type:'type', word:x, alts:x.it.split(' / ')};

/* Bild-Wörter der Lektionen from..to eines Themas; it = erste Form (bei „la candela / le candele“ also „la candela“) */
const picWords = (t, from, to) => t.lessons.slice(from, to + 1).flatMap(l => (l.words || []).filter(([it]) => PICS[it])
  .map(([it,de]) => ({it: it.split(' / ')[0], de: de.split(' / ')[0], pic: PICS[it], all: it.split(' / '), say: it})));
/* Eine Bildaufgabe: Bild → Wort wählen, Wort (gelesen oder gehört) → Bild wählen, oder Bild → Wort schreiben */
function picStep(x, pool, kind){
  const seen = new Set([x.pic]);
  const others = shuffle(pool).filter(o => o.it !== x.it && !seen.has(o.pic) && seen.add(o.pic)).slice(0,3);
  if (others.length < 2) kind = 'type';
  kind = kind || pick(['name','name','find','type']);
  if (kind === 'type') return {type:'type', pic:x.pic, word:{it:x.it, de:x.de}, alts:x.all, say:x.say};
  if (kind === 'find') return Math.random() < 0.5
    ? {type:'choice', ask:'Welches Bild passt?', big:x.it, bigIt:true, picOpts:true, options:shuffle([x.pic, ...others.map(o => o.pic)]), answer:x.pic, say:x.say}
    : {type:'choice', listen:true, ask:'Hör zu: Welches Bild passt?', say:x.say, picOpts:true, options:shuffle([x.pic, ...others.map(o => o.pic)]), answer:x.pic};
  return {type:'choice', ask:'Was ist das?', pic:x.pic, itOpts:true, options:shuffle([x.it, ...others.map(o => o.it)]), answer:x.it, say:x.say,
    sayOf:Object.fromEntries([x, ...others].map(o => [o.it, o.say]))};
}
/* Bilderrätsel: gemischte Bildaufgaben mit allen Bild-Wörtern, die man bis jetzt kennt */
function startPics(tid){
  const t = topicById(tid), pool = picWords(t, 0, reviewUpto(t));
  const steps = shuffle(pool).slice(0, 12).map((x,i) => picStep(x, pool, ['name','find','type','name'][i % 4]));
  startRun({id:'pics-'+tid, name:t.name, title:'Bilder benennen', color:t.color, backTo:'topic:'+tid, steps, restart:() => startPics(tid), sounds:bundleOf(t, 0)});
  t.lessons.slice(0, reviewUpto(t) + 1).forEach((l,i) => loadSounds(bundleOf(t, i)));
}

function buildSteps(lesson, topic){
  const steps = [{type:'tip'}];
  const onlyWords = !lesson.sentences;
  if (lesson.words){
    const w = lesson.words.map(([it,de]) => ({it,de}));
    for (let g=0; g<w.length; g+=4){
      const grp = w.slice(g,g+4);
      grp.forEach(x => steps.push({type:'intro', word:x}));
      shuffle(grp).slice(0, onlyWords ? 2 : 1).forEach(x => steps.push(wordStep(x, w)));
      if (grp.length > 1) steps.push({type:'match', pairs:grp});
      if (topic){
        const known = picWords(topic, 0, topic.lessons.indexOf(lesson));
        grp.filter(x => PICS[x.it]).forEach(x => steps.push(picStep(known.find(p => p.pic === PICS[x.it]), known)));
      }
    }
    if (onlyWords){
      shuffle(w).slice(0,3).forEach(x => steps.push(typeStep(x)));
      shuffle(w).slice(0,3).forEach(x => steps.push({type:'speak', it:x.it, de:x.de}));
      const x = pick(w);
      steps.push({type:'choice', ask:'Wie sagt man das auf Italienisch?', big:x.de, itOpts:true,
        options:shuffle([x.it, ...shuffle(w.filter(o=>o!==x)).slice(0,3).map(o=>o.it)]), answer:x.it});
    }
  }
  if (lesson.words && lesson.sentences){
    const w = lesson.words.map(([it,de]) => ({it,de})), x = pick(w);
    shuffle(w).slice(0,2).forEach(x => steps.push(typeStep(x)));
    steps.push({type:'choice', ask:'Wie sagt man das auf Italienisch?', big:x.de, itOpts:true,
      options:shuffle([x.it, ...shuffle(w.filter(o=>o!==x)).slice(0,3).map(o=>o.it)]), answer:x.it});
  }
  if (lesson.sentences){
    const s = lesson.sentences.map(([it,de]) => ({it,de}));
    s.forEach((x,i) => {
      if (i < 2) steps.push(pick([meaningStep(x,s), meaningStep(x,s), clozeStep(x,s), listenSentenceStep(x,s)].filter(Boolean)));
      else if (Math.random() < 0.5){ const c = clozeStep(x,s); if (c) steps.push(c); }
      steps.push(buildStep(x, s));
      steps.push({type:'speak', it:x.it, de:x.de});
    });
  }
  if (lesson.reading) lesson.reading.qs.forEach(([q,opts]) => steps.push({type:'read', q, options:shuffle(opts), answer:opts[0]}));
  return steps;
}

/* ---------- Geschichten & gemischtes Wiederholen ---------- */
/* Sätze einer Geschichte, jeweils mit Sprecher (bei Dialogzeilen „Name: …“) */
function storySentences(st){
  const out = [];
  st.text.split('\n').forEach(line => {
    const m = line.match(/^([^:]{1,24}): (.+)$/);
    const who = m && st.voices && m[1] in st.voices ? m[1] : null;
    const body = (who ? m[2] : line).replace(/[«»]/g, '');
    /* Satzende: . ! ? … wenn danach ein Großbuchstabe kommt („E… ecco“ bleibt ein Satz) */
    body.split(/(?<=[.!?…])\s+(?=["“]?\p{Lu})/u).map(x => x.trim()).filter(x => /\p{L}/u.test(x))
      .forEach(it => out.push({it, who, voice: who ? st.voices[who] : null}));
  });
  /* Sätze, deren Ton-Schlüssel mit dem der ganzen Geschichte zusammenfällt, bekommen keine eigene Aufnahme */
  return out.filter(x => slug(x.it) !== slug(st.text));
}
const sentLabel = x => (x.who ? x.who + ': ' : '') + x.it;
const storyBundle = (t, st) => t.id + '-g' + (t.stories.indexOf(st) + 1);
const storyId = (t, i) => t.id + '-s' + (i+1);

function storySteps(t, st, listen){
  const steps = [];
  const words = (st.words || []).map(([it,de]) => ({it,de}));
  const i = t.stories.indexOf(st), seen = S.done[storyId(t,i)] || S.done[storyId(t,i) + 'h'];
  /* Vorab-Wörter: beim ersten Mal als neue Karten, danach als Liste */
  if (words.length && seen) steps.push({type:'wordlist', words});
  for (let g = 0; g < words.length; g += 4){
    const grp = words.slice(g, g+4);
    if (!seen) grp.forEach(w => steps.push({type:'intro', word:w}));
    if (grp.length > 1) steps.push({type:'match', pairs:grp});
  }
  if (listen) steps.push({type:'listenstory'});
  steps.push(...st.qs.map(([q,opts]) => ({type:'read', q, options:shuffle(opts), answer:opts[0]})));
  steps.push(...shuffle(st.tf).map(([stmt,val]) => ({type:'read', q:'Richtig oder falsch? „' + stmt + '“', options:['Richtig','Falsch'], answer: val ? 'Richtig' : 'Falsch', fixed:true})));
  const sents = storySentences(st), long = sents.filter(x => x.it.split(' ').length >= 3);
  /* Reihenfolge: 4 Sätze aus verschiedenen Teilen der Geschichte */
  if (long.length >= 4){
    const q = long.length / 4, pickd = [0,1,2,3].map(k => long[Math.floor(k*q + Math.random()*q)]);
    const labels = pickd.map(sentLabel);
    if (new Set(labels).size === 4) steps.push({type:'build', order:true, sep:' / ', s:{it:labels.join(' / ')}, tiles:shuffle(labels),
      clipOf:Object.fromEntries(pickd.map(x => [sentLabel(x), x.it]))});
  }
  /* Wer sagt das? (nur bei Dialogen mit mehreren Sprechern) */
  const whos = [...new Set(sents.map(x => x.who).filter(Boolean))];
  if (whos.length >= 2) shuffle(sents.filter(x => x.who && x.it.split(' ').length >= 3)).slice(0,2).forEach(x => {
    const options = shuffle([x.who, ...shuffle(whos.filter(w => w !== x.who)).slice(0,3)]);
    steps.push(listen ? {type:'choice', listen:true, ask:'Wer sagt das? Hör genau hin.', say:x.it, options, answer:x.who}
      : {type:'choice', ask:'Wer sagt das in der Geschichte?', big:x.it, bigIt:true, noSpk:true, gloss:true, options, answer:x.who});
  });
  /* Lückensätze mit Wörtern aus der Geschichte */
  const pool = [...new Set(sents.flatMap(x => contentTokens(x.it)).map(w => w.toLowerCase()))];
  shuffle(long.filter(x => x.it.split(' ').length >= 4)).slice(0,6).filter(x => contentTokens(x.it).length).slice(0,2).forEach(x => {
    const w = pick(contentTokens(x.it)), wl = w.toLowerCase();
    const parts = x.it.split(' '), idx = parts.findIndex(pt => pt.replace(/^[^\p{L}]+|[^\p{L}’]+$/gu,'') === w);
    const others = shuffle(pool.filter(o => o !== wl && !x.it.toLowerCase().includes(o))).slice(0,3);
    if (idx < 0 || others.length < 3) return;
    parts[idx] = parts[idx].replace(w, '___');
    steps.push(listen
      ? {type:'choice', listen:true, ask:'Hör zu: Welches Wort fehlt?', say:x.it, sub:'<span class="it" style="font-size:28px;color:var(--ink)">' + esc(parts.join(' ')) + '</span>', options:shuffle([wl, ...others]), answer:wl, itFont:true}
      : {type:'choice', ask:'Welches Wort fehlt?', big:parts.join(' '), bigIt:true, gloss:true, noSpk:true, options:shuffle([wl, ...others]), answer:wl, itFont:true, say:x.it});
  });
  /* Hören: Diktat kurzer Sätze · Lesen: einen Satz nachsprechen */
  const short = sents.filter(x => { const n = x.it.split(' ').length; return n >= 3 && n <= 7 && !/\d/.test(x.it); });
  if (listen) shuffle(short).slice(0,2).forEach(x => steps.push({type:'type', dict:true, word:{it:x.it, de:''}, hint:'Schreib den ganzen Satz. Satzzeichen, Großschreibung und Akzente müssen nicht perfekt sein.'}));
  else shuffle(short).slice(0,1).forEach(x => steps.push({type:'speak', it:x.it, de:''}));
  return steps;
}
function startStory(tid, i, listen, mode){
  const t = topicById(tid), st = t.stories[i];
  curTopic = storyBundle(t, st); loadSounds(curTopic); loadSounds(bundleOf(t, st.after));
  const lesson = {id: storyId(t, i) + (listen ? 'h' : ''), title:st.title, de:st.de, reading:st, knownIdx:st.after, level:t.lessons[st.after].level,
    focus: listen ? 'Hörverständnis' : 'Geschichte', tip:'', isStory:true, listen:!!listen, storyRef:`${tid}:${i}${listen ? ':h' : ''}`};
  const p = pausedAt(lesson.id);
  if (p && !mode) return askResume(t, st.title + (listen ? ' (Hören)' : ' (Lesen)'), p, () => startStory(tid, i, listen, 'resume'), () => { clearPause(lesson.id); startStory(tid, i, listen, 'fresh'); });
  if (p && mode === 'resume'){ L = Object.assign({topic:t, lesson}, JSON.parse(JSON.stringify(p))); return renderStep(); }
  const steps = storySteps(t, st, listen);
  L = {topic:t, lesson, queue:steps, i:0, graded:0, right:0, xp:0, total:steps.length};
  renderStep();
}
function reviewUpto(t){
  const last = t.lessons.reduce((m,l,i) => S.done[l.id] ? i : m, -1);
  return Math.max(1, last);
}
function startReview(tid){
  const t = topicById(tid), ls = t.lessons.slice(0, reviewUpto(t) + 1);
  const words = ls.flatMap(l => (l.words||[]).map(([it,de]) => ({it,de})));
  const sents = ls.flatMap(l => (l.sentences||[]).map(([it,de]) => ({it,de})));
  const steps = [];
  shuffle(words).slice(0,4).forEach(x => steps.push(wordStep(x, words)));
  steps.push({type:'match', pairs:shuffle(words).slice(0,4)});
  shuffle(words).slice(0,2).forEach(x => steps.push(typeStep(x)));
  shuffle(sents).slice(0,5).forEach(x => {
    const rec = [meaningStep(x,sents), clozeStep(x,sents), listenSentenceStep(x,sents)].filter(Boolean);
    steps.push(pick(rec));
    steps.push(buildStep(x, sents));
  });
  const pics = picWords(t, 0, reviewUpto(t));
  shuffle(pics).slice(0,3).forEach(x => steps.push(picStep(x, pics)));
  shuffle([...sents, ...words]).slice(0,2).forEach(x => steps.push({type:'speak', it:x.it, de:x.de}));
  startRun({id:'review-'+tid, name:t.name, title:'Gemischt wiederholen', color:t.color, backTo:'topic:'+tid, steps, restart:() => startReview(tid), sounds:bundleOf(t, reviewUpto(t))});
  t.lessons.slice(0, reviewUpto(t) + 1).forEach((l,i) => loadSounds(bundleOf(t, i)));
}

function startPractice(tid, st){
  const t = topicById(tid), ls = t.lessons.filter(l => l.stage === st);
  const words = ls.flatMap(l => (l.words||[]).map(([it,de]) => ({it,de})));
  const sents = [...ls.flatMap(l => l.sentences || []), ...(((MORE[tid] || {}).practice || {})[st] || [])].map(([it,de]) => ({it,de}));
  const steps = [];
  shuffle(words).slice(0,4).forEach(x => steps.push(wordStep(x, words)));
  steps.push({type:'match', pairs:shuffle(words).slice(0,4)});
  const x = pick(words);
  steps.push({type:'choice', ask:'Wie sagt man das auf Italienisch?', big:x.de, itOpts:true,
    options:shuffle([x.it, ...shuffle(words.filter(o => o.it !== x.it && o.de !== x.de)).slice(0,3).map(o => o.it)]), answer:x.it});
  shuffle(words).slice(0,2).forEach(x => steps.push(typeStep(x)));
  shuffle(sents).slice(0,8).forEach((x,i) => {
    steps.push(pick([meaningStep(x,sents), clozeStep(x,sents), listenSentenceStep(x,sents)].filter(Boolean)));
    if (i % 2 === 0) steps.push(buildStep(x, sents));
  });
  steps.push({type:'match', pairs:shuffle(words).slice(0,4)});
  const pics = picWords(t, 0, stageEnd(t, st)), own = picWords(t, t.lessons.indexOf(ls[0]), stageEnd(t, st));
  shuffle(own.length >= 2 ? own : pics).slice(0,3).forEach(x => steps.push(picStep(x, pics)));
  shuffle(sents).slice(0,2).forEach(x => steps.push({type:'speak', it:x.it, de:x.de}));
  ls.forEach((l,i) => loadSounds(bundleOf(t, t.lessons.indexOf(l))));
  startRun({id:`practice-${tid}-${st}`, name:t.name, title:'Übungsrunde ' + STAGES[st-1].split(' · ')[0], color:t.color, backTo:'topic:'+tid,
    steps, restart:() => startPractice(tid, st), sounds:tid + '-' + st + 'x'});
}

/* ---------- antippbare Wörter ---------- */
function glossify(text, known){
  return text.split(/([\p{L}’]+)/u).map((part,i) => {
    if (i % 2 === 0) return esc(part).replace(/\n/g,'<br>');
    const g = glossOf(part);
    if (!g) return esc(part);
    const nw = known && !isKnown(part, known);
    return `<span class="w${nw?' nw':''}" tabindex="0" data-g="${esc(g)}">${esc(part)}</span>`;
  }).join('');
}
const pop = document.createElement('div'); pop.className = 'pop'; pop.hidden = true; document.body.appendChild(pop);
function showGloss(el){
  pop.textContent = el.dataset.g; pop.hidden = false;
  const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 8)) + 'px';
  pop.style.top = (r.top - h - 6 < 8 ? r.bottom + 6 : r.top - h - 6) + 'px';
}
document.addEventListener('click', e => { const w = e.target.closest('.w'); if (w && !w.closest('.hint')) showGloss(w); else pop.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('w')) showGloss(e.target); });
window.addEventListener('scroll', () => pop.hidden = true, {passive:true});

/* ---------- lesson player ---------- */
let L = null;
function startLesson(tid, lid, mode){
  const topic = topicById(tid), lesson = topic.lessons.find(l => l.id===lid);
  curTopic = bundleOf(topic, topic.lessons.indexOf(lesson)); loadSounds(curTopic);
  const p = pausedAt(lid);
  if (p && !mode) return askResume(topic, lesson.title, p, () => startLesson(tid, lid, 'resume'), () => { clearPause(lid); startLesson(tid, lid, 'fresh'); });
  if (p && mode === 'resume'){ L = Object.assign({topic, lesson}, JSON.parse(JSON.stringify(p))); return renderStep(); }
  const steps = buildSteps(lesson, topic);
  L = {topic, lesson, queue:steps, i:0, graded:0, right:0, xp:0, total:steps.length};
  renderStep();
}

function renderStep(){
  pop.hidden = true; stopRec();
  L.hist = L.hist || []; L.saved = L.saved || {};
  /* L.back: Position in L.hist, wenn man sich eine frühere Aufgabe ansieht (Rückblick) */
  let idx;
  if (L.back != null) idx = L.hist[L.back];
  else {
    const skip = q => (q.type === 'speak' && S.speakOff) || ((q.listen || q.dict || q.type === 'listenstory') && S.muted);
    while (L.i < L.queue.length && skip(L.queue[L.i])) L.i++;
    if (L.i >= L.queue.length) return renderResult();
    idx = L.i;
    if (L.hist[L.hist.length-1] !== idx) L.hist.push(idx);
    savePause();
  }
  const rv = L.back != null, saved = L.saved[idx];
  const pos = rv ? L.back : L.hist.length-1;
  const st = L.queue[idx], t = L.topic, les = L.lesson;
  L.cur = {st, answer:null, checked:rv || !!saved};
  const pct = Math.round(idx / L.queue.length * 100);
  let body = '', btn = 'Prüfen', ready = false;

function showSaved(st, sv){

    document.querySelectorAll('.wt[data-tile]').forEach(b => { b.disabled = true; if (sv.picked.includes(+b.dataset.tile)) b.classList.add('used'); });

function stepBack(){

/* ---------- Mikrofon: Nachsprechen mit Spracherkennung (z. B. Chrome auf Android) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function stopRec(){ const r = rec; rec = null; if (r){ try{ r.abort(); }catch(e){} } }
const NUM_IT = ['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici','tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove','venti'];
function numWord(d){
  const n = +d; if (n <= 20) return NUM_IT[n];
  if (n >= 100) return d;
  const T = ['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'][Math.floor(n/10)], u = n % 10;
  return !u ? T : (u === 1 || u === 8 ? T.slice(0,-1) : T) + NUM_IT[u];
}
const spTokens = s => plain(String(s).replace(/\d+/g, d => ' ' + numWord(d) + ' ').replace(/['’]/g,'').replace(/-/g,' ')).replace(/[^a-z ]/g,' ').split(' ').filter(Boolean);
function lev(a, b){
  let prev = [...Array(b.length+1).keys()];
  for (let i=1; i<=a.length; i++){
    const cur = [i];
    for (let j=1; j<=b.length; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
/* Wie ein Wort ungefähr klingt: stummes h weg, Doppelbuchstaben einfach, gleich klingende Schreibweisen vereinheitlicht.
   So gelten z. B. ho/o, è/e/eh, c'è/che, anno/ano als gleich – die Spracherkennung verwechselt genau solche Wörter oft. */
const soundKey = w => w.replace(/h/g,'').replace(/qu/g,'cu').replace(/k/g,'c').replace(/[jy]/g,'i').replace(/gli/g,'li').replace(/gn/g,'ni').replace(/(.)\1+/g,'$1');
function sameWord(x, y){
  if (x === y) return true;
  const a = soundKey(x), b = soundKey(y);
  if (a === b) return true;
  const n = Math.min(a.length, b.length);
  return n >= 5 && lev(a, b) <= (n >= 8 ? 2 : 1);
}
/* Getrennt oder zusammen geschrieben (buon giorno / buongiorno, perfavore / per favore) soll keine Rolle spielen */
function fixSpaces(target, heard){
  const keys = new Set(target.map(soundKey)), pairs = new Map();
  target.forEach((w, i) => { if (i + 1 < target.length) pairs.set(soundKey(w + target[i+1]), [w, target[i+1]]); });
  const out = [];
  for (let i=0; i<heard.length; i++){
    const h = heard[i], k = soundKey(h);
    if (keys.has(k)) out.push(h);
    else if (i + 1 < heard.length && keys.has(soundKey(h + heard[i+1]))){ out.push(h + heard[i+1]); i++; }
    else if (pairs.has(k)) out.push(...pairs.get(k));
    else out.push(h);
  }
  return out;
}
/* Welche Wörter des Zielsatzes kommen (in der richtigen Reihenfolge) im Gehörten vor? */
function wordHits(a, b){
  const dp = Array.from({length:a.length+1}, () => new Array(b.length+1).fill(0));
  for (let i=a.length-1; i>=0; i--) for (let j=b.length-1; j>=0; j--)
    dp[i][j] = sameWord(a[i], b[j]) ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const hit = new Array(a.length).fill(false);
  for (let i=0, j=0; i<a.length && j<b.length; ){
    if (sameWord(a[i], b[j])){ hit[i] = true; i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  return hit;
}
const REC_ERR = {
  'not-allowed':'Das Mikrofon ist gesperrt. Erlaube es im Browser: auf das Symbol links neben der Adresse tippen → Berechtigungen → Mikrofon. Klappt das nicht, lässt diese Seite kein Mikrofon zu. Dann bewerte dich bitte selbst.',
  'service-not-allowed':'Die Spracherkennung ist auf diesem Gerät oder in diesem Browser gesperrt. Bewerte dich bitte selbst.',
  'no-speech':'Ich habe nichts gehört. Tipp nochmal aufs Mikrofon und sprich etwas lauter.',
  'audio-capture':'Ich finde kein Mikrofon.',
  'network':'Für die Spracherkennung braucht das Handy Internet.',
  'language-not-supported':'Die italienische Spracherkennung ist in diesem Browser nicht verfügbar.'
};
function startRec(btn){
  if (!SR || !L || L.cur.st.type !== 'speak') return;
  if (rec){ stopRec(); return; }
  try{ player.pause(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){}
  const st = L.cur.st, out = document.getElementById('recout'), fb = document.getElementById('fb');
  fb.classList.remove('ok','bad','warn'); out.textContent = '';
  const lbl = btn.querySelector('span'), idle = () => { btn.classList.remove('on'); lbl.textContent = 'Nochmal sprechen'; };
  let r;
  try{ r = new SR(); }catch(e){ out.textContent = 'Die Spracherkennung lässt sich hier nicht starten.'; return; }
  rec = r;
  r.lang = 'it-IT'; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let got = null, err = null;
  r.onresult = e => {
    const res = e.results[e.results.length-1];
    out.textContent = '„' + res[0].transcript + '“';
    if (res.isFinal) got = Array.from(res, a => a.transcript);
  };
  r.onerror = e => { err = e.error; };
  r.onend = () => {
    if (rec !== r) return;
    rec = null; idle();
    if (got) judgeSpeech(st, got);
    else if (err === 'network' && isBrave()) out.textContent = 'Brave unterstützt die Spracherkennung leider nicht. Öffne die App zum Sprechen in Chrome (oder bewerte dich selbst).';
    else if (err !== 'aborted') out.textContent = REC_ERR[err] || (err ? 'Die Spracherkennung hat nicht geklappt (' + err + '). Tipp nochmal aufs Mikrofon.' : REC_ERR['no-speech']);
  };
  btn.classList.add('on'); lbl.textContent = 'Ich höre zu …';
  try{ r.start(); }catch(e){ rec = null; idle(); out.textContent = 'Die Spracherkennung lässt sich hier nicht starten.'; }
}
function judgeSpeech(st, alts){
  const words = st.it.replace(/^[^:]{1,24}: /,'').split(' ');
  const parts = words.map(w => ({w, toks:spTokens(w), name:NAMES.has(w.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,''))}));
  const target = parts.flatMap(p => p.toks);
  /* Ein Wort zählt als erkannt, wenn es in irgendeiner der Vorschläge der Spracherkennung vorkommt */
  const hit = new Array(target.length).fill(false);
  let heardText = alts[0], bestN = -1;
  alts.forEach(a => { const h = wordHits(target, fixSpaces(target, spTokens(a))), n = h.filter(Boolean).length; h.forEach((v,i) => { if (v) hit[i] = true; }); if (n > bestN){ bestN = n; heardText = a; } });
  /* Bewertet wird pro Wort. Namen (Anna, Luca …) zählen nicht mit, die kennt die Spracherkennung oft nicht. */
  let k = 0, need = 0, got = 0, lastOk = -1, firstMiss = -1;
  const marked = parts.map(p => {
    const n = p.toks.length, ok = hit.slice(k, k + n).every(Boolean); k += n;
    if (!n || p.name) return esc(p.w);
    need++;
    if (ok){ got++; lastOk = need; } else if (firstMiss < 0) firstMiss = need;
    return ok ? esc(p.w) : `<span class="miss">${esc(p.w)}</span>`;
  }).join(' ');
  const missing = need - got, ratio = need ? got / need : 1;
  const fb = document.getElementById('fb'), msg = document.getElementById('msg'), out = document.getElementById('recout');
  out.textContent = '';
  const heard = `Verstanden: <span class="it">„${esc(String(heardText).trim())}“</span>`;
  if (ratio >= 0.7 || (need >= 3 && missing <= 1)){
    /* Geschafft, aber mit nicht erkannten Wörtern: gelb, „Nochmal üben“ bleibt zum Verbessern sichtbar */
    fb.classList.add(missing ? 'warn' : 'ok');
    msg.innerHTML = (missing ? 'Fast richtig!' : ['Perfetto!','Bravissimo!','Ottimo!','Che bella pronuncia!'][Math.floor(Math.random()*4)])
      + `<small>${heard}${missing ? `<br>Das zählt als geschafft. Diese Wörter habe ich nicht erkannt: <span class="it">${marked}</span>` : ''}</small>`;
    const again = document.getElementById('again'); if (again) again.hidden = !missing;
    const m = document.getElementById('main'); m.textContent = 'Weiter'; m.focus();
  } else {
    fb.classList.add('bad');
    /* Fehlt nur das Ende, hat die Aufnahme vermutlich bei einer kurzen Pause aufgehört */
    const cutOff = got > 0 && firstMiss > lastOk;
    msg.innerHTML = (ratio >= 0.5 ? 'Fast!' : 'Nochmal!') + `<small>${heard}<br>${ratio >= 0.5 ? 'Diese Wörter habe ich nicht erkannt: ' : 'Das passt noch nicht ganz: '}<span class="it">${marked}</span><br>`
      + (cutOff ? 'Die Aufnahme hört auf, sobald du kurz Pause machst. Sprich den Satz am besten in einem Zug durch.' : 'Hör dir den Satz nochmal an und tipp dann wieder aufs Mikrofon.')
      + ` Du kannst dich auch selbst bewerten.</small>`;
  }
}

/* Sprechaufgabe sofort wiederholen: Rückmeldung zurücksetzen, Satz nochmal vorspielen */
function speakAgain(){
  stopRec();
  const fb = document.getElementById('fb'), msg = document.getElementById('msg'), out = document.getElementById('recout');
  fb.classList.remove('ok','bad','warn'); msg.innerHTML = '';
  if (out) out.textContent = 'Hör genau hin und versuch es nochmal.';
  const m = document.getElementById('main'); m.textContent = 'Hat geklappt';
  const again = document.getElementById('again'); if (again) again.hidden = false;
  const lbl = document.querySelector('[data-rec] span'); if (lbl) lbl.textContent = 'Tippen und sprechen';
  speak(L.cur.st.it);
}

function speakDone(ok){
  const st = L.cur.st;
  if (ok) L.xp += 5;
  else if (!st.retry) L.queue.push(Object.assign({}, st, {retry:true}));
  next();
}

function setReady(v){ document.getElementById('main').disabled = !v; }

/* Schreibaufgaben mit zwei Formen („stanco / stanca“): Leerzeichen um den Schrägstrich und Reihenfolge egal,
   eine der Formen allein reicht auch. Nur „ / “ mit Leerzeichen trennt, damit „andato/a“ im Verben-Trainer ganz bleibt. */
function slashHit(targets, pa){
  const forms = new Set(targets.flatMap(tg => tg.split(/\s+\/\s+/)).map(f => plain(f)));
  const parts = pa.split(/\s*\/\s*/).filter(Boolean);
  return parts.length > 0 && new Set(parts).size === parts.length
    && parts.every(p => forms.has(p) || [...forms].some(f => stripArt(f) === stripArt(p)));
}
/* Ein Tippfehler (ein Buchstabe falsch, zu viel oder zu wenig) wird verziehen, ab 20 Buchstaben zwei.
   Nicht bei kurzen Wörtern und nie am Wortende: Die Endung zeigt im Italienischen Person und Geschlecht (guardo/guarda, stanco/stanca). */
function typoOk(tg, pa){
  const letters = tg.replace(/\s/g,'').length;
  if (letters < 5 || tg === pa) return false;
  const tw = tg.split(' '), aw = pa.split(' ');
  if (tw.length !== aw.length || tw.some((w,i) => w.slice(-1) !== aw[i].slice(-1))) return false;
  return lev(tg, pa) <= (letters >= 20 ? 2 : 1);
}
function check(){
  const c = L.cur, st = c.st;
  let ok = false, correct = '', note = '', warn = false;
  if (st.type==='choice' || st.type==='read'){
    ok = c.answer === st.answer; correct = st.answer;
    document.querySelectorAll('[data-opt]').forEach(b => {
      b.disabled = true;
      if (b.dataset.opt === st.answer) b.classList.add('right');
      else if (b.dataset.opt === c.answer) b.classList.add('wrong');
    });
  } else if (st.type==='type'){
    const a = norm(c.answer||''), pa = plain(a);
    const targets = [st.word.it, ...(st.alts||[])].map(norm);
    const hit = targets.find(tg => plain(tg) === pa);
    const hitArt = !hit && targets.find(tg => stripArt(plain(tg)) === stripArt(pa));
    const hitSlash = !hit && !hitArt && slashHit(targets, pa);
    const hitTypo = !hit && !hitArt && !hitSlash && targets.find(tg => typoOk(plain(tg), pa) || typoOk(stripArt(plain(tg)), stripArt(pa)));
    ok = !!(hit || hitArt || hitSlash || hitTypo);
    /* Tippfehler oder falsche Akzente: zählt als richtig, wird aber gelb markiert */
    warn = !!hitTypo || !!(hit && !targets.includes(a));
    if (warn) note = 'Achte auf die Schreibweise: ';
    else if (hitArt) note = 'Mit Artikel: ';
    correct = st.word.it;
    const inp = document.getElementById('typein'); inp.disabled = true; if (warn) inp.classList.add('warn');
  } else if (st.type==='build'){
    const a = c.picked.map(i => st.tiles[i]).join(st.sep || ' ');
    ok = norm(a) === norm(st.s.it); correct = st.s.it;
    document.querySelectorAll('.wt').forEach(b => b.disabled = true);
  }
  finish(ok, correct, note, warn);
  if (st.say) speak(st.say);
  else if ((st.type==='build' && !st.order) || st.type==='type') speak(correct);
  else if (st.bigIt || st.itOpts) speak(st.itOpts ? st.answer : st.big);
}

function finish(ok, correct, note, warn){
  const st = L.cur.st;
  L.cur.checked = true; L.cur.mode = 'continue';
  if (!st.retry){ L.graded++; if (ok){ L.right++; L.xp += 10; } }
  else if (ok) L.xp += 5;
  if (!ok) L.queue.push(Object.assign({}, st, {retry:true, options: st.options ? shuffle(st.options) : undefined, tiles: st.tiles ? shuffle(st.tiles) : undefined}));
  const fb = document.getElementById('fb'), msg = document.getElementById('msg');
  const cls = ok ? (warn ? 'warn' : 'ok') : 'bad';
  fb.classList.add(cls);
  const praise = warn ? 'Fast richtig!' : ['Esatto!','Bravissimo!','Perfetto!','Giusto!','Ottimo!'][Math.floor(Math.random()*5)];
  const why = (st.listen && st.answer !== st.say ? `<small>Gehört: <span class="it">${esc(st.say)}</span></small>` : '') + (st.dict && ok ? `<small><span class="it">${esc(st.word.it)}</span>${st.word.de ? ' – ' + esc(st.word.de) : ''}</small>` : '') + (st.why ? `<small class="why">${st.why}</small>` : '');
  if (ok) msg.innerHTML = praise + (note && !st.order ? `<small>${note}<span class="it">${esc(correct)}</span></small>` : '') + why;
  else if (st.order) msg.innerHTML = `Nicht ganz<small>Richtig ist:<ol class="olist">${st.s.it.split(st.sep).map(x => `<li class="it">${esc(x)}</li>`).join('')}</ol>Die Aufgabe kommt später noch einmal.</small>`;
  else msg.innerHTML = `Nicht ganz<small>Richtig: <span class="it">${esc(correct)}</span><br>Die Aufgabe kommt später noch einmal.</small>` + why;
  const m = document.getElementById('main'); m.textContent = 'Weiter'; m.disabled = false; m.focus();
  L.saved[L.i] = {answer:L.cur.answer, picked:L.cur.picked, cls, msg:msg.innerHTML};
  savePause();
}

function next(){
  L.i++;
  if (L.i >= L.queue.length) return renderResult();
  renderStep();
}

function renderResult(){
  const t = L.topic, les = L.lesson;
  if (!t.pseudo){ S.done[les.id] = true; if (S.paused) delete S.paused[les.id]; }
  S.xp += L.xp;
  const d = today();
  if (S.lastDay !== d){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = S.lastDay === y ? S.streak + 1 : 1;
    S.lastDay = d;
  }
  save();
  const acc = L.graded ? Math.round(L.right / L.graded * 100) : 100;
  const head = acc >= 90 ? 'Fantastico!' : acc >= 70 ? 'Ben fatto!' : 'Continua così!';
  const sub = acc >= 90 ? 'Fast alles auf Anhieb richtig.' : acc >= 70 ? 'Gut gemacht. Die Fehler hast du am Ende nachgeholt.' : 'Übung macht den Meister. Wiederhol die Lektion ruhig noch einmal.';
  app.innerHTML = `
    <div class="result" style="--t:${t.color}">
      <p class="eyebrow">${t.name} · ${les.title}</p>
      <h1 class="it">${head}</h1>
      <p style="margin:0;color:var(--muted)">${sub}</p>
      <div class="rstats">
        <div class="rstat"><b>+${L.xp}</b><span>Punkte</span></div>
        <div class="rstat"><b>${acc} %</b><span>Treffer</span></div>
        <div class="rstat"><b>${S.streak}</b><span>Tage in Folge</span></div>
      </div>
      <div class="actions">
        ${t.pseudo ? `<button class="main" data-go="${t.backTo}">Zurück</button>
        <button class="ghost" data-restart>Nochmal üben</button>` : `<button class="main" data-topic="${t.id}">Zurück zu ${t.name}</button>
        ${les.isStory ? `<button class="ghost" data-story="${les.storyRef}">${les.listen ? 'Nochmal hören' : 'Nochmal lesen'}</button>` : `<button class="ghost" data-lesson="${les.id}" data-t="${t.id}">Nochmal üben</button>`}`}
      </div>
    </div>`;
  L = null;
  window.scrollTo(0,0);
}

const END = { are:'o i a iamo ate ano', ere:'o i e iamo ete ono', ire:'o i e iamo ite ono' };
const PART = { are:'ato', ere:'uto', ire:'ito' };
function conj(v, tense){
  const grp = v.inf.slice(-3), stem = v.inf.slice(0,-3);
  if (tense === 'pres') return (v.pres || END[grp].split(' ').map(e => stem + e).join(' ')).split(' ');
  if (tense === 'fut') return ['ò','ai','à','emo','ete','anno'].map(e => futStem(v) + e);
  if (tense === 'cond') return ['ei','esti','ebbe','emmo','este','ebbero'].map(e => futStem(v) + e);
  if (tense === 'imp') return (v.imp || ['vo','vi','va','vamo','vate','vano'].map(e => v.inf.slice(0,-2) + e).join(' ')).split(' ');
  const part = v.part || stem + PART[grp];
  if (v.aux === 'e'){
    const b = part.slice(0,-1);
    return 'sono sei è siamo siete sono'.split(' ').map((a,i) => a + ' ' + b + (i < 3 ? 'o/a' : 'i/e'));
  }
  return 'ho hai ha abbiamo avete hanno'.split(' ').map(a => a + ' ' + part);
}
const vform = (v, tense, p) => PERS[p] + ' ' + conj(v, tense)[p];
function variants(s){
  let out = [s];
  [['o/a','o','a'],['i/e','i','e'],['lui/lei','lui','lei']].forEach(([x,a,b]) => { out = out.flatMap(o => o.includes(x) ? [o.replace(x,a), o.replace(x,b)] : [o]); });
  return out;
}

/* ---------- Tonindex: welcher Text liegt in welcher Sammeldatei ---------- */
const SOUND_SRC = {};
/* voices: Stimme pro Sprecher bei Dialogen; voice: Stimme für einen einzelnen Satz (sonst Isabella) */
function regSound(text, bundle, voices, voice){
  const k = slug(text);
  const nz = x => x.toLowerCase().replace(/[^\p{L}\d]+/gu,' ').trim();
  if (!SOUND_SRC[k]){ SOUND_SRC[k] = {text, bundles:[]}; if (voices) SOUND_SRC[k].voices = voices; if (voice) SOUND_SRC[k].voice = voice; }
  else if (nz(SOUND_SRC[k].text) !== nz(text)) console.warn('Ton-Kollision:', k);
  if (!SOUND_SRC[k].bundles.includes(bundle)) SOUND_SRC[k].bundles.push(bundle);
}
(function buildSoundIndex(){
  TOPICS.forEach(t => t.lessons.forEach(l => {
    const b = bundleOf(t, t.lessons.indexOf(l));
    (l.words||[]).forEach(([it]) => regSound(it, b));
    (l.sentences||[]).forEach(([it]) => regSound(it, b));
    if (l.reading) regSound(l.reading.text, b);
  }));
  TOPICS.forEach(t => (t.stories||[]).forEach(st => {
    const g = storyBundle(t, st);
    regSound(st.text, st.long ? g : bundleOf(t, st.after), st.voices);
    storySentences(st).forEach(x => regSound(x.it, g, null, x.voice));
    (st.words || []).forEach(([it]) => regSound(it, g));
  }));
  TOPICS.forEach(t => Object.entries((MORE[t.id] || {}).practice || {}).forEach(([st, list]) => list.forEach(([it]) => regSound(it, t.id + '-' + st + 'x'))));
  VERBS.forEach(v => TENSE_KEYS.forEach(tn => PERS.forEach((_,p) => regSound(vform(v,tn,p), 'verbi-' + tn))));
  GRAMMAR.forEach(g => g.blocks.forEach(b => (b.ex||[]).forEach(([it]) => regSound(it, 'grammatica'))));
  WHICH_TENSE.forEach(([it]) => regSound(it, 'grammatica'));
  CLOZE.forEach(c => regSound(c[4], 'grammatica'));
})();
const hasSound = t => !!SOUND_SRC[slug(t)];
const spkIf = (t, lg) => hasSound(t) ? spkBtn(t, lg) : '';

/* ---------- Offline: alle Tonbündel in den Speicher der Web-App legen ---------- */
async function saveOffline(btn){
  const msg = document.getElementById('offmsg');
  btn.disabled = true;
  try{
    try{ await navigator.storage.persist(); }catch(e){}
    const idx = await soundIndex, ids = Object.keys(idx).filter(k => k !== '_v');
    const cache = await caches.open('cp-sounds');
    const old = await cache.keys();
    let n = 0, fail = 0;
    for (const id of ids){
      const url = new URL(soundFile(idx, id), location.href).href;
      if (!(await cache.match(url))){
        try{
          const r = await fetch(url, {cache:'no-store'});
          if (!r.ok) throw 0;
          await cache.put(url, r);
          await Promise.all(old.filter(q => q.url !== url && q.url.split('?')[0] === url.split('?')[0]).map(q => cache.delete(q)));
        }catch(e){ fail++; }
      }
      msg.textContent = `Speichere Töne … ${++n} von ${ids.length}`;
    }
    if (fail){ msg.textContent = `${fail} Tondateien konnten nicht geladen werden. Prüf die Internetverbindung und tipp nochmal.`; }
    else { S.offlineAt = today(); save(); msg.textContent = 'Fertig! Die App funktioniert jetzt auch ohne Internet.'; btn.textContent = 'Offline gespeichert ✓ · auf neue Töne prüfen'; }
  }catch(e){ msg.textContent = 'Das Speichern hat nicht geklappt. Tipp bitte nochmal.'; }
  btn.disabled = false;
}

app.addEventListener('click', e => {

  if (b.hasAttribute('data-mic')) return toggleMic();
  if (b.hasAttribute('data-rec')) return startRec(b);

  if (b.hasAttribute('data-fresh')) return RESUME && RESUME.fresh();
  if (b.dataset.slow){ speak(b.dataset.slow, 0.7); return; }
  if (b.dataset.speak){ speak(b.dataset.speak); return; }

  if (b.hasAttribute('data-arate')){ S.arate = S.arate === 0.8 ? 1 : 0.8; save(); player.playbackRate = S.arate; document.querySelectorAll('[data-arate]').forEach(x => x.textContent = rateLabel()); return; }
  if (b.hasAttribute('data-showtxt')){ L.showTxt = true; return renderStep(); }

  if (b.hasAttribute('data-openonly')){ S.openOnly = !S.openOnly; save(); const y = scrollY; renderTopic(lastTopic); scrollTo(0, y); return; }
  if (b.dataset.stage){ const [tid, st] = b.dataset.stage.split(':'); return startPractice(tid, +st); }
  if (b.dataset.folder) return renderFolder(b.dataset.folder);
  if (b.dataset.practice) return practiceFolder(b.dataset.practice);
  if (b.dataset.chap) return renderChapter(b.dataset.chap);
  if (b.dataset.verb) return renderVerbTable(b.dataset.verb);
  if (b.dataset.vset){ VSEL.set = b.dataset.vset; return renderVerbs(); }
  if (b.dataset.tset){ VSEL.tense = b.dataset.tset; return renderVerbs(); }
  if (b.hasAttribute('data-startverbs')) return startVerbs();
  if (b.hasAttribute('data-starttenses')) return startTenses();
  if (b.hasAttribute('data-restart')) return lastRestart && lastRestart();
  if (b.dataset.lesson) return startLesson(b.dataset.t, b.dataset.lesson);
  if (b.dataset.topic && !L) return renderTopic(b.dataset.topic);
  if (b.hasAttribute('data-quit')) return go(!L ? 'home' : L.topic.pseudo ? L.topic.backTo : 'topic:' + L.topic.id);
  if (b.hasAttribute('data-tr')){ const tr = document.getElementById('tr'); tr.hidden = !tr.hidden; b.textContent = tr.hidden ? 'Übersetzung anzeigen' : 'Übersetzung ausblenden'; return; }
  if (!L) return;
  const c = L.cur;
  if (b.hasAttribute('data-prev')) return stepBack();
  if (b.hasAttribute('data-now')){ L.back = null; return renderStep(); }
  if (c.mode === 'review' && b.id === 'main') return stepForward();

  if (c.mode === 'speak' && b.id === 'main') return speakDone(true);
  if (c.mode === 'speak' && b.id === 'again') return speakAgain();
  if (c.mode === 'speak' && b.hasAttribute('data-later')) return speakDone(false);
  if (b.id === 'main'){
    if (c.mode==='next' || c.mode==='continue') return next();
    if (c.mode==='match'){ return finishMatch(); }
    return check();
  }
  if (c.checked) return;

  if (b.dataset.opt !== undefined){
    document.querySelectorAll('[data-opt]').forEach(x => x.setAttribute('aria-pressed', x===b ? 'true':'false'));
    c.answer = b.dataset.opt; setReady(true);
    if (c.st.itOpts) speak((c.st.sayOf || {})[b.dataset.opt] || b.dataset.opt);
  }
  if (b.dataset.tile !== undefined){
    const i = +b.dataset.tile;
    c.picked.push(i); b.classList.add('used');
    const chip = document.createElement('button'); chip.className = 'wt'; chip.textContent = c.st.tiles[i]; chip.dataset.back = i;
    if (c.st.order) speak(c.st.clipOf[c.st.tiles[i]]);
    document.getElementById('ansline').appendChild(chip);
    setReady(c.picked.length > 0);
  }
  if (b.dataset.back !== undefined){
    const i = +b.dataset.back;
    c.picked = c.picked.filter(x => x !== i); b.remove();
    document.querySelector(`[data-tile="${i}"]`).classList.remove('used');
    setReady(c.picked.length > 0);
  }
  if (b.dataset.ml !== undefined || b.dataset.mr !== undefined) matchTap(b);
});

function matchTap(b){
  const m = L.cur.m, pairs = L.cur.st.pairs;
  if (b.classList.contains('gone')) return;
  const side = b.dataset.ml !== undefined ? 'L' : 'R';
  document.querySelectorAll(side==='L' ? '[data-ml]' : '[data-mr]').forEach(x => x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  if (side==='L'){ m.selL = b; speak(b.dataset.ml); } else m.selR = b;
  if (m.selL && m.selR){
    const L1 = m.selL, R1 = m.selR; m.selL = m.selR = null;
    const hit = pairs.some(p => p.it===L1.dataset.ml && p.de===R1.dataset.mr);
    [L1,R1].forEach(x => x.setAttribute('aria-pressed','false'));
    if (hit){
      [L1,R1].forEach(x => { x.classList.add('right'); setTimeout(() => { x.classList.remove('right'); x.classList.add('gone'); x.disabled = true; }, 350); });
      if (++m.done === pairs.length){ setReady(true); }
    } else {
      m.miss++;
      [L1,R1].forEach(x => { x.classList.add('wrong','flash'); setTimeout(() => x.classList.remove('wrong','flash'), 400); });
    }
  }
}
function finishMatch(){
  const m = L.cur.m, st = L.cur.st;
  L.cur.checked = true; L.cur.mode = 'continue';
  if (!st.retry){ L.graded++; if (!m.miss){ L.right++; } L.xp += m.miss ? 5 : 10; }
  next();
}
